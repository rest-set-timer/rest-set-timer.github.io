 ['b','כיצד הניגוד בין החברה לדובר מעצב את האהבה בהיא יושבה לחלון?',['יחס שופט ומרכל של החברה','מבט אוהב ומגן של הדובר','פרוצה מול ברה, בעיניכם מול בעיני','הצהרת השייכות כנגד הרכילות'],'בהיא יושבה לחלון מאת ביאליק החברה שופטת את האהובה, ואילו הדובר מגן עליה. "בעיניכם היא פרוצה ובעיני היא ברה" מציג שתי נקודות מבט מנוגדות. הניגוד אינו מוכיח שהרכילות נכונה, אלא מדגיש את בחירתו של האוהב לראות בה טוהר. כנגד דיבורי הבריות הוא מצהיר "רחלה לי היא ואנכי לרחל". כך התנגדות הסביבה מחדדת את הנאמנות שהוא מבטא.'],

 ['y','כיצד פתיחת יגון מכינה להבנת מצבו של יונה?',['תיאור יונה מכונס, כפוף ומכוסה שלג','עיר מהירה ורועשת מול חוסר תנועה','הקבלה לסוסה והאנשתה','קישור לכאב ולזרות, בלי המשך העלילה'],'ביגון מאת אנטון צ\'כוב יונה מתואר בתחילה כמכונס, כפוף ומכוסה שלג, כמעט ללא תנועה. הופעתו מרמזת על קיפאון נפשי וניתוק. מולו העיר רועשת וממהרת, והניגוד מבליט את זרותו בתוך ההמון. הסוסה מתוארת כדוממת וכשקועה במחשבות. ההאנשה וההקבלה לבעליה מעמידות שני יצורים חלשים וזרים מול המרחב העירוני. כך הפתיחה מכינה לבדידות שתתגלה בניסיונותיו לשתף בכאבו.'],
 ['y','השוו בין שני המפגשים והסבירו את בדידותו של יונה.',['דמיון: צרכי הנוסעים והיעדר הקשבה מתמשכת','הבדל: עניין קצר אצל איש הצבא מול לעג ואלימות','ההקלה הזמנית בנוכחות הצעירים','עזיבתם וחזרת היגון, רק עד גבול החומר'],'בשני המפגשים ביגון יונה מנסה לספר על מות בנו, אך הנוסעים עסוקים בנסיעה ואינם מקשיבים לאורך זמן. איש הצבא מגלה עניין קצר בשאלה על סיבת המוות, אך מאיץ ביונה ובהמשך עוצם עיניים. אצל הצעירים מתווספים לעג ואלימות; התגובה הכללית "כולנו נמות" מחליפה התייחסות אישית. למרות הפגיעה, נוכחותם מקלה זמנית את בדידותו. כשיעזבו, יגונו ישוב בעוצמה. לכן הסיפור מבחין בין הימצאות בקרבת אנשים לבין קשר שיש בו הקשבה.']

 flash:[['z','מי המחברת ומהו המתח המרכזי?','רחל. ייאוש מן המפגש מול נאמנות והמתנה לאהוב.'],['z','אישי, כללי, אישי. הסבירו.','פנייה לאהוב; הכללה על דרכי האדם; חזרה להבטחה אישית לחכות.'],['z','רחוקי שלי: אמצעי ומשמעות','צירוף מנוגד. מרחק במרחב לצד קרבה ושייכות רגשית.'],['z','עד יכבו חיי: אמצעי ומשמעות','מטפורה. החיים כאור או אש, וההמתנה עד תום החיים.'],['z','כחכות רחל לדודה: אמצעים ומשמעות','דימוי וארמז מקראי לרחל ויעקב. דודה הוא אהובה. מדגיש נאמנות והמתנה.'],['z','נפגשות לדק, נפרדות לעד','ניגוד והקבלה בין רגע פגישה קצר לפרידה ממושכת.'],['b','מי הדובר ומי האהובה?','דובר גבר בשיר של ביאליק. האהובה היא רחלה, וקולה אינו נשמע.'],['b','בעיניכם / בעיני; פרוצה / ברה','ניגוד בין שיפוט החברה ליחס האוהב. ברה פירושה טהורה.'],['b','מה תפקיד הפזמון?','לשמר את המרירות והמצוקה וליצור אופי עממי וקליט.'],['b','אין עמי הנשמה: אמצעי ומשמעות','מטפורה: היעדר האהובה כחסרון הנפש והמשמעות.'],['b','שיבולים וגבעולים כשליחים','האנשה. פנייה לטבע כדי לגשר על המרחק מן האהובה.'],['b','מה לא מסיקים מכך שרחלה איננה?','לא מסיקים שמתה. זו היעדרות מהדובר, לא הוכחה למוות.'],['y','המחבר, הגיבור ומקור הכאב','אנטון צ\'כוב; יונה פוטאפוב, עגלון; מות בנו וחוסר אדם שיקשיב.'],['y','מה מדגיש המוטו?','למי אשיח יגוני: הצורך למצוא נמען לשיתוף בכאב.'],['y','ניגוד בפתיחה','יונה וסוסתו דוממים ואיטיים מול עיר מהירה ורועשת.'],['y','מה ההבדל בין הנוסעים?','איש הצבא מגלה עניין קצר ונאטם; אצל הצעירים מתווספים לעג ואלימות. בשניהם אין הקשבה מתמשכת.'],['y','מדוע המחיר אינו העיקר ליונה?','הצורך בחברה כה עז, שעצם נוכחות נוסעים חשובה לו יותר מן התמורה.'],['y','מה קורה בסוף המפגש השני?','הצעירים עוזבים, ההקלה הזמנית חולפת ויגונו של יונה חוזר בעוצמה. כאן גבול החומר.'],['all','איך הופכים מושג לתשובת מבחן?','טענה, ראיה מהיצירה, הסבר תפקיד האמצעי וקישור לשאלה.'],['all','מהי האנשה?','ייחוס פעולה או תכונה אנושית ללא-אנושי, למשל צמחים הנושאים שלום.'],['all','מה ההבדל בין מוטו לאקספוזיציה?','מוטו הוא משפט מקדים המכוון לקריאה; אקספוזיציה מציגה רקע נחוץ להבנת העלילה.']]

const app=document.getElementById('app'),nav=document.getElementById('nav');
const KEY='exam-lab:'+CONTENT.id;
const empty=()=>({answers:{},known:[],drafts:{},checks:{}});
let store=empty(),storageOK=true;
try{store={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){storageOK=false}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topic=id=>CONTENT.topics.find(t=>t.id===id)?.name||'כללי';
const topicSelect=(id,all=true)=>`<label for="${id}">נושא לתרגול</label><select id="${id}">${all?'<option value="all">כל הנושאים</option>':''}${CONTENT.topics.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>`;
const shuffle=a=>{let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
let screen='home',queue=[],position=0,sessionCorrect=0,sessionAnswered=0,chosen=null,flashQueue=[],flashPos=0,revealed=false,summaryTopic=CONTENT.topics[0].id,openIdx=0;
const wrong=()=>Object.keys(store.answers).filter(i=>store.answers[i]===false).map(Number);
function go(s){screen=s;render();window.scrollTo({top:0,behavior:'instant'})}
function renderNav(){nav.innerHTML=[['home','⌂','בית'],['quiz','✓','תרגול'],['flash','▤','כרטיסיות'],['summary','≡','סיכומים'],['open','✎','כתיבה']].map(([id,icon,label])=>`<button data-go="${id}" class="${screen===id?'active':''}" ${screen===id?'aria-current="page"':''}><b aria-hidden="true">${icon}</b>${label}</button>`).join('');nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function head(title,sub){return `<div class="top"><h1>${title}</h1><span class="pill">${CONTENT.subject}</span></div>${sub?`<p class="muted">${sub}</p>`:''}`}
function render(){renderNav();if(screen==='home')home();if(screen==='quiz')quizSetup();if(screen==='flash')flashSetup();if(screen==='summary')summary();if(screen==='open')openPractice()}
function home(){let done=Object.keys(store.answers).length,correct=Object.values(store.answers).filter(Boolean).length;app.innerHTML=`<header class="brand"><strong>לקראת <span style="color:var(--green)">100</span></strong><span class="edition">מהדורת ${CONTENT.subject}</span></header><section class="hero"><div class="eyebrow">המבחן הבא · ${CONTENT.date}</div><h1>${esc(CONTENT.title).replace('\n','<br>')}</h1><p class="muted">לומדים את הרעיון. זוכרים את הראיה.<br>מתרגלים להסביר, לא רק לזהות.</p></section><section class="card accent"><div class="row"><h2>סבב קטן, הבדל גדול</h2><span aria-hidden="true" style="font-size:30px">↖</span></div><p>10 שאלות עם הסבר מיידי. הטעויות נשמרות לסיבוב תיקון.</p><button class="primary full" id="quick">מתחילים לתרגל ←</button></section><div class="stats"><div class="stat"><strong>${done}/${CONTENT.questions.length}</strong><span>שאלות שנענו</span></div><div class="stat"><strong>${done?Math.round(correct/done*100)+'%':'—'}</strong><span>נכונות בניסיון האחרון</span></div><div class="stat"><strong>${wrong().length}</strong><span>טעויות לתיקון</span></div></div><div class="grid"><button class="tile" data-mode="quiz"><div class="icon">✓</div><strong>תרגול חכם</strong><span>שאלות, הסברים ותיקון טעויות</span></button><button class="tile" data-mode="flash"><div class="icon">▤</div><strong>כרטיסיות</strong><span>ציטוט, אמצעי ומשמעות</span></button><button class="tile" data-mode="summary"><div class="icon">≡</div><strong>סיכומים</strong><span>כל יצירה, בלי להתפזר</span></button><button class="tile" data-mode="open"><div class="icon">✎</div><strong>תשובת מבחן</strong><span>כותבים, משווים ומשפרים</span></button></div><section class="card"><h2>מה נכנס למבחן?</h2>${CONTENT.topics.map(t=>`<div class="topicline"><div><strong>${t.name}</strong><br><span>${t.author}</span></div><span>${CONTENT.questions.filter(q=>q[0]===t.id).length} שאלות</span></div>`).join('')}<p class="small muted">${CONTENT.boundary}</p></section><section class="hint">לציון גבוה צריך גם תשובות פתוחות: טענה + ראיה + הסבר. אחוזי ההצלחה באפליקציה אינם תחזית לציון במבחן.</section><p class="status">${storageOK?'ההתקדמות נשמרת אוטומטית בדפדפן הזה, לא בין מכשירים.':'שמירה אינה זמינה בדפדפן זה. ההתקדמות תישמר רק כל עוד הדף פתוח.'}</p><p class="small muted">במבחן הבא שולחים את הנושאים בשיחה, והאפליקציה תעודכן באותו קישור. אין צורך להזין כאן חומר.</p>`;document.getElementById('quick').onclick=()=>{screen='quiz';renderNav();startQuiz('all',10,false)};app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>go(b.dataset.mode))}
function quizSetup(){app.innerHTML=head('בונים ביטחון','בוחרים נושא וסבב. אחרי כל תשובה תקבלו הסבר, גם כשהיא נכונה.')+`<section class="card">${topicSelect('qtopic')}<label for="qcount">אורך הסבב</label><select id="qcount"><option value="10">10 שאלות</option><option value="20">20 שאלות</option><option value="999">כל השאלות בנושא</option></select><button class="primary full" id="start" style="margin-top:24px">מתחילים סבב ←</button></section><section class="card"><h2>חוזרים על מה שפספסנו</h2><p class="muted">כרגע יש ${wrong().length} שאלות לתיקון. תשובה נכונה בסבב הבא תוציא שאלה מרשימת הטעויות.</p><button class="secondary full" id="mistakes" ${wrong().length?'':'disabled'}>תרגול טעויות בלבד</button></section><p class="small muted">השאלות נכתבו לתרגול מתוך סיכום הלימוד, ואינן שאלות מבחן רשמיות.</p>`;document.getElementById('start').onclick=()=>startQuiz(document.getElementById('qtopic').value,Number(document.getElementById('qcount').value),false);document.getElementById('mistakes').onclick=()=>startQuiz('all',999,true)}
function startQuiz(t,count,onlyWrong){queue=shuffle(CONTENT.questions.map((q,i)=>i).filter(i=>(t==='all'||CONTENT.questions[i][0]===t)&&(!onlyWrong||store.answers[i]===false))).slice(0,count);position=0;sessionCorrect=0;sessionAnswered=0;chosen=null;quizQuestion();window.scrollTo(0,0)}
function quizQuestion(){if(position>=queue.length){quizEnd();return}let idx=queue[position],q=CONTENT.questions[idx];let order=shuffle(q[2].map((a,i)=>i));app.innerHTML=head('תרגול',null)+`<div class="row small muted"><span>${topic(q[0])}</span><span>שאלה ${position+1} מתוך ${queue.length}</span></div><progress value="${position}" max="${queue.length}" aria-label="התקדמות בסבב"></progress><section class="card"><h2 class="q-title">${esc(q[1])}</h2><div id="options">${order.map(i=>`<button class="answer" data-answer="${i}">${esc(q[2][i])}</button>`).join('')}</div><div id="response" aria-live="polite"></div></section><button class="ghost full" id="stop">סיום הסבב וחזרה לבחירה</button>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(idx,Number(b.dataset.answer)));document.getElementById('stop').onclick=()=>go('quiz')}
function answer(idx,a){if(chosen!==null)return;chosen=a;let q=CONTENT.questions[idx],ok=a===q[3];sessionAnswered++;if(ok)sessionCorrect++;store.answers[idx]=ok;save();app.querySelectorAll('[data-answer]').forEach(b=>{let n=Number(b.dataset.answer);b.disabled=true;if(n===q[3])b.classList.add('correct');else if(n===a)b.classList.add('wrong')});document.getElementById('response').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'נכון. בדיוק כך.':'עוד רגע, מדייקים.'}</strong><p>${esc(q[4])}</p>${ok?'':`<p class="small">התשובה הנכונה: ${esc(q[2][q[3]])}</p>`}</div><button class="primary full" id="next">${position+1===queue.length?'לסיכום הסבב':'לשאלה הבאה ←'}</button>`;document.getElementById('next').onclick=()=>{position++;chosen=null;quizQuestion();window.scrollTo(0,0)}}
function quizEnd(){app.innerHTML=head('סבב הושלם',null)+`<section class="card center"><div class="eyebrow">תוצאה בסבב הזה</div><div class="score">${sessionAnswered?Math.round(sessionCorrect/sessionAnswered*100):0}%</div><p>${sessionCorrect} תשובות נכונות מתוך ${sessionAnswered}</p><p class="muted">${sessionCorrect===sessionAnswered?'יפה. עכשיו נסו לנסח תשובה פתוחה בלי להסתכל.':'הטעויות נשמרו. חזרה קצרה על ההסברים תעזור בסבב הבא.'}</p><button class="primary full" id="again">עוד סבב</button><button class="secondary full" id="write" style="margin-top:10px">לתרגול תשובה פתוחה</button></section><p class="small muted">זהו ציון תרגול בלבד, לא הערכת ציון לבחינה.</p>`;document.getElementById('again').onclick=()=>go('quiz');document.getElementById('write').onclick=()=>go('open')}
function flashSetup(){app.innerHTML=head('זוכרים ומסבירים','קראו את השאלה, נסו לענות בקול ורק אז חשפו את התשובה.')+`<section class="card">${topicSelect('ftopic')}<label for="fmode">אילו כרטיסיות?</label><select id="fmode"><option value="all">כל הכרטיסיות</option><option value="new">רק מה שעוד לא סימנתי כידוע</option></select><p class="small muted">${store.known.length} מתוך ${CONTENT.flash.length} כרטיסיות סומנו כידועות.</p><button class="primary full" id="fstart">פותחים כרטיסיות ←</button></section>`;document.getElementById('fstart').onclick=()=>{let t=document.getElementById('ftopic').value,mode=document.getElementById('fmode').value;flashQueue=shuffle(CONTENT.flash.map((q,i)=>i).filter(i=>(t==='all'||CONTENT.flash[i][0]===t)&&(mode==='all'||!store.known.includes(i))));flashPos=0;revealed=false;flashCard()}}
function flashCard(){if(flashPos>=flashQueue.length){app.innerHTML=head('הסבב מאחוריכם',null)+`<section class="card center"><h2>${flashQueue.length?'יפה. המושגים מתחברים.':'אין כרטיסיות חדשות בבחירה הזו.'}</h2><p class="muted">אפשר לחזור לכל הכרטיסיות, גם לאלה שכבר סימנתם.</p><button class="primary" id="freturn">בחירת כרטיסיות</button></section>`;document.getElementById('freturn').onclick=()=>go('flash');return}let idx=flashQueue[flashPos],f=CONTENT.flash[idx];app.innerHTML=head('כרטיסיות',null)+`<div class="row small muted"><span>${topic(f[0])}</span><span>${flashPos+1} / ${flashQueue.length}</span></div><progress value="${flashPos}" max="${flashQueue.length}" aria-label="התקדמות בכרטיסיות"></progress><section class="card flash"><span class="chip">נסו קודם בלי להציץ</span><h2 class="prompt">${esc(f[1])}</h2>${revealed?`<div class="solution">${esc(f[2])}</div>`:`<button class="primary" id="reveal">חשיפת תשובה</button>`}</section>${revealed?'<div class="actions"><button class="primary" id="known">ידעתי ✓</button><button class="secondary" id="unknown">צריך חזרה ↻</button></div>':''}<button class="ghost full" id="fback" style="margin-top:18px">לבחירת כרטיסיות</button>`;if(!revealed)document.getElementById('reveal').onclick=()=>{revealed=true;flashCard()};else{document.getElementById('known').onclick=()=>flashRate(idx,true);document.getElementById('unknown').onclick=()=>flashRate(idx,false)}document.getElementById('fback').onclick=()=>go('flash')}
function flashRate(idx,known){store.known=store.known.filter(i=>i!==idx);if(known)store.known.push(idx);save();flashPos++;revealed=false;flashCard();window.scrollTo(0,0)}
function summary(){let t=CONTENT.topics.find(t=>t.id===summaryTopic);app.innerHTML=head('מבינים את היצירה',null)+`<div class="section-tab">${CONTENT.topics.map(t=>`<button data-topic="${t.id}" class="${summaryTopic===t.id?'active':''}">${t.name}</button>`).join('')}</div><section class="card accent"><span class="eyebrow">${t.author}</span><h2>${t.name}</h2><p>${t.intro}</p></section><section class="card">${t.points.map(([h,p])=>`<h3>${h}</h3><p class="muted">${p}</p>`).join('')}</section><section class="card"><h2>ציטוט ← אמצעי ← משמעות</h2>${t.quotes.map(([q,e])=>`<div class="quote"><strong>״${q}״</strong><p>${e}</p></div>`).join('')}</section><section class="hint"><strong>דיוק ששומר על הנקודות</strong><p>${t.caution}</p></section><section class="card"><h2>הופכים הבנה לתשובה</h2><p class="muted">אל תסתפקו בשם האמצעי. חברו אותו לרעיון והוכיחו מתוך היצירה.</p><button class="primary full" id="swrite">מתרגלים כתיבה ←</button></section><details><summary>מקור התוכן והיקף החומר</summary><p class="small muted">${CONTENT.note}</p><p class="small muted">${CONTENT.sourceLabel}</p></details>`;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{summaryTopic=b.dataset.topic;summary();window.scrollTo(0,0)});document.getElementById('swrite').onclick=()=>{openIdx=CONTENT.open.findIndex(q=>q[0]===summaryTopic);go('open')}}
function openPractice(){let q=CONTENT.open[openIdx];app.innerHTML=head('כותבים תשובת מבחן','לא רק לזהות תשובה. לבנות טענה, ראיה והסבר במילים שלכם.')+`<label for="openq">בחרו שאלה</label><select id="openq">${CONTENT.open.map((q,i)=>`<option value="${i}" ${i===openIdx?'selected':''}>${topic(q[0])}: ${q[1]}</option>`).join('')}</select><section class="card"><span class="chip">${topic(q[0])}</span><h2 style="margin-top:12px">${esc(q[1])}</h2><p class="hint">מבנה שימושי: שם היצירה והמחבר ← טענה ← ראיה קצרה ← הסבר ← קישור לשאלה.</p><label for="draft">התשובה שלכם</label><textarea id="draft" placeholder="כתבו כאן, או ענו בקול לפני חשיפת הדוגמה...">${esc(store.drafts[openIdx]||'')}</textarea><p class="status" id="draftstatus">${storageOK?'הטיוטה נשמרת בדפדפן הזה בזמן הכתיבה.':'שמירה אינה זמינה. אין להסתמך על שמירת הטיוטה.'}</p><button class="primary full" id="showmodel">סיימתי, משווים לדוגמה</button><div id="model" aria-live="polite"></div></section><p class="small muted">הבדיקה עצמית, לא ציון אוטומטי. תשובה אחרת יכולה להיות טובה אם היא מדויקת, מנומקת ועונה על השאלה.</p>`;document.getElementById('openq').onchange=e=>{openIdx=Number(e.target.value);openPractice()};document.getElementById('draft').oninput=e=>{store.drafts[openIdx]=e.target.value;save();document.getElementById('draftstatus').textContent=storageOK?'הטיוטה נשמרה בדפדפן הזה.':'לא ניתן לשמור בדפדפן זה. השאירו את הדף פתוח.'};document.getElementById('showmodel').onclick=()=>{document.getElementById('showmodel').hidden=true;document.getElementById('model').innerHTML=`<div class="feedback"><strong>תשובה לדוגמה, לא נוסח שחייבים לשנן</strong><p>${esc(q[3])}</p></div><h3>בדיקה עצמית</h3><div class="checklist">${q[2].map((c,i)=>`<label><input type="checkbox" data-check="${i}" ${store.checks[openIdx+':'+i]?'checked':''}><span>${c}</span></label>`).join('')}</div><p class="small muted">סמנו רק מה שבאמת מופיע בתשובה שלכם. חסר משהו? הוסיפו בטיוטה.</p>`;app.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{store.checks[openIdx+':'+c.dataset.check]=c.checked;save()})}}
render();
</script></body></html>
