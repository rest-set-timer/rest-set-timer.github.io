const CONTENT = {
 id:'lashon-2026-11-30-v1',subject:'לשון',date:'30.11.2026',title:'לשון.\nבאים מוכנים.',
 scope:'כתיבה ממזגת: סקירה · שם המספר · תורת הצורות',
 boundary:'בתורת הצורות נכללות רק הגזרות שנלמדו: שלמים, מרובעים וחסרי פ״ן, ועוד שם הפועל ושם פעולה, סביל ופעיל, צורת הבינוני, שורשים, בניינים, גוף וזמן.',
 sourceLabel:'מקור הלימוד: חוברת התרגול בלשון וקובץ התרגול לבגרות שנמסרו לפני הבחינה. האפליקציה אינה מחליפה את החומר מהכיתה.',
 note:'התרגול מבוסס על חוברת התרגול ועל קובץ הבגרות. השאלות נכתבו לתרגול בסגנון הקבצים ואינן שאלות מבחן רשמיות. הגדרות וכללים מדויקים — לפי מה שנלמד בכיתה; יש להשלים דגשי מורה מהמחברת.',
 topics:[
 {id:'k',name:'כתיבה ממזגת: סקירה',author:'מקורות, סינתזה ואזכור',intro:'כתיבה ממזגת היא קריאה של כמה טקסטים בנושא אחד וכתיבה של טקסט חדש, שמשלב את המידע מהם לפי הקריטריונים של המטלה ומציין מאיזה מקור הוא נלקח. סקירה היא טקסט כזה: מציגה את הנושא מתוך המקורות, בארגון משלך ובלי העתקה.',
 points:[['מהי סקירה','טקסט מסכם ומסודר על נושא מסוים, שנכתב על סמך מקורות מידע (מאמרים). הכותב לא מביע דעה אישית ולא מספר חוויה; הוא מציג את המידע מהמקורות כמות שהוא, בארגון חדש.'],['מיזוג מידע מכמה מקורות','בוחרים מכל מקור את המידע שהמטלה דורשת, מאחדים מידע דומה, מסננים מידע עודף וחוזר, ומארגנים לפי תתי־נושאים ולא לפי מקור. כך נוצר טקסט אחד ולא סיכום נפרד של כל מאמר.'],['לפי הקריטריונים של המטלה','המטלה קובעת על מה לכתוב, על סמך אילו מקורות ובאיזה היקף. מי שסוטה מהנושא או כותב על סמך המקור הלא נכון מאבד נקודות. קוראים את ההנחיה לפני הקריאה ואחריה.'],['ניסוח במילים שלך','לא מעתיקים משפטים כמו שהם. מנסחים מחדש, בלשון כללית, ומקצרים. ציטוט ישיר נדיר ומסומן.'],['אזכור מקורות','מציינים בגוף הטקסט מאיזה מקור נלקח המידע, למשל לפי המאמר של פלוני או במאמר 1, ובסוף כותבים רישום של המקורות לפי ההנחיות. לא מערבבים מידע בלי לציין מקורו.'],['מבנה ולשון','כותרת, מבוא המציג את הנושא ואת המקורות, גוף בתתי־נושאים, וסיום מסכם. לשון תקנית, מילות קישור בין פסקאות.']],
 quotes:[['מבוא','מציג את הנושא ואת המקורות שעליהם הסקירה נשענת.'],['על פי מאמר 1','אזכור מקור בגוף הטקסט: מציינים מאיפה המידע.'],['לעומת זאת','מילת קישור שמראה השוואה בין מקורות או בין עמדות.']],
 caution:'הדרישות המדויקות במבחן (אורך, מספר המקורות, צורת האזכור והרישום) הן לפי ההנחיות של המורה ושל המטלה. כאן מתרגלים את העיקרון: מידע מכמה מקורות, לפי הקריטריונים, עם ציון מקורות.'},
 {id:'m',name:'שם המספר',author:'מניין, סידורי והתאמה',intro:'שם מספר מציין כמות או סדר. הנושא הכי נופל במבחנים הוא ההתאמה בין צורת המספר למגדר שם העצם, בעיקר במספרים 3–10, שם הכלל הפוך מהאינטואיציה.',
 points:[['סוגי שמות מספר','מספר מניין: אחד, שתיים, עשרים וחמש. מספר סידורי: ראשון, שני, עשירי. מספר כפול: פעמיים, שלוש פעמים. שברים: חצי, שליש, רבע.'],['ההתאמה ההפוכה (3–10)','הצורה עם סיומת ה (שלושה, שבעה, תשעה) מצטרפת לשם עצם זכר: שלושה ילדים. הצורה בלי ה (שלוש, שבע, תשע) מצטרפת לשם עצם נקבה: שלוש בנות. הפוך ממה שהאוזן מצפה.'],['שניים ושתיים','יוצאי הדופן: כאן ההתאמה רגילה ולא הפוכה. לפני שם העצם: שני ילדים, שתי בנות. בלי שם עצם: הילדים הם שניים, הבנות הן שתיים.'],['11–19','אחד עשר לזכר, אחת עשרה לנקבה; שנים עשר לזכר, שתים עשרה לנקבה. שם העצם בדרך כלל ביחיד: אחד עשר תלמיד, אחת עשרה תלמידה.'],['עשרות, מאות ואלפים','עשרים, שלושים וכן הלאה אינם מושפעים ממגדר; שם העצם יכול להיות ביחיד או ברבים: עשרים תלמיד או עשרים תלמידים. מאה, מאתיים, שלוש מאות; אלף, אלפיים, שלושת אלפים.'],['סידורי','צורות מיוחדות מראשון עד עשירי בלבד. מעל עשרה משתמשים במספר המניין: השיעור עשרים ושלוש, לא עשרים־ושלישי.']],
 quotes:[['שלושה ילדים מול שלוש בנות','ההתאמה ההפוכה: סיומת ה־ במספר מסמנת שם עצם זכר, וצורה בלי ה־ מסמנת שם עצם נקבה.'],['אחת עשרה תלמידה, אחד עשר תלמיד','במספרים 11–19 המספר מותאם במגדר לשם העצם, ושם העצם נשאר ביחיד.'],['שלושת האחים','צורת הסמיכות של שלושה: שלושת + שם עצם נוכר.'],['שליש מול שלישי','שליש הוא שבר (שליש מהעוגה); שלישי הוא מספר סידורי (התלמיד השלישי).']],
 caution:'לא בוחרים צורה לפי מה שנשמע יפה: קודם קובעים את מגדר שם העצם, ואז מיישמים את הכלל ההפוך. זוכרים ששניים ושתיים הם היוצא דופן.'},
 {id:'t',name:'תורת הצורות',author:'שורש, בניין, גזרה, גוף וזמן',intro:'ניתוח צורה מלא עונה על חמש שאלות: מה השורש, מה הבניין או המשקל, מהי הגזרה, באיזה גוף ובאיזה זמן. בחוברת ובקובץ הבגרות התרגול עובד שוב ושוב על אותן שאלות.',
 points:[['שורש ובניין','השורש הוא צרור האותיות המשותף למשפחת מילים ונושא את משמעות הליבה: כתב, נכתב, כותב, מכתב, כתיבה — כולם כ.ת.ב. הבניין הוא תבנית הגזירה של הפועל, ויש שבעה: פעל, נפעל, פיעל, פועל, הפעיל, הופעל, התפעל.'],['גזרת השלמים','שורש תקין בן שלוש אותיות שכולן מופיעות בכל הצורות: כתב, כותב, יכתוב, הכתיב, התכתב. זו הגזרה שאליה משווים את כל השאר.'],['גזרת המרובעים','שורש בן ארבע אותיות הנגזר כגוש אחד: תִּרְגֵּם, תּוֹרְגַּם, הִתְרַגֵּם (ת.ר.ג.מ). אין חוסרים; הארבע אותיות הן הבסיס.'],['גזרת חסרי פ״ן (חפ״ן)','שורש שהאות נו״ן הראשונה נושרת בחלק מהצורות: נָפַל אבל יִפֹּל, פֹּל, לִפֹּל; וגם בבניין הפעיל: הִפִּיל ולא הִנְפִּיל. דוגמאות נוספות: נתן — יִתֵּן; נגע — יִגַּע; נסע — יִסַּע. הנו״ן נשמרת בצורות אחרות (נפלנו, נופל), ולכן בודקים כמה צורות לפני שמכריעים.'],['שם הפועל ושם פעולה','שם הפועל הוא צורת המקור של הפועל: לכתוב, לשמור, להדריך, להתכתב. שם פעולה הוא שם עצם שמציין את הפעולה עצמה: כתיבה, שמירה, הדרכה, התכתבות. כותב, שומר ומדריך הם צורות בינוני, לא שם הפועל. לכל בניין משקל שם פעולה אופייני: הפעיל — הַקְטָלָה (הדרכה); התפעל — הִתְקַטְּלוּת (התכתבות).'],['סביל ופעיל','בפועל פעיל הנושא מבצע את הפעולה: התלמיד כתב את המכתב. בפועל סביל הנושא מושפע ממנה: המכתב נכתב. הבניינים הסביליים: נפעל, פועל, הופעל. הפעילים: פעל, פיעל, הפעיל. התפעל מבטא בדרך כלל פעולה הדדית או פנימית.'],['צורת הבינוני וגוף וזמן','הבינוני הוא זמן הווה: כותב (בינוני פעיל), נכתב וכתוב (בינוני סביל). הזמנים: עבר, הווה, עתיד וציווי. הגופים: ראשון, שני, שלישי, בזכר ובנקבה, ביחיד וברבים. ציווי קיים רק בגוף שני: כתוב, כתבי, כתבו.']],
 quotes:[['יִפֹּל, פֹּל, לִפֹּל','חפ״ן: הנו״ן נושרת בעתיד, בציווי ובשם הפועל של בניין פעל, אבל נשמרת בעבר (נָפַלְנוּ), בבינוני (נוֹפֵל) ובשם הפעולה (נְפִילָה).'],['הִפִּיל','הפעיל של נפל. גם כאן הנו״ן נשרה, ולכן הִפִּיל ולא הִנְפִּיל. סימן ההיכר לחפ״ן בהפעיל.'],['שם הפועל מול שם פעולה','לכתוב הוא שם הפועל (צורת המקור). כתיבה היא שם פעולה. כותב הוא בינוני.'],['הַתְמָדָה','שם פעולה של בניין הפעיל במשקל הַקְטָלָה, מהפועל הִתְמִיד.'],['נִכְתַּב מול כָּתוּב','שתיהן צורות סביל של כ.ת.ב: נִכְתַּב בעבר בבניין נפעל. כָּתוּב הוא בינוני פעול של בניין פעל (קל).']],
 caution:'גזרה נקבעת לפי בדיקת צורות, לא לפי צליל. בחפ״ן הנו״ן נשמרת בחלק מהצורות (נפלנו, נופל) ונושרת באחרות (יפל, הפיל) — ושתיהן מאותה גזרה. בניתוח מלא רושמים גם גוף וגם זמן, לא רק בניין ושורש.'}

 questions:[
 ['k','מהי כתיבה ממזגת?',['כתיבה של טקסט חדש על סמך כמה מקורות בנושא אחד, לפי הקריטריונים של המטלה ועם ציון המקורות','הבעת דעה אישית על נושא ללא מקורות','סיכום מאמר אחד בלבד','תיאור חוויה אישית בגוף ראשון'],0,'כתיבה ממזגת משלבת מידע מכמה מקורות לטקסט אחד חדש. לא כותבים דעה אישית, ומציינים מאיפה המידע.'],
 ['k','מה מייחד סקירה?',['מציגה מידע על נושא מתוך מקורות, בארגון חדש ובלי דעה אישית','מספרת סיפור עם עלילה','מביעה עמדה ומנסה לשכנע','כוללת רק ציטוטים ארוכים'],0,'סקירה היא טקסט מידעי ומסודר. הכותב מציג את המקורות ולא את עצמו.'],
 ['k','כיצד מארגנים נכון את הסקירה?',['לפי תתי־נושאים, ובכל אחד משלבים מידע מהמקורות','מאמר אחד אחרי השני, כל אחד בנפרד','לפי סדר האלפבית של שמות הכותבים','בלי מבנה, כרצף חופשי'],0,'ארגון לפי נושאים הוא מה שהופך כמה סיכומים לטקסט ממוזג אחד.'],
 ['k','מה עושים עם מידע עודף שחוזר על עצמו במקורות?',['מסננים ומאחדים אותו','מעתיקים אותו כמה פעמים','מוסיפים אותו לסוף בלבד','מוחקים את כל המקור'],0,'מידע כפול או לא רלוונטי מוריד את איכות הסקירה. בוחרים רק מה שהמטלה דורשת.'],
 ['k','מדוע מציינים בסקירה את המקורות?',['כדי להראות מאיזה מקור נלקח כל פרט ולא להציג מידע של אחרים כשלך','כדי להאריך את הטקסט','כדי לכתוב בגוף ראשון','אין צורך, זו בחירה אישית'],0,'אזכור מקור בגוף הטקסט ורישום בסוף מראים מאיפה המידע. זה חלק מהקריטריונים.'],
 ['k','איזה משפט הוא אזכור מקור תקין בגוף הסקירה?',['על פי מאמר 1, האקדמיה עוסקת בקביעת כללי הלשון','לדעתי האקדמיה חשובה מאוד','בכל מקרה כולם יודעים שהאקדמיה חשובה','האקדמיה היא הנושא הכי יפה'],0,'המשפט מציין את המקור ומציג מידע, בלי דעה אישית.'],
 ['k','מי קובע מה הסקירה צריכה לכלול במבחן?',['הקריטריונים וההנחיות של המטלה','טעמו של התלמיד','מספר המילים בלבד','הצבע של הדף'],0,'הנושא, המקורות וההיקף נקבעים במטלה. סטייה מהם מורידה נקודות.'],
 ['k','מה הדרך הנכונה להשתמש במשפט שנלקח ממאמר?',['לנסח אותו מחדש במילים שלך ולציין את המקור','להעתיק אותו מילה במילה בלי ציון','להשמיט את המקור','להוסיף עליו דעה אישית'],0,'העתקה ללא ציון נחשבת כשל. ניסוח מחדש ואזכור הם דרך העבודה הנכונה.'],
 ['m','מדוע נכון "שלושה ילדים" ולא "שלוש ילדים"?',['ההתאמה ההפוכה: צורת ה־ מתאימה לשם עצם זכר','כי ילדים הוא שם עצם נקבה','זו טעות דפוס מקובלת','כי שלושה הוא מספר סידורי'],0,'במספרים 3–10 הכלל הפוך: שלושה, שבעה, תשעה — לזכר; שלוש, שבע, תשע — לנקבה.'],
 ['m','איזה צירוף תקין?',['שבע בנות','שבעה בנות','שבעת בנות הגן','שבעים בנות'],0,'בנות הוא שם עצם נקבה, ולכן המספר בצורה בלי ה־: שבע בנות. שבעת היא צורת סמיכות בלבד.'],
 ['m','לאיזה שם עצם מתאים "אחת עשרה"?',['תלמידה','תלמיד','ספר','שיעור'],0,'אחת עשרה היא צורת הנקבה במספרים 11–19: אחת עשרה תלמידה, אחד עשר תלמיד.'],
 ['m','מהו מספר סידורי?',['מספר המציין מקום בסדר: ראשון, שני, עשירי','מספר המציין כמות: אחד, שתיים','מספר המציין חזרה: פעמיים','חלק מן השלם: חצי'],0,'סידורי עונה על השאלה איזה מספר בסדר. מניין עונה על השאלה כמה.'],
 ['m','כיצד מציינים סדר מעל עשרה?',['במספר המניין: השיעור עשרים ושלוש','בסידורי: השיעור עשרים־ושלישי','בשבר: השיעור שליש','במספר כפול: השיעור שלוש פעמים'],0,'צורות סידוריות מיוחדות קיימות רק מראשון עד עשירי. מעל עשרה משתמשים במניין.'],
 ['m','מה מיוחד ב"שניים/שתיים"?',['ההתאמה רגילה ולא הפוכה: שני ילדים, שתי בנות','הן פועלות לפי הכלל ההפוך','תמיד מצטרפות לזכר','תמיד מצטרפות לנקבה'],0,'שניים ושתיים הם היוצא דופן: שני ילדים לזכר ושתי בנות לנקבה, בלי ההיפוך של 3–10.'],
 ['m','איזו צורה מופיעה ב"שלושת האחים"?',['צורת סמיכות: שלושת + שם עצם נוכר','צורת ניצב','מספר סידורי','שבר'],0,'בסמיכות המספר מסומך: שלושת האחים, שני הילדים, אחד הספרים.'],
 ['m','מהו "שליש" ב"אכלתי שליש מהעוגה"?',['שבר','מספר סידורי','מספר מניין','מספר כפול'],0,'שליש הוא חלק מן השלם (1/3). שלישי עם יו״ד הוא המספר הסידורי.'],
 ['m','מה נכון לגבי "עשרים תלמידים"?',['בעשרות שם העצם יכול להיות ביחיד או ברבים','שם העצם חייב להיות ביחיד','שם העצם חייב להיות ברבים','אסור לצרף שם עצם לעשרות'],0,'עשרים תלמיד ועשרים תלמידים — שתיהן תקינות. ב־11–19 שם העצם בדרך כלל ביחיד.'],
 ['m','מהו "פעמיים"?',['מספר כפול המציין חזרה','מספר סידורי','שבר','מספר מניין'],0,'פעם אחת, פעמיים, שלוש פעמים — מספרים כפולים העונים על השאלה כמה פעמים.'],
 ['m','מה ההבדל בין "שלוש" ל"השלושה"?',['השלושה הוא שם עצם המציין קבוצה, שלוש הוא שם מספר','אין הבדל, זה אותו חלק דיבור','השלושה הוא מספר סידורי','שלוש הוא שם עצם'],0,'השלושה הגיעו — השלושה כאן שם עצם לקבוצה. שלוש בנות — שלוש שם מספר התואר.'],
 ['m','איזו צורה תקינה אחרי מאתיים?',['שלוש מאות','שלושה מאות','שלוש מאה','שלושת מאה'],0,'מאה, מאתיים (צורת זוגי), ואז שלוש מאות, ארבע מאות — המספר בצורת הנקבה בלי ה־.'],
 ['t','מהו שורש?',['צרור אותיות משותף למשפחת מילים, הנושא את משמעות הליבה','אותיות התחילית של הפועל','כל מילה ארוכה','שם אחר לבניין'],0,'כתב, נכתב, כותב, מכתב, כתיבה — כולן חולקות את כ.ת.ב ואת משמעות הליבה של הכתיבה.'],
 ['t','כמה בניינים יש בעברית?',['שבעה','שלושה','עשרה','שניים'],0,'פעל, נפעל, פיעל, פועל, הפעיל, הופעל, התפעל. נפעל, פועל והופעל הם הבניינים הסביליים.'],
 ['t','אילו בניינים הם סביליים?',['נפעל, פועל והופעל','פעל, פיעל והפעיל','כל שבעת הבניינים','רק נפעל'],0,'בבניין סביל הנושא מושפע מהפעולה: המכתב נכתב. בפעיל הנושא מבצע אותה: התלמיד כתב.'],
 ['t','מהי גזרת השלמים?',['שורש בן שלוש אותיות שכולן מופיעות בכל הצורות','שורש בן ארבע אותיות','שורש שהנו״ן שלו נושרת','שורש עם אותיות אהו״י בלבד'],0,'כתב: כותב, יכתוב, הכתיב, התכתב — כל שלוש האותיות מופיעות בכל צורה. זו גזרת הייחוס.'],
 ['t','מה מייחד את גזרת המרובעים?',['שורש בן ארבע אותיות הנגזר כגוש אחד','חוסר באות הראשונה','חוסר באות האחרונה','שתי אותיות בלבד'],0,'תִּרְגֵּם, תּוֹרְגַּם, הִתְרַגֵּם — שורש ת.ר.ג.מ בן ארבע אותיות שאינו מתפרק.'],
 ['t','מהי גזרת חסרי פ״ן (חפ״ן)?',['שורש שהנו״ן הראשונה נושרת בחלק מהצורות','שורש החסר אות ה׳','שורש מרובע','שורש תקין לגמרי'],0,'נָפַל אבל יִפֹּל ופֹּל. הנו״ן נשרה בעתיד, בציווי ובשם הפועל של פעל, וגם בהפעיל: הִפִּיל. בשם הפעולה נְפִילָה היא נשמרת.'],
 ['t','באיזו צורה של נפל הנו״ן נשרה?',['בעתיד בניין פעל: יִפֹּל','בעבר: נָפַל','בבינוני: נוֹפֵל','בשם הפעולה: נְפִילָה'],0,'בעבר ובבינוני הנו״ן מופיעה (נפל, נופל), וכך גם בשם הפעולה נפילה. בעתיד, בציווי ובשם הפועל היא נושרת: יפול, פל, ליפול.'],
 ['t','הִפִּיל — מה ניתוחו?',['הפעיל, שורש נ.פ.ל, גזרת חפ״ן','פעל, שורש פ.ל.ל, גזרת שלמים','נפעל, שורש נ.פ.ל','פיעל, שורש מרובע'],0,'הפעיל של נפל. גם כאן הנו״ן נשרה — לכן הִפִּיל ולא הִנְפִּיל. זה סימן ההיכר לחפ״ן בבניין הפעיל.'],
 ['t','מהו שם הפועל?',['צורת המקור של הפועל: לכתוב, לשמור','מי שמבצע את הפעולה: כותב, שומר','שם עצם של הפעולה: כתיבה, שמירה','תואר של הפועל'],0,'שם הפועל הוא צורת המקור (לכתוב, להדריך). כותב הוא בינוני, וכתיבה היא שם פעולה.'],
 ['t','מהו שם פעולה?',['שם עצם המציין את הפעולה עצמה','שם עצם המציין את מבצע הפעולה','בניין של הפועל','צורת ציווי'],0,'כתיבה, שמירה, הדרכה — כולן מציינות את הפעולה עצמה, לא את מי שעושה אותה.'],
 ['t','"התכתבות" היא שם פעולה של איזה בניין?',['התפעל','פעל','הפעיל','נפעל'],0,'משקל הִתְקַטְּלוּת הוא משקל שם הפעולה של התפעל: הִתְכַּתֵּב — הַתְכָּתְבוּת/התכתבות.'],
 ['t','"הדרכה" היא שם פעולה של איזה בניין?',['הפעיל','פעל','פיעל','התפעל'],0,'הִדְרִיך — הַדְרָכָה. משקל הַקְטָלָה הוא משקל שם הפעולה האופייני של בניין הפעיל.'],
 ['t','מה ההבדל בין "התלמיד כתב את המכתב" ל"המכתב נכתב"?',['בשני הנושא מושפע מהפעולה (סביל), בראשון הוא מבצע אותה (פעיל)','בשני הפועל בעתיד','אין הבדל במשמעות','בראשון אין נושא'],0,'פעיל: הנושא עושה. סביל: הנושא מושפע. לכן נכתב הוא צורה סבילית של נפעל.'],
 ['t','מה מציינת צורת הבינוני?',['זמן הווה','זמן עבר','זמן עתיד','ציווי'],0,'כותב, נכתב, כתוב — צורות הבינוני. הבינוני מבחין מגדר ומספר (כותבת, כותבים) ומשמש את כל הגופים.'],
 ['t','באיזה גוף קיימת צורת הציווי?',['רק גוף שני','בכל שלושת הגופים','רק גוף ראשון','ציווי בלי גוף'],0,'כתוב, כתבי, כתבו — פנייה ישירה לגוף שני בלבד, בזכר ובנקבה, ביחיד וברבים.'],
 ['t','נִכְתַּב (בעבר) — מה בניינו?',['נפעל','פעל','פועל','הופעל'],0,'נִכְתַּב בזמן עבר הוא בניין נפעל — הבניין הסבילי הנפוץ: המכתב נכתב.'],
 ['t','אָמְנָע, אֹמְנַע, אָמֵנַע, הַמָּנֵעַ — מה משותף לארבע הצורות?',['אותו שורש (מ.נ.ע) בבניינים וזמנים שונים','שורשים שונים לגמרי','אותו בניין בדיוק','אותו זמן בדיוק'],0,'כמו בחוברת: ארבע צורות מאותו שורש. מבחינים ביניהן לפי הבניין והזמן, לא לפי השורש.'],
 ['t','איזה פועל יוצא דופן מבחינת הבניין?',['הִתְרַחֵץ','רָחַץ','שָׁמַר','כָּתַב'],0,'הִתְרַחֵץ הוא התפעל, ואילו רָחַץ, שָׁמַר וכָּתַב הם בניין פעל. ככה נראית שאלת יוצא דופן בקובץ הבגרות.'],
 ['all','מהו סדר ניתוח מלא של פועל?',['בניין, שורש, גזרה, גוף וזמן','זמן בלבד','שורש בלבד','בניין בלבד'],0,'ניתוח חלקי מפסיד נקודות. כותבים את כל חמשת המרכיבים, כמו בטבלאות החוברת.'],
 ['all','כיצד בודקים לאיזו גזרה שייך פועל?',['מנטים אותו בכמה צורות ובודקים אם כל אותיות השורש מופיעות','לפי הצליל של המילה','לפי אורך המילה','לפי האות האחרונה בלבד'],0,'ההכרעה לפי צורות: אם אות נושרת בחלק מהנטיות — זו אינה גזרת השלמים. בחפ״ן בודקים במיוחד עתיד, ציווי והפעיל.'],
 ["t","מה שם הפועל, השורש והבניין של הפועל נָפַלְנוּ (מטבלת חפ״ן בחוברת)?",["שם הפועל: לִפֹּל · שורש: נ.פ.ל · בניין: פעל", "שם הפועל: לִנְפֹּל · שורש: נ.פ.ל · בניין: פעל", "שם הפועל: לִפֹּל · שורש: פ.ל.ל · בניין: פעל", "שם הפועל: לְהַפִּיל · שורש: נ.פ.ל · בניין: הפעיל"],0,"נָפַלְנוּ הוא עבר, גוף ראשון רבים, בניין פעל. הנו״ן של השורש נ.פ.ל נשמרת בעבר (נָפַל), אבל נושרת בשם הפועל: לִפֹּל, ובעתיד: יִפֹּל. שם הפעולה הוא נְפִילָה."],
 ["t","מה שם הפועל של נָתְנוּ, ומה שם הפעולה?",["לָתֵת · נְתִינָה", "לִנְתֹּן · נְתִינָה", "לָתֵת · הַתָּנָה", "לִתְנֹן · נְתוּנָה"],0,"השורש נ.ת.ן בגזרת חפ״ן, בניין פעל. הנו״ן הראשונה נושרת בשם הפועל (לָתֵת), והנו״ן האחרונה מתמזגת בת׳. שם הפעולה: נְתִינָה."],
 ["t","מה שורש הפועל לָקְחוּ, ולאיזה בניין הוא שייך?",["ל.ק.ח · פעל", "נ.ק.ח · פעל", "ל.ק.ח · הפעיל", "י.ק.ח · נפעל"],0,"לָקְחוּ הוא פעל, שורש ל.ק.ח. בחוברת הוא מופיע בטבלת חפ״ן, כי הלמ״ד הראשונה נושרת בחלק מהצורות: שם הפועל לָקַחַת, עתיד יִקַּח. שם הפעולה: לְקִיחָה."],
 ["t","מה שם הפעולה של הפועל נָגְעָה (שורש נ.ג.ע, בניין פעל)?",["נְגִיעָה", "הַגָּעָה", "נְגִיעוּת", "הִנָּגְעוּת"],0,"בבניין פעל שם הפעולה נבנה בדרך כלל על משקל קְטִילָה: נְגִיעָה, נְפִילָה, נְתִינָה. הַגָּעָה היא שם הפעולה של הפעיל (הִגִּיעַ)."],
 ["t","מה שם הפעולה של הפועל נָטְלוּ (שורש נ.ט.ל, פעל)?",["נְטִילָה", "הַטָּלָה", "נְטִילוּת", "הִתְנַטְּלוּת"],0,"פעל + חפ״ן: נָטַל, לִטֹּל, נְטִילָה (למשל: נטילת ידיים). הַטָּלָה היא שם הפעולה של הפעיל (הִטִּיל)."],
 ["t","מה משותף לשלוש הצורות: נָפַלְנוּ, תִּפְּלוּ, יִפֹּל?",["אותו שורש (נ.פ.ל) ואותו בניין (פעל), אבל זמן וגוף שונים", "אותו זמן ואותו גוף, אבל שורשים שונים", "אותו בניין, אבל שורשים שונים", "אותו גוף, אבל בניינים שונים"],0,"כולן מהשורש נ.פ.ל בבניין פעל. נָפַלְנוּ: עבר, גוף ראשון, רבים. תִּפְּלוּ: עתיד, גוף שני רבים. יִפֹּל: עתיד, גוף שלישי זכר יחיד. הנו״ן נושרת בעתיד ונשמרת בעבר."],
 ["t","מה צורת העתיד של הפועל נָתַן בגוף שלישי זכר יחיד?",["יִתֵּן", "נוֹתֵן", "יִנְתֹּן", "נָתוּן"],0,"חפ״ן: הנו״ן הראשונה נושרת והנו״ן האחרונה מתמזגת: יִתֵּן, אֶתֵּן, נִתֵּן. נוֹתֵן הוא בינוני, ונָתוּן הוא בינוני סביל."],
 ["t","מה שם הפעולה של הפועל הִפִּילוּ?",["הַפָּלָה", "נְפִילָה", "הִנָּפְלוּת", "הִתְנַפְּלוּת"],0,"הִפִּיל הוא הפעיל, ושם הפעולה של הפעיל הוא על משקל הַקְטָלָה: הַפָּלָה. נְפִילָה היא שם הפעולה של פעל (נָפַל). הנו״ן נושרת גם בהפלה."],
 ["t","מה שם הפועל של הפועל הִגִּידוּ?",["לְהַגִּיד", "לִגֹּד", "לְהִנָּגֵד", "לְהִתְנַגֵּד"],0,"הִגִּיד: הפעיל, שורש נ.ג.ד. שם הפועל של הפעיל מתחיל בלְהַ־: לְהַגִּיד. שם הפעולה: הַגָּדָה. לְהִתְנַגֵּד הוא התפעל, ומשמעותו שונה."],
 ["t","מה שורש הפועל הִצִּילוּ?",["נ.צ.ל", "צ.ל.ל", "י.צ.ל", "ה.צ.ל"],0,"הִצִּיל הוא הפעיל, שורש נ.צ.ל בגזרת חפ״ן. הנו״ן נושרת, ולכן הִצִּיל ולא הִנְצִיל. שם הפועל: לְהַצִּיל. שם הפעולה: הַצָּלָה."],
 ["t","מה שם הפעולה של הפועל הִכִּירוּ (שורש נ.כ.ר)?",["הַכָּרָה", "נְכִירָה", "הִנָּכְרוּת", "הַכְרָזָה"],0,"הִכִּיר הוא הפעיל, ושם הפעולה שלו על משקל הַקְטָלָה: הַכָּרָה. (נְכִירָה היא שם הפעולה של פעל, ו־הַכְרָזָה שייכת לשורש כ.ר.ז.)"],
 ["t","הַגָּעָה היא שם פעולה של איזה פועל?",["לְהַגִּיעַ (הפעיל)", "לָגַעַת (פעל)", "לְהִגָּעַ (נפעל)", "לְהִתְגָּעֵר (התפעל)"],0,"הַגָּעָה היא שם פעולה על משקל הַקְטָלָה, שהוא משקל שם הפעולה של בניין הפעיל: הִגִּיעַ, לְהַגִּיעַ, הַגָּעָה. שם הפעולה של פעל מהשורש נ.ג.ע הוא נְגִיעָה."],
 ["t","איזה שם פעולה נוטה באותו בניין כמו הַגָּעָה?",["הַצָּלָה", "הִתְרַגְּשׁוּת", "קְרִיאָה", "הִפָּרְדוּת"],0,"הַגָּעָה היא הפעיל. גם הַצָּלָה (הִצִּיל) היא הפעיל. הִתְרַגְּשׁוּת היא התפעל, קְרִיאָה היא פעל, הִפָּרְדוּת היא נפעל."],
 ["t","מה שם הפעולה של הפועל הִגִּישׁוּ?",["הַגָּשָׁה", "גִּישָׁה", "הִנָּגְשׁוּת", "הִתְגַּשְּׁשׁוּת"],0,"הִגִּישׁ הוא הפעיל, שורש נ.ג.ש, ושם הפעולה הַגָּשָׁה. גִּישָׁה היא שם הפעולה של פעל (לָגֶשֶׁת), ולכן שונה בבניין ובמשקל."],
 ["t","מה משותף לשמות הפעולה גִּישָׁה, הַגָּשָׁה, הַנְגָּשָׁה?",["שורש (נ.ג.ש), חלק דיבור (שם עצם) ומין דקדוקי (נקבה)", "שורש, משקל ובניין", "משקל ובניין בלבד", "אין ביניהם שום דבר משותף"],0,"שלושתן באות מהשורש נ.ג.ש, שלושתן שם עצם ובנקבה. המשקל שונה, ובבניין: גִּישָׁה מפעל, ואילו הַגָּשָׁה והַנְגָּשָׁה מהפעיל (הִגִּישׁ, הִנְגִּישׁ), אז הבניין אינו משותף לכולן."],
 ["t","השלימו: אתר האינטרנט נוח לשימוש ו־___ לאנשים שיש להם מוגבלויות. איזו מילה מאותו שורש ובאותה משמעות של הַנְגָּשָׁה, ומתאימה כשם תואר?",["נָגִישׁ", "גִּישָׁה", "הַנְגָּשָׁה", "נִגָּשׁ"],0,"המשפט דורש שם תואר מהשורש נ.ג.ש: נָגִישׁ (אפשר להגיע אליו). גִּישָׁה והַנְגָּשָׁה הן שמות פעולה, שם עצם."],
 ["t","מה שורש המילה הִתְמוֹדְדוּת?",["מ.ד.ד", "ת.מ.ד", "מ.ו.ד", "ד.ו.ת"],0,"הִתְמוֹדְדוּת היא שם הפעולה של הִתְמוֹדֵד (התפעל), שורש מ.ד.ד. התי״ו בראש המילה אינה מהשורש, היא סימן של בניין התפעל."],
 ["t","הִשָּׂרְדוּת היא שם פעולה הנוטה בבניין ___, אולם היא מתארת לרוב את הפעולה של הפועל שָׂרַד מבניין ___.",["נפעל · פעל", "פעל · נפעל", "התפעל · פעל", "פיעל · נפעל"],0,"המשקל הִקָּטְלוּת הוא משקל שם הפעולה של נפעל, אבל הפועל שָׂרַד, יִשְׂרֹד הוא בניין פעל. זו דוגמה לשם פעולה שהמשקל שלו אינו מתאים לבניין של הפועל שהוא מתאר, כמו בשאלה ד בחוברת."],
 ["t","בשני המשפטים מודגשת המילה קַבָּלָה. באיזה משפט היא שם פעולה? (א) ... עד 14 יום מיום הַקַּבָּלָה של המוצר. (ב) הצרכן מציג חשבונית או קַבָּלָה המעידה על העסקה.",["משפט א, כי היא מציינת את הפעולה של קבלת המוצר", "משפט ב, כי היא מציינת פעולה", "בשניהם, כי כל מילה על משקל קְטָלָה היא שם פעולה", "באף אחד מהם"],0,"שם פעולה מציין פעולה: קבלת המוצר. במשפט ב קַבָּלָה היא שם עצם מוחשי, מסמך (קבלה על תשלום). אותה מילה יכולה להיות פעם שם פעולה ופעם שם עצם מוחשי."],
 ["t","באיזה משפט המילה אֲרִיזָה היא שם פעולה? (א) סיימתי את האֲרִיזָה של המזוודה בערב שלפני הטיול. (ב) לאחר פתיחת המוצר השליכו את האֲרִיזָה לפח.",["משפט א, כי האריזה היא הפעולה של לארוז", "משפט ב, כי האריזה היא הפעולה של לארוז", "בשניהם", "באף אחד"],0,"במשפט א אריזה היא פעולת האריזה (שם פעולה). במשפט ב היא החפץ: העטיפה, ולכן שם עצם מוחשי."],
 ["t","אֲרִיזָה, קַבָּלָה, הַזְמָנָה. מה נכון על שמות במשקלי שם פעולה?",["לעיתים הם מציינים פעולה, ולעיתים שם עצם מוחשי", "הם תמיד מציינים פעולה", "הם תמיד מציינים חפץ", "הם תמיד בבניין הפעיל"],0,"חלק ממשקלי שם הפעולה משמשים גם לשמות עצם מוחשיים (אריזה, קבלה, הזמנה, הדפסה). הקונטקסט במשפט קובע."],
 ["t","מה משותף לצורות אֲרוּזִים ו־נֶאֱרָזִים (מוצרים אֲרוּזִים, נֶאֱרָזִים מחדש)?",["לשתי הצורות יש משמעות סבילה", "שתי הצורות נוטות באותו בניין", "שתי הצורות בבניין פעיל", "לשתי הצורות שורש שונה"],0,"אֲרוּזִים הוא בינוני סביל של פעל, ונֶאֱרָזִים הוא בינוני של נפעל. הבניין שונה, השורש אחד (א.ר.ז), והמשמעות בשתיהן סבילה: משהו אורזים אותו."],
 ["t","מה בניינו של הפועל מְעַנְיְנִים (בינוני)?",["פיעל", "פעל", "הפעיל", "התפעל"],0,"עִנְיֵן הוא פיעל (שורש ע.נ.י.נ), והבינוני: מְעַנְיֵן, מְעַנְיְנִים. הבינוני בפיעל מתחיל במ׳ עם שוא."],
 ["t","מה צורת העתיד של שם הפועל לְהִמָּנַע בגוף ראשון (מדבר)?",["אֶמָּנַע", "יִמָּנַע", "אֶמְנַע", "הִמָּנַע"],0,"לְהִמָּנַע הוא נפעל. בעתיד נפעל: אֶמָּנַע, תִּמָּנַע, יִמָּנַע. אֶמְנַע הוא עתיד של פעל (אֶמְנַע = אמנע מישהו). הִמָּנַע הוא שם הפועל או ציווי."],
 ["t","מה בניינו של הפועל מְאַתְגֵּר (הטיפוס מְאַתְגֵּר את מטפסי ההרים)?",["פיעל", "פעל", "פועל", "התפעל"],0,"אִתְגֵּר הוא פיעל (שורש מרובע א.ת.ג.ר). הבינוני בפיעל מתחיל במ׳: מְאַתְגֵּר."],
 ["t","מה בניינו של הבינוני שְׁפוּטִים (הם שְׁפוּטִים לשנת מאסר)?",["פעל (בינוני סביל)", "פועל", "התפעל", "נפעל"],0,"שָׁפוּט הוא בינוני סביל של פעל, על משקל קָטוּל: כָּתוּב, שָׁמוּר, שָׁפוּט. כך מבחינים אותו מפועל (מְשֻׁפָּט)."],
 ["t","איזו צורה היא עתיד של השורש נ.צ.ל בבניין נפעל, גוף שלישי זכר יחיד?",["יִנָּצֵל", "תִּנָּצֵל", "נָצַל", "נִצַּל"],0,"בנפעל בעתיד: יִנָּצֵל (הוא), תִּנָּצֵל (את או היא). נִצַּל הוא עבר נפעל, ונָצַל הוא עבר פעל."],
 ["t","מה בניינו של הפועל לְתַרְגֵּם?",["פיעל", "פעל", "הפעיל", "התפעל"],0,"תִּרְגֵּם הוא פיעל משורש מרובע ת.ר.ג.מ. בעתיד: יְתַרְגֵּם, בבינוני: מְתַרְגֵּם."],
 ["t","מה בניינו של הפועל נִלְמָד (בעבר)?",["נפעל", "פעל", "פועל", "הופעל"],0,"נִלְמַד: נפעל, הנושא נלמד. בעתיד: יִלָּמֵד."],
 ["t","מה שורש ומה בניין של הפועל יִשְׁתַּמְּשׁוּ (הנערים יִשְׁתַּמְּשׁוּ בכלי הכתיבה)?",["שורש ש.מ.ש · בניין התפעל", "שורש ש.מ.ש · בניין פיעל", "שורש י.ש.מ · בניין פעל", "שורש ת.מ.ש · בניין התפעל"],0,"הִשְׁתַּמֵּשׁ הוא התפעל, התי״ו אחרי הש׳ היא תי״ו התפעל (הִתְשַׁמֵּשׁ הפך להִשְׁתַּמֵּשׁ), לא חלק מהשורש. השורש ש.מ.ש."],
 ["t","מה בניינו של הפועל יִנָּתֵק, ומה צורת העבר שלו?",["נפעל · נִתַּק", "פעל · נָתַק", "פיעל · נִתֵּק", "התפעל · הִתְנַתֵּק"],0,"יִנָּתֵק הוא עתיד של נפעל, שורש נ.ת.ק. בעבר: נִתַּק, למשל הקשר נִתַּק. נִתֵּק הוא פיעל (הוא ניתק את הקשר) והִתְנַתֵּק הוא התפעל."],
 ["t","מה בניינם של שני שמות הפועל לְהַבִּיעַ ו־לְהַגְזִים, ומה שם הפעולה של כל אחד?",["הפעיל · הַבָּעָה ו־הַגְזָמָה", "פיעל · הַבָּעָה ו־הַגְזָמָה", "הפעיל · בִּיעָה ו־גִּזּוּם", "פעל · בְּיעָה ו־גְּזִימָה"],0,"שם הפועל של הפעיל מתחיל בלְהַ־. שמות הפעולה בהפעיל על משקל הַקְטָלָה: הַבָּעָה (להַבִּיעַ), הַגְזָמָה (להַגְזִים)."],
 ["t","מה שם הפועל של הפועל הִסִּיקוּ (הצלחנו לְהַסִּיק מסקנות), ומה שם הפעולה שלו?",["לְהַסִּיק · הַסָּקָה", "לָסֹק · סְקִיקָה", "לְהִסָּק · הִסָּקוּת", "לְהִסְתַּיֵּק · הִסְתַּקְּקוּת"],0,"הִסִּיק הוא הפעיל, שורש נ.ס.ק, חפ״ן. שם הפעולה: הַסָּקָה (גם הַסָּקַת מסקנות). יש גם הַסָּקָה בחורף, שם עצם לחימום."],
 ["t","מה שם הפעולה של להַקִּיף?",["הַקָּפָה", "הִתְקַפְּפוּת", "נְקִיפָה", "הַקְפָּאָה"],0,"הִקִּיף הוא הפעיל, שורש נ.ק.ף, ולכן הַקָּפָה על משקל הַקְטָלָה."],
 ["t","יְצִירָה, תִּכְנוּת. איזה זוג מתאים: שם הפועל ובניין?",["לִיצֹר (פעל) ו־לְתַכְנֵת (פיעל)", "לִיצֹר (פיעל) ו־לְתַכְנֵת (פעל)", "לְהַצִּיר (הפעיל) ו־לְהִתְכַּנֵּת (התפעל)", "לִיצֹר (נפעל) ו־לְתַכְנֵת (הפעיל)"],0,"יְצִירָה הוא שם הפעולה של פעל (לִיצֹר, שורש י.צ.ר). תִּכְנוּת היא שם הפעולה של פיעל, על משקל קִטּוּל (תִּכְנֵת → תִּכְנוּת)."],
 ["t","מה בניינו והמשמעות של הפועל נִשְׁמֶרֶת במשפט \"היא נִשְׁמֶרֶת בקפידה\"?",["נפעל · סביל", "פעל · פעיל", "פיעל · פעיל", "הופעל · סביל"],0,"נִשְׁמֶרֶת היא בינוני נפעל: היא נשמרת, מישהו שומר עליה. כך נפעל הוא הבניין הסבילי של פעל."],
 ["t","מה משקל הזכר של רַכֶּזֶת (רַכָּז)?",["קַטָּל", "קַטְלָן", "מַקְטִיל", "קוֹטֵל"],0,"רַכָּז הוא על משקל קַטָּל (כמו נַגָּר, צַבָּע, סַבָּל). הנקבה רַכֶּזֶת."],
 ["t","מה משקל הזכר של שַׁדְרָנִית?",["קַטְלָן (שַׁדְרָן)", "קַטָּל (שַׁדָּר)", "מַקְטִיל (מַשְׁדִּיר)", "קוֹטֵל (שׁוֹדֵר)"],0,"שַׁדְרָנִית היא נקבה של שַׁדְרָן, על משקל קַטְלָן (כמו קַרְיָן, רַקְדָן, זַמְרָן)."],
 ["t","מה משקל הזכר של מַדְרִיכָה?",["מַקְטִיל (מַדְרִיךְ)", "קַטָּל", "קַטְלָן", "קוֹטֵל"],0,"מַדְרִיךְ הוא על משקל מַקְטִיל, בינוני הפעיל. נקבה: מַדְרִיכָה."],

 open:[
 ['k','הסבירו מהי כתיבה ממזגת ומהי סקירה, ומה נדרש מהכותב.',['הגדרה: טקסט חדש על סמך כמה מקורות','בחירת מידע לפי הקריטריונים של המטלה','ארגון לפי תתי־נושאים וניסוח במילים שלך','ציון המקורות'],'כתיבה ממזגת היא כתיבה של טקסט חדש על סמך כמה מקורות בנושא אחד. סקירה היא טקסט כזה, שמציג את המידע בארגון חדש ובלי דעה אישית. הכותב בוחר מכל מקור את המידע שהמטלה דורשת, מאחד מידע דומה ומארגן אותו לפי תתי־נושאים. הוא מנסח במילים שלו ומציין את המקורות, בגוף הטקסט ובסוף, כדי שיהיה ברור מאיפה כל פרט נלקח.'],
 ['k','מה נבדק בסקירה, ומדוע חשוב לציין את המקורות?',['עמידה בקריטריונים של המטלה','מיזוג ולא סיכום נפרד של כל מקור','לשון תקנית וקישוריות','אזכור מקורות והסבר חשיבותו'],'בסקירה נבדק אם הכותב עמד בקריטריונים של המטלה, מיזג את המידע מהמקורות לטקסט אחד מסודר ובלשון תקנית, ושמר על מבנה של מבוא, גוף וסיום. חשוב לציין את המקורות כדי להבהיר שהמידע לקוח מאחרים ולא נכתב כידע של הכותב, וכדי שהקורא יוכל לאתר אותו.'],
 ['m','הסבירו את כלל ההתאמה ההפוכה בשמות המספר 3–10, והדגימו בשתי דוגמאות.',['ניסוח הכלל ההפוך','דוגמה עם שם עצם זכר','דוגמה עם שם עצם נקבה','איזכור היוצא דופן: שניים ושתיים'],'במספרים 3–10 ההתאמה בין צורת המספר למגדר שם העצם הפוכה מהאינטואיציה: הצורה עם סיומת ה־ מצטרפת לשם עצם זכר, למשל שבעה ספרים, ואילו הצורה בלי סיומת ה־ מצטרפת לשם עצם נקבה, למשל שבע מחברות. לכן קודם קובעים את מגדר שם העצם ורק אז בוחרים את צורת המספר. יוצא דופן הוא המספר שניים: שני ילדים ושתי בנות — כאן ההתאמה רגילה.'],
 ['m','הסבירו את ההבדל בין מספר מניין למספר סידורי, וכיצד מציינים סדר מעל עשרה.',['הגדרת מספר מניין עם דוגמה','הגדרת מספר סידורי עם דוגמה','צורות סידוריות מראשון עד עשירי','מעל עשרה — מספר מניין'],'מספר מניין עונה על השאלה כמה, למשל חמישה תלמידים, ואילו מספר סידורי עונה על השאלה איזה מספר בסדר, למשל התלמיד החמישי. לצורות הסידוריות יש נוסחים מיוחדים מראשון ועד עשירי בלבד. מעל עשרה לא ממציאים צורה סידורית חדשה אלא משתמשים במספר המניין: השיעור עשרים ושלוש, הפרק שבעים ושמונה.'],
 ['t','נתחו את הפועל הִפִּיל: בניין, שורש, גזרה, גוף וזמן, והסבירו כיצד נודע שהגזרה היא חפ״ן.',['בניין הפעיל','שורש נ.פ.ל','גזרת חפ״ן עם הסבר נשירת הנו״ן','גוף וזמן: גוף שלישי זכר יחיד, עבר'],'הִפִּיל הוא פועל בבניין הפעיל, שורשו נ.פ.ל, בגזרת חסרי פ״ן. הוא בגוף שלישי זכר יחיד ובזמן עבר. הגזרה נודעת מנשירת הנו״ן: בהפעיל היינו מצפים להִנְפִּיל, אך הנו״ן נשרה ונותר הִפִּיל. אותה נשירה מופיעה גם בעתיד של פעל (יִפֹּל), בציווי (פֹּל) ובשם הפועל (לִפֹּל), בעוד שבעבר, בבינוני ובשם הפעולה הנו״ן נשמרת: נָפַל, נוֹפֵל, נְפִילָה.'],
 ['t','הסבירו את ההבדל בין שם הפועל לשם פעולה ובין פעיל לסביל, והדגימו.',['הגדרת שם הפועל עם דוגמה','הגדרת שם פעולה עם דוגמה','הגדרת פעיל מול סביל עם דוגמה','איזכור הבניינים הסביליים'],'שם הפועל הוא צורת המקור של הפועל, למשל לכתוב או לשמור (כותב ושומר הם בינוני), ואילו שם פעולה הוא שם עצם המציין את הפעולה עצמה, למשל כתיבה או שמירה. הבחנה נוספת היא בין פעיל לסביל: בפועל פעיל הנושא מבצע את הפעולה, כמו במשפט התלמיד כתב את המכתב, ואילו בפועל סביל הנושא מושפע ממנה, כמו במשפט המכתב נכתב. הבניינים הסביליים הם נפעל, פועל והופעל, והבניינים הפעילים הם פעל, פיעל והפעיל.'],
 ["t","מלאו טבלה לפועל הִפִּילוּ: שם הפועל, בניין, שורש וגזרה, שם פעולה, והסבירו איך יודעים שמדובר בחפ״ן.",["שם הפועל: לְהַפִּיל", "בניין הפעיל", "שורש נ.פ.ל וגזרת חפ״ן", "שם פעולה: הַפָּלָה", "הסבר נשירת הנו״ן"],"הִפִּילוּ: עבר, גוף שלישי רבים. שם הפועל לְהַפִּיל. בניין הפעיל. שורש נ.פ.ל, גזרת חסרי פ״ן, כי הנו״ן נושרת (הִפִּיל ולא הִנְפִּיל). שם הפעולה: הַפָּלָה, על משקל הַקְטָלָה."],

const shuffle=a=>{let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
let screen='home',queue=[],position=0,sessionCorrect=0,sessionAnswered=0,chosen=null,flashQueue=[],flashPos=0,revealed=false,summaryTopic=CONTENT.topics[0].id,openIdx=0;

function renderNav(){nav.innerHTML=[['home','⌂','בית'],['quiz','✓','תרגול'],['flash','▤','כרטיסיות'],['summary','≡','סיכומים'],['open','✎','כתיבה']].map(([id,icon,label])=>`<button data-go="${id}" class="${screen===id?'active':''}" ${screen===id?'aria-current="page"':''}><b aria-hidden="true">${icon}</b>${label}</button>`).join('');nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function head(title,sub){return `<div class="top"><h1>${title}</h1><span class="pill">${CONTENT.subject}</span></div>${sub?`<p class="muted">${sub}</p>`:''}`}

function home(){let done=Object.keys(store.answers).length,correct=Object.values(store.answers).filter(Boolean).length;app.innerHTML=`<header class="brand"><strong>לקראת <span style="color:var(--green)">100</span></strong><span class="edition">מהדורת ${CONTENT.subject}</span></header><section class="hero"><div class="eyebrow">המבחן הבא · ${CONTENT.date}</div><h1>${esc(CONTENT.title).replace('\n','<br>')}</h1><p class="muted">לומדים את הכלל. מזהים את הצורה.<br>מתרגלים לנמק, לא רק לנחש.</p></section><section class="card accent"><div class="row"><h2>סבב קטן, הבדל גדול</h2><span aria-hidden="true" style="font-size:30px">↖</span></div><p>10 שאלות עם הסבר מיידי. הטעויות נשמרות לסיבוב תיקון.</p><button class="primary full" id="quick">מתחילים לתרגל ←</button></section><div class="stats"><div class="stat"><strong>${done}/${CONTENT.questions.length}</strong><span>שאלות שנענו</span></div><div class="stat"><strong>${done?Math.round(correct/done*100)+'%':'—'}</strong><span>נכונות בניסיון האחרון</span></div><div class="stat"><strong>${wrong().length}</strong><span>טעויות לתיקון</span></div></div><div class="grid"><button class="tile" data-mode="quiz"><div class="icon">✓</div><strong>תרגול חכם</strong><span>שאלות, הסברים ותיקון טעויות</span></button><button class="tile" data-mode="flash"><div class="icon">▤</div><strong>כרטיסיות</strong><span>מושג, צורה ודוגמה</span></button><button class="tile" data-mode="summary"><div class="icon">≡</div><strong>סיכומים</strong><span>כל נושא, בלי להתפזר</span></button><button class="tile" data-mode="open"><div class="icon">✎</div><strong>תשובת מבחן</strong><span>כותבים, משווים ומשפרים</span></button></div><section class="card"><h2>מה נכנס למבחן?</h2>${CONTENT.topics.map(t=>`<div class="topicline"><div><strong>${t.name}</strong><br><span>${t.author}</span></div><span>${CONTENT.questions.filter(q=>q[0]===t.id).length} שאלות</span></div>`).join('')}<p class="small muted">${CONTENT.boundary}</p></section><section class="hint">לציון גבוה צריך ניתוח מלא: שורש, בניין, גזרה, גוף וזמן — ונימוק לכל זיהוי. אחוזי ההצלחה באפליקציה אינם תחזית לציון במבחן.</section><p class="status">${storageOK?'ההתקדמות נשמרת אוטומטית בדפדפן הזה, לא בין מכשירים.':'שמירה אינה זמינה בדפדפן זה. ההתקדמות תישמר רק כל עוד הדף פתוח.'}</p><p class="small muted">במבחן הבא שולחים את הנושאים בשיחה, והאפליקציה תעודכן באותו קישור. אין צורך להזין כאן חומר.</p>`;document.getElementById('quick').onclick=()=>{screen='quiz';renderNav();startQuiz('all',10,false)};app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>go(b.dataset.mode))}
function quizSetup(){app.innerHTML=head('בונים ביטחון','בוחרים נושא וסבב. אחרי כל תשובה תקבלו הסבר, גם כשהיא נכונה.')+`<section class="card">${topicSelect('qtopic')}<label for="qcount">אורך הסבב</label><select id="qcount"><option value="10">10 שאלות</option><option value="20">20 שאלות</option><option value="999">כל השאלות בנושא</option></select><button class="primary full" id="start" style="margin-top:24px">מתחילים סבב ←</button></section><section class="card"><h2>חוזרים על מה שפספסנו</h2><p class="muted">כרגע יש ${wrong().length} שאלות לתיקון. תשובה נכונה בסבב הבא תוציא שאלה מרשימת הטעויות.</p><button class="secondary full" id="mistakes" ${wrong().length?'':'disabled'}>תרגול טעויות בלבד</button></section><p class="small muted">השאלות נכתבו לתרגול בסגנון חוברת הלשון וקובץ הבגרות, ואינן שאלות מבחן רשמיות.</p>`;document.getElementById('start').onclick=()=>startQuiz(document.getElementById('qtopic').value,Number(document.getElementById('qcount').value),false);document.getElementById('mistakes').onclick=()=>startQuiz('all',999,true)}
function startQuiz(t,count,onlyWrong){queue=shuffle(CONTENT.questions.map((q,i)=>i).filter(i=>(t==='all'||CONTENT.questions[i][0]===t)&&(!onlyWrong||store.answers[i]===false))).slice(0,count);position=0;sessionCorrect=0;sessionAnswered=0;chosen=null;quizQuestion();window.scrollTo(0,0)}
function quizQuestion(){if(position>=queue.length){quizEnd();return}let idx=queue[position],q=CONTENT.questions[idx];let order=shuffle(q[2].map((a,i)=>i));app.innerHTML=head('תרגול',null)+`<div class="row small muted"><span>${topic(q[0])}</span><span>שאלה ${position+1} מתוך ${queue.length}</span></div><progress value="${position}" max="${queue.length}" aria-label="התקדמות בסבב"></progress><section class="card"><h2 class="q-title">${esc(q[1])}</h2><div id="options">${order.map(i=>`<button class="answer" data-answer="${i}">${esc(q[2][i])}</button>`).join('')}</div><div id="response" aria-live="polite"></div></section><button class="ghost full" id="stop">סיום הסבב וחזרה לבחירה</button>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(idx,Number(b.dataset.answer)));document.getElementById('stop').onclick=()=>go('quiz')}
function answer(idx,a){if(chosen!==null)return;chosen=a;let q=CONTENT.questions[idx],ok=a===q[3];sessionAnswered++;if(ok)sessionCorrect++;store.answers[idx]=ok;save();app.querySelectorAll('[data-answer]').forEach(b=>{let n=Number(b.dataset.answer);b.disabled=true;if(n===q[3])b.classList.add('correct');else if(n===a)b.classList.add('wrong')});document.getElementById('response').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'נכון. בדיוק כך.':'עוד רגע, מדייקים.'}</strong><p>${esc(q[4])}</p>${ok?'':`<p class="small">התשובה הנכונה: ${esc(q[2][q[3]])}</p>`}</div><button class="primary full" id="next">${position+1===queue.length?'לסיכום הסבב':'לשאלה הבאה ←'}</button>`;document.getElementById('next').onclick=()=>{position++;chosen=null;quizQuestion();window.scrollTo(0,0)}}
function quizEnd(){app.innerHTML=head('סבב הושלם',null)+`<section class="card center"><div class="eyebrow">תוצאה בסבב הזה</div><div class="score">${sessionAnswered?Math.round(sessionCorrect/sessionAnswered*100):0}%</div><p>${sessionCorrect} תשובות נכונות מתוך ${sessionAnswered}</p><p class="muted">${sessionCorrect===sessionAnswered?'יפה. עכשיו נסו לנסח תשובה פתוחה בלי להסתכל.':'הטעויות נשמרו. חזרה קצרה על ההסברים תעזור בסבב הבא.'}</p><button class="primary full" id="again">עוד סבב</button><button class="secondary full" id="write" style="margin-top:10px">לתרגול תשובה פתוחה</button></section><p class="small muted">זהו ציון תרגול בלבד, לא הערכת ציון לבחינה.</p>`;document.getElementById('again').onclick=()=>go('quiz');document.getElementById('write').onclick=()=>go('open')}
function flashSetup(){app.innerHTML=head('זוכרים ומסבירים','קראו את השאלה, נסו לענות בקול ורק אז חשפו את התשובה.')+`<section class="card">${topicSelect('ftopic')}<label for="fmode">אילו כרטיסיות?</label><select id="fmode"><option value="all">כל הכרטיסיות</option><option value="new">רק מה שעוד לא סימנתי כידוע</option></select><p class="small muted">${store.known.length} מתוך ${CONTENT.flash.length} כרטיסיות סומנו כידועות.</p><button class="primary full" id="fstart">פותחים כרטיסיות ←</button></section>`;document.getElementById('fstart').onclick=()=>{let t=document.getElementById('ftopic').value,mode=document.getElementById('fmode').value;flashQueue=shuffle(CONTENT.flash.map((q,i)=>i).filter(i=>(t==='all'||CONTENT.flash[i][0]===t)&&(mode==='all'||!store.known.includes(i))));flashPos=0;revealed=false;flashCard()}}
function flashCard(){if(flashPos>=flashQueue.length){app.innerHTML=head('הסבב מאחוריכם',null)+`<section class="card center"><h2>${flashQueue.length?'יפה. המושגים מתחברים.':'אין כרטיסיות חדשות בבחירה הזו.'}</h2><p class="muted">אפשר לחזור לכל הכרטיסיות, גם לאלה שכבר סימנתם.</p><button class="primary" id="freturn">בחירת כרטיסיות</button></section>`;document.getElementById('freturn').onclick=()=>go('flash');return}let idx=flashQueue[flashPos],f=CONTENT.flash[idx];app.innerHTML=head('כרטיסיות',null)+`<div class="row small muted"><span>${topic(f[0])}</span><span>${flashPos+1} / ${flashQueue.length}</span></div><progress value="${flashPos}" max="${flashQueue.length}" aria-label="התקדמות בכרטיסיות"></progress><section class="card flash"><span class="chip">נסו קודם בלי להציץ</span><h2 class="prompt">${esc(f[1])}</h2>${revealed?`<div class="solution">${esc(f[2])}</div>`:`<button class="primary" id="reveal">חשיפת תשובה</button>`}</section>${revealed?'<div class="actions"><button class="primary" id="known">ידעתי ✓</button><button class="secondary" id="unknown">צריך חזרה ↻</button></div>':''}<button class="ghost full" id="fback" style="margin-top:18px">לבחירת כרטיסיות</button>`;if(!revealed)document.getElementById('reveal').onclick=()=>{revealed=true;flashCard()};else{document.getElementById('known').onclick=()=>flashRate(idx,true);document.getElementById('unknown').onclick=()=>flashRate(idx,false)}document.getElementById('fback').onclick=()=>go('flash')}
function flashRate(idx,known){store.known=store.known.filter(i=>i!==idx);if(known)store.known.push(idx);save();flashPos++;revealed=false;flashCard();window.scrollTo(0,0)}
function summary(){let t=CONTENT.topics.find(t=>t.id===summaryTopic);app.innerHTML=head('מבינים את החומר',null)+`<div class="section-tab">${CONTENT.topics.map(t=>`<button data-topic="${t.id}" class="${summaryTopic===t.id?'active':''}">${t.name}</button>`).join('')}</div><section class="card accent"><span class="eyebrow">${t.author}</span><h2>${t.name}</h2><p>${t.intro}</p></section><section class="card">${t.points.map(([h,p])=>`<h3>${h}</h3><p class="muted">${p}</p>`).join('')}</section><section class="card"><h2>דוגמה ← ניתוח ← הסבר</h2>${t.quotes.map(([q,e])=>`<div class="quote"><strong>״${q}״</strong><p>${e}</p></div>`).join('')}</section><section class="hint"><strong>דיוק ששומר על הנקודות</strong><p>${t.caution}</p></section><section class="card"><h2>הופכים הבנה לתשובה</h2><p class="muted">אל תסתפקו בזיהוי. מנתחים את הצורה בשלם: שורש, בניין או משקל, גזרה, גוף וזמן.</p><button class="primary full" id="swrite">מתרגלים כתיבה ←</button></section><details><summary>מקור התוכן והיקף החומר</summary><p class="small muted">${CONTENT.note}</p><p class="small muted">${CONTENT.sourceLabel}</p></details>`;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{summaryTopic=b.dataset.topic;summary();window.scrollTo(0,0)});document.getElementById('swrite').onclick=()=>{openIdx=CONTENT.open.findIndex(q=>q[0]===summaryTopic);go('open')}}
function openPractice(){let q=CONTENT.open[openIdx];app.innerHTML=head('כותבים תשובת מבחן','לא רק לזהות תשובה. לבנות טענה, ראיה והסבר במילים שלכם.')+`<label for="openq">בחרו שאלה</label><select id="openq">${CONTENT.open.map((q,i)=>`<option value="${i}" ${i===openIdx?'selected':''}>${topic(q[0])}: ${q[1]}</option>`).join('')}</select><section class="card"><span class="chip">${topic(q[0])}</span><h2 style="margin-top:12px">${esc(q[1])}</h2><p class="hint">מבנה שימושי: זיהוי ← ניתוח מלא של הצורה ← דוגמה נוספת ← נימוק ותשובה לשאלה.</p><label for="draft">התשובה שלכם</label><textarea id="draft" placeholder="כתבו כאן, או ענו בקול לפני חשיפת הדוגמה...">${esc(store.drafts[openIdx]||'')}</textarea><p class="status" id="draftstatus">${storageOK?'הטיוטה נשמרת בדפדפן הזה בזמן הכתיבה.':'שמירה אינה זמינה. אין להסתמך על שמירת הטיוטה.'}</p><button class="primary full" id="showmodel">סיימתי, משווים לדוגמה</button><div id="model" aria-live="polite"></div></section><p class="small muted">הבדיקה עצמית, לא ציון אוטומטי. תשובה אחרת יכולה להיות טובה אם היא מדויקת, מנומקת ועונה על השאלה.</p>`;document.getElementById('openq').onchange=e=>{openIdx=Number(e.target.value);openPractice()};document.getElementById('draft').oninput=e=>{store.drafts[openIdx]=e.target.value;save();document.getElementById('draftstatus').textContent=storageOK?'הטיוטה נשמרה בדפדפן הזה.':'לא ניתן לשמור בדפדפן זה. השאירו את הדף פתוח.'};document.getElementById('showmodel').onclick=()=>{document.getElementById('showmodel').hidden=true;document.getElementById('model').innerHTML=`<div class="feedback"><strong>תשובה לדוגמה, לא נוסח שחייבים לשנן</strong><p>${esc(q[3])}</p></div><h3>בדיקה עצמית</h3><div class="checklist">${q[2].map((c,i)=>`<label><input type="checkbox" data-check="${i}" ${store.checks[openIdx+':'+i]?'checked':''}><span>${c}</span></label>`).join('')}</div><p class="small muted">סמנו רק מה שבאמת מופיע בתשובה שלכם. חסר משהו? הוסיפו בטיוטה.</p>`;app.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{store.checks[openIdx+':'+c.dataset.check]=c.checked;save()})}}
render();
</script></body></html>
