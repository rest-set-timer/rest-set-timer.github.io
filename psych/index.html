<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<title>פסיכומטרי</title>
<style>:root{--bg:#0d0f14;--card:#171b23;--card2:#1e232e;--line:#262c38;--txt:#f2f5f9;--dim:#8b93a3;--accent:#b4ff39;--accent2:#22d3ee;--danger:#ff5c5c;--ok:#34d399;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
body{font-family:-apple-system,"SF Pro Text","Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;direction:rtl;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(110px + var(--safe-b))}
.ic{width:22px;height:22px;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{font-size:20px;margin:0;font-weight:800;text-align:center;flex:1}
.top .sp{width:40px}
.top.home h1{text-align:right;font-size:22px}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;transform:scaleX(-1)}
.hi{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d0f14;font-weight:800;font-size:20px;display:grid;place-items:center}
.av.big{width:92px;height:92px;font-size:40px;margin:0 auto}
.sm{font-size:13px;color:var(--dim);line-height:1.5}
.mt{margin-top:10px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.pill.fire{color:var(--accent)}
.pill b{color:var(--txt);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;display:block;width:100%;text-align:right;color:var(--txt)}
.card.note{color:#cfd6e2;line-height:1.7;font-size:15px;border-inline-start:4px solid var(--accent2)}
.card.warn{border-inline-start-color:var(--danger)}
.big{font-size:22px;font-weight:800;margin:4px 0}
.num{color:var(--accent);font-size:34px;font-weight:800}
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:6px;background:var(--card);border-radius:50%}
.ring span{position:relative;font-size:13px;font-weight:700}
.cdrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lnk{background:none;border:0;color:var(--accent2);font-size:14px;padding:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;color:var(--txt)}
.chip.on{background:var(--accent);color:#0d0f14;border-color:var(--accent);font-weight:700}
input,select,textarea{font:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:9px 12px;direction:rtl}
input[type=date]{color-scheme:dark}
.sech h2,.sh{font-size:18px;margin:18px 0 8px;font-weight:800}
.plan{padding:6px 14px}
.prow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;text-align:right}
.prow:last-child{border-bottom:0}
.tm{color:var(--dim);font-size:13px;width:42px;direction:ltr;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pt{flex:1;font-size:16px}
.pc{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:flex;flex-direction:column;gap:6px;min-height:132px;margin:0}
.cat b{font-size:17px}
.cat span{font-size:13px;color:var(--dim);line-height:1.4}
.c1 .ic{color:var(--accent)}.c2 .ic{color:var(--accent2)}.c3 .ic{color:#ff9f43}.c4 .ic{color:#c084fc}.c5 .ic{color:#60a5fa}.c6 .ic{color:var(--danger)}.c7 .ic{color:#fbbf24}
.ic{width:26px;height:26px}
.nav .ic,#nav .ic{width:22px;height:22px}
.list .item{display:flex;align-items:center;gap:14px}
.item .it{flex:1;display:flex;flex-direction:column;gap:2px}
.item .it span{font-size:13px;color:var(--dim);line-height:1.4}
.btn{background:var(--accent);color:#0d0f14;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.linkrow{display:flex;align-items:center;gap:12px;font-size:16px}
#nav{position:fixed;bottom:calc(10px + var(--safe-b));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;background:rgba(30,35,46,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;display:flex;justify-content:space-around;padding:8px 6px;z-index:10}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:11px;padding:6px 8px;flex:1;border-radius:16px}
#nav button.on{color:var(--accent)}
.lbl{font-size:13px;color:var(--accent2);font-weight:700;margin-bottom:6px}
.qtext{font-size:17px;line-height:1.7;margin-bottom:10px}
.ltr{direction:ltr;text-align:left}
.stem{font-size:19px;font-weight:700;background:var(--card2);border-radius:12px;padding:10px 14px;margin-bottom:10px;text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right;font-size:16px;line-height:1.5;width:100%}
.opt .k{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--dim)}
.opt.sel{border-color:var(--accent2);background:#12303a}
.opt.ok{border-color:var(--ok);background:#0f2e25}
.opt.bad{border-color:var(--danger);background:#35171b}
.expl{margin-top:12px;line-height:1.7;background:var(--bg);border-radius:12px;padding:12px;font-size:15px}
.why{font-size:14px;color:#aab2c0;line-height:1.7;margin:8px 0}
.passage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;line-height:1.8;font-size:15px;margin:0 0 12px;color:#d6dbe5}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px;text-align:right;line-height:1.5;vertical-align:top}
.tbl th{background:var(--card2)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.nd{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.nd.cur{border-color:var(--accent);color:var(--accent)}
.nd.c{background:#0f2e25;border-color:var(--ok)}
.nd.w{background:#35171b;border-color:var(--danger)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.vcard{text-align:center;padding:40px 16px;min-height:190px}
.vw{font-size:30px;font-weight:800}
.vm{margin-top:14px;font-size:17px;line-height:1.6;color:#d6dbe5}
.vm.dim{color:var(--dim);font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;line-height:1.5;font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:#b4ff39}
.timer{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;position:sticky;top:6px;z-index:5}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--accent);direction:ltr}
.timer.low b{color:var(--danger)}
.essay{width:100%;line-height:1.7;resize:vertical}
.essayview{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;line-height:1.7;font-size:15px}
ul.l,ol.l{margin:6px 0;padding-inline-start:20px;line-height:1.8;font-size:15px;color:#cfd6e2}
h3{margin:0 0 8px;font-size:17px}
a.src{color:var(--accent2)}
.num.in,input.num{width:90px}
.g4{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden;background:var(--card)}
.g4>div{padding:16px;border:0 solid var(--line)}
.g4>div:nth-child(odd){border-inline-end-width:1px}.g4>div:nth-child(-n+2){border-bottom-width:1px}
.g4 span,.g2 span{display:block;font-size:13px;color:var(--dim)}
.g4 b{font-size:30px;display:block;margin-top:4px}
.g4>div:nth-child(2) b{color:var(--accent)}.g4>div:nth-child(4) b{color:var(--danger)}.g4>div:nth-child(3) b{color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>div{background:var(--card2);border-radius:14px;padding:12px}.g2 b{font-size:28px;color:var(--accent);display:block}.g2 em{font-style:normal;font-size:12px;color:var(--dim)}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px}
.b{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--dim)}
.b i{width:70%;background:linear-gradient(var(--accent),var(--accent2));border-radius:6px 6px 2px 2px;min-height:3px;opacity:.9}
.b em{font-style:normal;font-size:11px;color:var(--txt);min-height:14px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.mh{font-size:11px;color:var(--dim)}
.md{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--card2);font-size:12px;color:var(--dim)}
.md.l1{background:#2c4a1a;color:var(--txt)}.md.l2{background:#5b8f1c;color:#fff}.md.l3{background:var(--accent);color:#0d0f14;font-weight:700}
.md.today{outline:2px solid var(--accent2)}
.srow{margin-bottom:12px}.srow div{display:flex;justify-content:space-between;gap:8px}.srow span{font-size:13px;color:var(--dim)}
.prof{text-align:center;margin-bottom:16px}
.nm input{background:none;border:0;border-bottom:1px dashed var(--line);text-align:center;font-size:24px;font-weight:800;margin:10px 0 4px;border-radius:0;width:70%}
.streak h2{margin:0 0 4px;font-size:20px}
.wk{display:flex;justify-content:space-between;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--card2)}
.wd.on i{background:var(--accent);box-shadow:0 0 10px rgba(180,255,57,.5)}
.wd.today i{outline:2px solid var(--accent2);outline-offset:2px}
@media(min-width:820px){#app{padding-top:30px}}
.b i.z{opacity:.2}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<nav id="nav" aria-label="ניווט"></nav>
<script>var Av={mock:{v1:[{id:"v1-1",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["צמר : כבשה","להקה : ציפורים","רועה : כבשים","דשא : עדר"],a:1,e:"עדר הוא קבוצה של כבשים, ולהקה היא קבוצה של ציפורים. היחס הוא שם קיבוצי וחבריו.",w:["זה יחס בין תוצר למקורו.","","זה יחס בין בעל מקצוע לבעלי החיים שהוא מטפל בהם, ולא בין קבוצה לחבריה.","זה יחס בין מזון למי שאוכל אותו."],stem:"עדר : כבשים"},{id:"v1-2",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["ספרייה : ספרן","כתב יד : דיו","סופר : כתיבה","שיר : בית"],a:3,e:"פרק הוא חלק מספר, ובית הוא חלק משיר.",w:["זה יחס בין מקום לעובד בו.","זה יחס בין חפץ לחומר.","זה יחס בין בעל מקצוע לפעולה.",""],stem:"ספר : פרק"},{id:"v1-3",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["תזמורת : קונצרט","מלח : ספינה","כנר : תזמורת","קברניט : ספינה"],a:3,e:"מנצח מוביל ומנהל את התזמורת, וקברניט מוביל ומנהל את הספינה.",w:["זה יחס בין קבוצה לאירוע.","זה יחס בין איש צוות לכלי השיט, ולא בין מנהיג לכלי.","זה יחס בין חבר בקבוצה לקבוצה, ולא בין מי שמוביל אותה.",""],stem:"מנצח : תזמורת"},{id:"v1-4",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["חם : קר","חם : רותח","מים : קרח","חורף : סתיו"],a:1,e:"קפוא הוא דרגה קיצונית יותר של קר, ורותח הוא דרגה קיצונית יותר של חם.",w:["זה יחס של ניגוד ולא של עוצמה.","","זה יחס בין חומר למצב הצבירה שלו.","אלה שתי עונות, ואין ביניהן יחס של עוצמה."],stem:"קר : קפוא"},{id:"v1-5",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["כתיבה : מכתב","בית : דירה","בנאי : לבנים","אופה : עוגה"],a:0,e:"בנייה היא התהליך שתוצאתו בית, וכתיבה היא התהליך שתוצאתו מכתב.",w:["","זה יחס בין מכלול לחלק.","זה יחס בין בעל מקצוע לחומר.","זה יחס בין בעל מקצוע לתוצר, ולא בין תהליך לתוצר."],stem:"בנייה : בית"},{id:"v1-6",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["מיטה : כרית","לילה : חושך","צמא : שתייה","שינה : חלום"],a:2,e:"שינה היא הפעולה שמספקת את הצורך שנוצר בגלל עייפות, ושתייה מספקת את הצורך שנוצר בגלל צמא.",w:["זה יחס בין חפץ לחלק או לתוספת שלו.","זה יחס בין זמן לתכונה שלו.","","חלום הוא תופעה שמתרחשת בשינה, ולא פעולה שמספקת צורך."],stem:"עייפות : שינה"},{id:"v1-7",t:"כללים וסידור",q:"לחמישה אנשים משקלים שונים. א כבד מב אך קל מג. ד כבד מא. ה קל מב. מי הקל ביותר מבין החמישה?",o:["א","ב","ה","אי אפשר לדעת"],a:2,e:"מהנתונים: ג>א>ב>ה ו-ד>א. ה הוא הקל ביותר בכל סדר אפשרי.",w:["א כבד מב, ולכן אינו הקל ביותר.","ה קל מב.","","אפשר: ה קל מב, ב קל מא, ו-ג ו-ד כבדים מא."]},{id:"v1-8",t:"הסקה מטקסט",q:"מחקר בדק שני כפרים דומים: בכפר א׳ הותקנו מדי מים חכמים, ובכפר ב׳ לא. צריכת המים בכפר א׳ ירדה ב-15%, ובכפר ב׳ לא השתנתה. מה אפשר להסיק?",o:["מדי המים החכמים עשויים לתרום לירידה בצריכת המים.","בכפר ב׳ צריכת המים הייתה גבוהה מלכתחילה.","מדי המים החכמים גרמו בוודאות לירידה.","תושבי כפר א׳ חסכוניים יותר מתושבי כפר ב׳."],a:0,e:"הממצא תומך בקשר אפשרי בין המדים לבין הירידה בצריכה. הוא אינו מוכיח זאת בוודאות.",w:["","אין נתונים על רמת הצריכה.","מחקר כזה מצביע על כך שייתכן קשר, אך אינו מוכיח סיבתיות.","הכפרים תוארו כדומים; אין מידע זה."]},{id:"v1-9",t:"חיזוק והחלשה",q:"בעל מסעדה חדשה טוען שהמסעדה תצליח, כי היא ממוקמת בלב מרכז העיר, שבו עוברים אלפי אנשים בכל יום. על איזו הנחה מבוססת טענתו?",o:["המחירים במסעדה יהיו נמוכים מאלה של מתחרים.","בעל המסעדה מנוסה בענף.","אין מסעדות נוספות בעיר.","בין העוברים והשבים ימצאו רבים שיבחרו לאכול במסעדה."],a:3,e:"הטענה מבוססת על כך שהרבה אנשים עוברים במקום. ההנחה הנדרשת היא שמתוכם רבים יהיו לקוחות פוטנציאליים.",w:["הטענה מבוססת על המיקום ולא על המחיר.","ניסיון אינו מוזכר כסיבה לטענה.","הטענה אינה צריכה הנחה כל כך חזקה; יכולות להיות מסעדות אחרות.",""]},{id:"v1-10",t:"השלמת משפטים",q:"המנהל לא התרגש מהביקורת על החלטתו, ולא ____ בה, אלא ____ ליישם אותה במלואה.",o:["התעקש / המשיך","התעקש / ויתר","חזר בו / המשיך","חזר בו / ויתר"],a:2,e:"המשפט מתאר מנהל שלא זז מעמדתו: הוא לא חזר בו אלא המשיך ליישם. הצירוף 'לא ... אלא' דורש ניגוד.",w:["'לא התעקש בה אלא המשיך' אינו הגיוני, כי הם כמעט אותו דבר.","התעקש וגם ויתר סותרים זה את זה, והחיבור ל'אלא' אינו הגיוני.","","אחרי 'אלא' צריך לבוא ההפך מחזרה בו, וויתור אינו כזה."]},{id:"v1-11",t:"הסקה מטקסט",q:"בעקבות הפחתת מחיר הכרטיסים לסרטים, מספר הצופים בקולנוע הוכפל, ואילו הכנסות הקולנוע ירדו. מה בהכרח נכון?",o:["ההכנסות ירדו בגלל ירידה בקניות מזון.","מחיר הכרטיס ירד ביותר מ-50%.","מחיר הכרטיס ירד בפחות מ-50%.","מספר הצופים עלה בכל האולמות."],a:1,e:"הכנסות = מחיר \xD7 כמות. הכמות הוכפלה וההכנסות ירדו, ולכן המחיר ירד ביותר מ-50%. אילו ירד בפחות מ-50% ההכנסות היו עולות.",w:["המידע אינו מזכיר כך.","","אם כך ההכנסות היו עולות, כי הכמות הוכפלה.","הנתון הוא על סך הצופים."]},{id:"v1-12",t:"הסקה",q:"אם החברה תעלה את המחירים, מכירותיה יפחתו. מכירות החברה לא פחתו. מה נובע בהכרח?",o:["החברה הורידה את המחירים.","מכירות החברה עלו.","החברה לא העלתה את המחירים.","החברה תעלה את המחירים בעתיד."],a:2,e:"אם העלאת מחירים גוררת ירידה במכירות, כשאין ירידה בהכרח לא הועלו המחירים.",w:["ייתכן שהמחירים נשארו כשהיו.","ייתכן שהמכירות נשארו ללא שינוי.","","הנתונים אינם עוסקים בעתיד."]},{id:"v1-13",t:"הסקה מטקסט",q:"מנהלת הצהירה: רק עובדים שעמדו ביעדים השנה יקבלו בונוס. אורי קיבל בונוס. מה נובע בהכרח?",o:["אורי עמד ביעדים השנה.","אורי עובד בחברה יותר משנה.","כל מי שעמד ביעדים קיבל בונוס.","אורי היה העובד הטוב ביותר."],a:0,e:"'רק עובדים שעמדו ביעדים יקבלו' פירושו שעמידה ביעדים היא תנאי הכרחי. אורי קיבל, ולכן הוא עמד ביעדים.",w:["","הנתון אינו מופיע.","ההצהרה קובעת תנאי הכרחי ולא מספיק.","אין נתונים על השוואה בין העובדים."]},{id:"v1-14",t:"הסקה מטקסט",q:"בחברה הוחלט לקצר את יום העבודה משמונה שעות לשש, בלי לפגוע בשכר. אחרי שנה: התפוקה הכוללת של העובדים לא השתנתה. מה אפשר להסיק?",o:["העובדים עבדו יותר שעות.","התפוקה לשעת עבודה עלתה.","עלות השכר לשעת עבודה ירדה.","התפוקה הכוללת עלתה."],a:1,e:"אותה תפוקה בפחות שעות פירושה תפוקה גבוהה יותר לשעה.",w:["היום התקצר ולא התארך.","","השכר נשאר זהה אבל השעות פחתו, ולכן עלות השעה עלתה.","הנתון הוא שהתפוקה הכוללת לא השתנתה."]},{id:"v1-15",t:"השלמת משפטים",q:"החוקר לא הסתפק בעדויות ____, והמשיך לחפש ראיות ____ שיקשרו את החשוד לזירה.",o:["עקיפות / ישירות","חלשות / חלשות","ישירות / עקיפות","מוצקות / עקיפות"],a:0,e:"החוקר לא הסתפק בעדויות עקיפות, ולכן חיפש ראיות ישירות. זה המעבר הטבעי בהליך חקירה.",w:["","אין משמעות לחיפוש ראיות חלשות.","הסדר מתהפך: לא מסתפקים בעדויות ישירות ומחפשים ישירות?","מי שיש לו ראיות מוצקות אינו ממשיך לחפש ראיות קשורות."]},{id:"v1-16",t:"כללים וסידור",q:"בבית ספר 30 תלמידים בשכבה. 18 לומדים צרפתית, 15 לומדים ערבית, ו-5 תלמידים אינם לומדים אף אחת מהשפות. כמה תלמידים לומדים את שתי השפות?",o:["10","13","12","8"],a:3,e:"25 תלמידים לומדים לפחות שפה אחת (30-5). 18+15=33 סופרים את הלומדים שתי שפות פעמיים: 33-25=8.",w:["אין דרך לקבל את התוצאה הזאת מהנתונים.","זהו מספר הלומדים רק צרפתית אם מחסרים 5; לא נותנים את הקבוצה המשותפת.","זהו ההפרש 30 פחות 18, אשר אינו מבטא את החיתוך.",""]},{id:"v1-17",t:"הסקה",q:"שלושה חברים - יוסי, מיכל ונועם - הם רופא, עורך דין ומהנדס, לא בהכרח בסדר הזה. נועם אינו רופא. מיכל אינה עורכת דין ואינה מהנדסת. מה נובע בהכרח?",o:["נועם הוא המהנדס.","נועם הוא עורך הדין.","מיכל היא הרופאה.","יוסי הוא עורך הדין."],a:2,e:"מיכל אינה עורכת דין ואינה מהנדסת, לכן היא הרופאה. נועם ויוסי חולקים את שני התפקידים האחרים, ואין מידע שמכריע ביניהם.",w:["ייתכן שנועם עורך דין.","ייתכן שנועם מהנדס.","","ייתכן שיוסי מהנדס ונועם עורך דין."]},{id:"v1-18",t:"הסקה",q:"בכל יום שבו יורד גשם, התנועה בכביש מואטת. היום התנועה בכביש לא הואטה. מה נובע בהכרח?",o:["ביום שבו אין גשם, התנועה אף פעם לא מואטת.","היום היה יום חם ושמשי.","התנועה מואטת רק כשיורד גשם.","היום לא ירד גשם."],a:3,e:"אם גשם גורר האטה, העדר האטה מראה שלא ירד גשם. שלילת התוצאה מובילה לשלילת התנאי.",w:["הכלל אינו שולל האטה מסיבות אחרות, כמו תאונה.","הנתונים אינם אומרים דבר על מזג האוויר מעבר לגשם.","זה היפוך של הכלל ולא נובע ממנו.",""]},{id:"v1-19",t:"הבנת הנקרא",q:"מהו הרעיון המרכזי של הקטע?",o:["אפקט הפלצבו יעיל יותר מתרופות אמיתיות.","אפקט הפלצבו הוא תגובה אמיתית של הגוף לציפייה, שמשתנה לפי סוג המצב וצורת המתן.","יש להחליף טיפולים רפואיים באמונה.","אפקט הפלצבו הוא דמיון בלבד."],a:1,e:"הקטע מציג את הפלצבו כתופעה פיזיולוגית אמיתית שתלויה בתנאים, ומסתייג מהחלפת טיפול רפואי.",w:["הקטע אינו משווה יעילות ואינו קובע זאת.","","הקטע מזהיר במפורש מפני מסקנה כזו.","הקטע מציג זאת כעמדה ישנה שהמחקרים החדשים שוללים."],p:"pl"},{id:"v1-20",t:"הבנת הנקרא",q:"באיזה מצב אפקט הפלצבו כמעט נעדר, לפי הקטע?",o:["בחרדה.","במחלות שבהן אפשר למדוד שינוי חיצוני, כמו גודל גידול.","בכאב.","בבחילות."],a:1,e:"הקטע אומר ישירות שהאפקט כמעט נעדר במחלות שבהן אפשר למדוד שינוי חיצוני.",w:["האפקט בולט גם בחרדה.","","הקטע אומר שהאפקט בולט בכאב.","האפקט בולט גם בבחילות."],p:"pl"},{id:"v1-21",t:"הבנת הנקרא",q:"מה אפשר להסיק מהקטע לגבי זריקה לא פעילה וכדור לא פעיל?",o:["סביר שהזריקה תיתפס כחזקה יותר ותשפיע יותר מהכדור.","הזריקה תקטין גידולים.","הכדור ישפיע יותר כי הוא נבלע.","שניהם לא ישפיעו כלל."],a:0,e:"הקטע אומר שצורת המתן משנה את ההשפעה, וזריקה נתפסת כחזקה יותר.",w:["","הקטע אומר שהאפקט כמעט נעדר בגידולים.","הקטע אומר ההפך על תפיסת הזריקה.","זה סותר את הקטע, שמתאר השפעה של ציפייה."],p:"pl"},{id:"v1-22",t:"הבנת הנקרא",q:"מה משמעות המילה 'בולטת' במשפט 'היא בולטת בכאב'?",o:["ניכרת בבירור.","חלשה.","מפריעה.","בולטת החוצה פיזית."],a:0,e:"בהקשר, 'בולטת' פירושה שההשפעה ניכרת בבירור במצבים אלה.",w:["","המשפט מציין שההשפעה חזקה.","אין בהקשר רמז להפרעה.","זה פירוש פיזי ולא מתאים להקשר."],p:"pl"},{id:"v1-23",t:"הבנת הנקרא",q:"מה תפקידו של המשפט האחרון בקטע?",o:["הוא סותר את כל הקטע.","הוא מתאר ניסוי מסוים.","הוא מסייג מסקנה שאפשר להסיק בטעות מהממצאים.","הוא מסכם את תולדות המחקר."],a:2,e:"המשפט מזהיר מפני הסקה לא נכונה שאפשר להחליף טיפול באמונה.",w:["הוא מוסיף הסתייגות ולא סותר את התיאור.","הוא אינו מתאר ניסוי אחד.","","הוא אינו עוסק בהיסטוריה."],p:"pl"}],v2:[{id:"v2-1",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["מתנה : שמחה","קומיקאי : במה","צחוק : בדיחה","משעשע : משעמם"],a:0,e:"בדיחה גורמת לצחוק, ומתנה גורמת לשמחה. היחס הוא סיבה ותוצאה.",w:["","זה יחס בין אדם למקום.","הסדר הפוך: כאן התוצאה באה ראשונה והסיבה אחריה.","זה יחס של ניגוד."],stem:"בדיחה : צחוק"},{id:"v2-2",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["מאזניים : משקל","מורה : ציון","מד חום : חולה","גשם : מטרייה"],a:0,e:"סרגל הוא כלי שמודד אורך, ומאזניים הם כלי שמודד משקל.",w:["","זה יחס בין אדם לתוצר של עבודתו.","זה יחס בין כלי למי שנבדק בו, ולא למה שהוא מודד.","זה יחס בין תופעה לאמצעי הגנה."],stem:"סרגל : אורך"},{id:"v2-3",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["שורש : צמיחה","עץ : יער","אצבע : כף יד","פרי : מיץ"],a:2,e:"עלה הוא חלק מעץ, ואצבע היא חלק מכף יד. היחס הוא חלק ומכלול.",w:["זה יחס בין חלק לתפקידו.","זה יחס בין פרט לקבוצה שהוא נמנה עליה, ולא בין חלק למכלול.","","זה יחס בין חומר גלם למוצר."],stem:"עלה : עץ"},{id:"v2-4",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["מורה : תלמיד","מנתח : בית חולים","נגר : פטיש","צייר : ציור"],a:2,e:"המכחול הוא כלי העבודה של האמן, והפטיש הוא כלי העבודה של הנגר.",w:["זה יחס בין שני אנשים, ולא בין אדם לכלי.","זה יחס בין בעל מקצוע למקום עבודתו.","","זה יחס בין יוצר לתוצר ולא בין בעל מקצוע לכלי העבודה שלו."],stem:"אמן : מכחול"},{id:"v2-5",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["בשר : צלייה","מתופף : תוף","ירקן : ירקות","סוחר : קונה"],a:2,e:"קצב מוכר בשר, וירקן מוכר ירקות. היחס הוא מוכר וסחורתו.",w:["זה יחס בין חומר לפעולה.","זה יחס בין נגן לכלי נגינה.","","זה יחס בין שני אנשים."],stem:"קצב : בשר"},{id:"v2-6",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["עשיר : נדיב","קמצן : חסכן","אמיץ : פחדן","חרוץ : שקדן"],a:2,e:"נדיב וקמצן הן תכונות מנוגדות, וכך גם אמיץ ופחדן.",w:["זה קשר אפשרי בין מצב לתכונה, ולא ניגוד.","שתי המילים קרובות במשמעות ואינן הפוכות.","","שתי המילים קרובות במשמעות ואינן הפוכות."],stem:"נדיב : קמצן"},{id:"v2-7",t:"הסקה",q:"כל חברי המועדון נהנים מהנחה בחנות. דנה אינה נהנית מהנחה בחנות. מה נובע בהכרח מהנתונים?",o:["דנה אינה חברה במועדון.","דנה לא נכנסה לחנות מעולם.","דנה הייתה חברה במועדון בעבר.","רק חברי המועדון נהנים מהנחה בחנות."],a:0,e:"אם כל חבר מקבל הנחה, מי שלא מקבל הנחה אינו חבר. זו הסקה תקפה בדרך של שלילת התוצאה.",w:["","הנתונים אינם אומרים דבר על כניסה לחנות.","אין בנתונים מידע על העבר.","זה היפוך של הכלל. הנתון אומר שכל חבר מקבל הנחה, ולא שרק חברים מקבלים."]},{id:"v2-8",t:"השלמת משפטים",q:"הנאום היה ארוך ומייגע: רוב המאזינים ____ אחרי דקות ספורות, ואילו הנואם עצמו ____ בלהט.",o:["איבדו עניין / המשיך","איבדו עניין / נחלש","גילו עניין / המשיך","איבדו עניין / הפסיק"],a:0,e:"ארוך ומייגע מוביל לאיבוד עניין. 'ואילו' מציג ניגוד, ולכן הנואם המשיך בלהט.",w:["","'ואילו' דורש ניגוד, ונחלש אינו ניגוד לאיבוד עניין.","'ארוך ומייגע' אינו מתיישב עם גילוי עניין.","'בלהט' סותר הפסקה."]},{id:"v2-9",t:"הסקה",q:"כל הרופאים בבית החולים עברו הכשרה בעזרה ראשונה. חלק מעובדי בית החולים הם אחיות. מה נובע בהכרח?",o:["אין אחיות שעברו הכשרה בעזרה ראשונה.","כל האחיות עברו הכשרה בעזרה ראשונה.","חלק מהרופאים הם אחיות.","לא ניתן לדעת אם האחיות עברו הכשרה בעזרה ראשונה."],a:3,e:"הכלל הראשון מדבר על הרופאים בלבד, והנתון השני מדבר על אחיות. אין חיבור לוגי ביניהם, ולכן אי אפשר להסיק דבר על האחיות.",w:["גם זה אינו נובע, כי אין מידע על האחיות.","הנתון עוסק ברופאים בלבד.","אין בנתונים קשר בין הקבוצות.",""]},{id:"v2-10",t:"חיזוק והחלשה",q:"עיתונאי כתב: מחקר מצא שאנשים שאוכלים ארוחת בוקר מדי יום שוקלים פחות מאחרים. לכן ארוחת בוקר מסייעת לירידה במשקל. איזה ממצא נוסף יחליש את המסקנה?",o:["יש אנשים שאוכלים ארוחת בוקר ושוקלים הרבה.","ארוחות בוקר שונות במרכיביהן.","רוב הנבדקים היו בני שלושים.","אנשים שמקפידים על ארוחת בוקר מקפידים גם על פעילות גופנית ועל תזונה מאוזנת."],a:3,e:"אם ההרגלים הבריאים נלווים לארוחת בוקר, ייתכן שהם הגורם לשקילה הנמוכה ולא ארוחת הבוקר עצמה.",w:["זה חריג, ואינו סותר מגמה.","אין בכך כדי לפגוע במסקנה, רק בדיוק שלה.","הגיל של הנבדקים אינו מערער על הקשר הסיבתי.",""]},{id:"v2-11",t:"הסקה מטקסט",q:"טבלה מראה כי בעיר X שיעור החולים בשפעת גבוה בחורף פי שניים מאשר בקיץ. ראש העיר טוען שהסיבה היא הקור. איזה נתון יחליש את טענתו?",o:["הקיץ בעיר X חם מאוד.","בעיר X יש מעט מרפאות.","בחורף יש יותר חולים בכל הגילאים.","בערים באקלים חם שבהן אין חורף קר יש בחורף אותו שיעור חולים."],a:3,e:"אם גם באקלים חם יש יותר חולים בחורף, ההסבר של הקור נחלש; ייתכן שהסיבה היא התקהלות בחללים סגורים או גורם אחר.",w:["אין כאן נתון שמחליש את הקשר.","זה אינו קשור לשיעור החולים.","אין בכך שלילה של קשר לקור.",""]},{id:"v2-12",t:"השלמת משפטים",q:"הכתבה הציגה את הדעות של שני הצדדים ולא הכריעה ביניהם. אפשר לתאר את עמדת הכתבה כ____.",o:["תוקפנית","נלהבת","מטעה","ניטרלית"],a:3,e:"כשכתבה מציגה צדדים בלי להכריע, עמדתה ניטרלית.",w:["תוקפנות מתארת התקפה על צד, ולא הצגה ללא הכרעה.","התלהבות מתארת תמיכה נמרצת שאינה מופיעה כאן.","אין בנתונים אינדיקציה שהכתבה מטעה.",""]},{id:"v2-13",t:"חיזוק והחלשה",q:"חברה הכריזה: מי שלמד בקורס שלנו יעבוד בתוך חצי שנה. בפרסום מוצגים שלושה בוגרים שקיבלו עבודה אחרי הקורס. איזו טענה מחלישה ביותר את המסקנה שהקורס מוביל לעבודה?",o:["הקורס מתקיים פעמיים בשנה.","הקורס נמשך ארבעה חודשים.","שלושת הבוגרים קיבלו עבודה בשלוש חברות שונות.","הבוגרים שהוצגו נבחרו מתוך מאות בוגרים, ורובם לא מצאו עבודה בתחום."],a:3,e:"הפרסום מציג דוגמאות מקרה. אם הן אינן מייצגות, המסקנה על הקורס כולו נחלשת.",w:["תדירות הקורס אינה משנה את המסקנה.","משך הקורס אינו משפיע על השאלה אם הוא מוביל לעבודה.","זה אינו מחליש אלא אם היה מידע על ייצוגיות.",""]},{id:"v2-14",t:"חיזוק והחלשה",q:"ראש העירייה טוען שהקמת מרכז ספורט בשכונה תקטין את מספר מקרי הונדליזם שמבצעים בני נוער. איזה מהבאים מחזק ביותר את טענתו?",o:["בשכונה גרים בני נוער רבים.","הקמת מרכז הספורט תעלה כסף רב.","בשכונות אחרות שבהן הוקמו מרכזי ספורט ירד מספר מקרי הונדליזם, ולא חל שינוי משמעותי אחר.","ראש העירייה עצמו מתעניין בספורט."],a:2,e:"הטענה סיבתית, ולכן עדות ממקרים דומים שבהם הפעולה הביאה לתוצאה, כשאין גורם מבלבל אחר, היא החיזוק הטוב ביותר.",w:["הנתון מראה שהבעיה אולי גדולה, לא שהמרכז יפתור אותה.","העלות אינה קשורה לשאלה אם הוא יקטין הונדליזם.","","זה עניין אישי שאינו מחזק את הטענה."]},{id:"v2-15",t:"כללים וסידור",q:"ארבעה חברים - רון, שיר, תום ויעל - יושבים בשורה אחת. שיר יושבת בין רון ליעל. תום יושב בקצה השורה, בסמוך ליעל. מי יושב בקצה השני של השורה?",o:["רון","שיר","אי אפשר לדעת","יעל"],a:0,e:"תום בקצה, יעל לידו. שיר בין רון ליעל, כלומר: תום, יעל, שיר, רון. רון הוא בקצה השני.",w:["","שיר בין רון ליעל, ולכן אינה בקצה.","אפשר לקבוע: הסדר תום, יעל, שיר, רון.","יעל סמוכה לתום, וסמוכה לשיר, ולכן היא באמצע."]},{id:"v2-16",t:"כללים וסידור",q:"ביום מסוים אי אפשר לשבץ רואה חשבון בפגישה אחרי השעה 14:00. דנה נפגשת בשלוש פגישות ברצף: האחרונה מסתיימת ב-14:00. כל פגישה נמשכת שעה. מתי התחילה הפגישה הראשונה של דנה?",o:["11:00","10:00","13:00","12:00"],a:0,e:"שלוש פגישות של שעה ברצף שמסתיימות ב-14:00 התחילו שלוש שעות קודם: ב-11:00.",w:["","זה ארבע שעות לפני הסיום, ולא שלוש.","הפגישה האחרונה התחילה ב-13:00.","מי שמסיימת ב-14:00 אחרי שלוש פגישות התחילה הרבה לפני כן."]},{id:"v2-17",t:"חיזוק והחלשה",q:"מחקר מצא שתלמידים שישנים לפחות שמונה שעות בלילה מקבלים בממוצע ציונים גבוהים יותר. לכן שינה ארוכה גורמת לציונים גבוהים. איזה מהבאים מחליש ביותר את המסקנה?",o:["חלק מהתלמידים שישנו שמונה שעות קיבלו ציונים נמוכים.","בשנה האחרונה ציוני התלמידים בישראל עלו.","תלמידים שמתמידים בלימודים נוטים גם לשמור על סדר יום קבוע ולישון די שעות.","במחקר השתתפו תלמידים מכמה בתי ספר."],a:2,e:"המסקנה עוברת מקשר סטטיסטי לסיבתיות. אם גורם שלישי, כמו התמדה, גורם גם לשינה וגם לציונים, הקשר אינו מוכיח שהשינה היא הסיבה.",w:["חריגים אינם סותרים מגמה ממוצעת, ואינם פוגעים בטענת הסיבתיות.","זה נתון כללי שלא קשור לשינה.","","זה אינו קשור לשאלה אם השינה היא הגורם."]},{id:"v2-18",t:"הסקה מטקסט",q:"בעיר נערך סקר: 70% מהתושבים הצהירו שהם משתמשים בתחבורה ציבורית לפחות פעם בשבוע. הסקר נערך בתחנת הרכבת המרכזית בשעות הבוקר. איזו הסתייגות מתבקשת?",o:["הסקר נערך בבוקר ולא בערב.","70% הוא מספר גדול מדי.","המדגם אינו ייצוגי, כי ברכבת בבוקר יש יותר משתמשי תחבורה ציבורית.","בסקר השתתפו אנשים בגילאים שונים."],a:2,e:"מי שנדגם בתחנת רכבת הוא בעל סיכוי גבוה יותר להשתמש בתחבורה ציבורית, ולכן המדגם מוטה.",w:["הבעיה אינה השעה אלא מקום הדגימה.","אין קשר בין גודל האחוז לאמינות.","","מגוון גילאים אינו בעיה."]},{id:"v2-19",t:"הבנת הנקרא",q:"על מה עוסק הקטע בעיקר?",o:["בחשיבות של שטחים פתוחים בכפרים.","בסיבות לטמפרטורה הגבוהה בערים ובדרכים להתמודד איתה.","בהיסטוריה של התכנון העירוני.","ביתרונות של מזגנים."],a:1,e:"הקטע מתאר את התופעה, מציג שלוש סיבות, ואחר כך הצעות לפתרון וסייגים.",w:["הקטע עוסק בערים.","","אין בקטע התייחסות היסטורית.","המזגנים מוזכרים כמקור חום, לא כיתרון."],p:"uh"},{id:"v2-20",t:"הבנת הנקרא",q:"איזו מהבאות אינה מוזכרת בקטע כסיבה לאי החום העירוני?",o:["חום שנפלט ממכוניות ומזגנים.","היעדר צמחייה.","חומרי הבנייה.","קרבת העיר לים."],a:3,e:"הקטע מונה שלוש סיבות. קרבה לים אינה אחת מהן.",w:["מוזכר כסיבה שלישית.","מוזכר כסיבה שנייה.","מוזכרים כסיבה ראשונה.",""],p:"uh"},{id:"v2-21",t:"הבנת הנקרא",q:"לפי הקטע, מה היתרון של עצים מעבר לצל?",o:["הם פולטים חום בערב.","הם מחזירים אור שמש.","הם סופגים אספלט.","הם מקררים את האוויר בהתאדות מים."],a:3,e:"הקטע אומר שעצים מקררים את האוויר בתהליך של התאדות מים.",w:["זו תכונה של אספלט ובטון.","הקטע אינו מזכיר זאת.","אין לכך אזכור.",""],p:"uh"},{id:"v2-22",t:"הבנת הנקרא",q:"מה אפשר להסיק מהמשפט האחרון בקטע?",o:["אין טעם להשקיע בפתרונות.","לפי התומכים בגישה זו, כדאי להתחיל בפתרונות באזורים שבהם הבעיה קשה ביותר.","המיפוי יקר יותר מכל פתרון אחר.","כל הפתרונות יעילים באותה מידה."],a:1,e:"הטענה היא לתעדף: למפות כדי לנתב משאבים מוגבלים לאזורים החמים ביותר.",w:["הטענה מציעה לתעדף, לא לוותר.","","אין בקטע השוואת עלויות כזו.","הטענה מניחה שהמשאבים מוגבלים ויש לבחור."],p:"uh"},{id:"v2-23",t:"הבנת הנקרא",q:"מה תפקיד המילה 'אולם' בקטע?",o:["היא מציגה סייג להצעות שהוזכרו לפניה.","היא מדגימה את הפתרונות.","היא מוסיפה סיבה נוספת לתופעה.","היא מסכמת את הקטע."],a:0,e:"אחרי הצעות לפתרון, 'אולם' מוסיפה את הקושי: הפתרונות יקרים.",w:["","היא אינה מדגימה, אלא מסייגת.","הסיבות הוצגו קודם.","הקטע ממשיך אחריה."],p:"uh"}],q1:[{id:"q1-1",t:"ממוצעים",q:"בכיתה א׳ 20 תלמידים והממוצע שלהם במבחן הוא 80. בכיתה ב׳ 10 תלמידים והממוצע שלהם 89. מהו הממוצע המשותף של שתי הכיתות?",o:["⁦84.5⁩","⁦86⁩","⁦62.25⁩","⁦83⁩"],a:3,e:"סכום ציוני כיתה א׳: 20\xD780 = 1600. כיתה ב׳: 10\xD789 = 890. סך הכול 2490 ל-30 תלמידים: 83.",w:["ממוצע פשוט של שני הממוצעים מתעלם ממספרי התלמידים השונים בכיתות.","ערך זה אינו הסכום הכולל של הציונים (2490) חלקי מספר כל התלמידים (30).","חילוק ב-40 אינו נכון: יש לחלק את סכום הציונים הכולל ב-30, מספר כל התלמידים.",""]},{id:"q1-2",t:"גאומטריה",q:"במשולש ישר־זווית אורכי הניצבים 9 ו-12 ס״מ. מהו אורך היתר (בס״מ)?",o:["⁦21⁩","⁦14⁩","⁦54⁩","⁦15⁩"],a:3,e:"לפי משפט פיתגורס: ⁦9\xB2 + 12\xB2 = 225⁩, והשורש של 225 הוא 15.",w:["סכום הניצבים אינו היתר; לפי פיתגורס היתר קצר מהסכום.","היתר הוא השורש של סכום ריבועי הניצבים; ערך זה קטן ממנו ב-1 ואינו מקיים את משפט פיתגורס.","זה השטח, לא אורך היתר.",""]},{id:"q1-3",t:"הסקה מטבלה",q:"הטבלה מציגה את מספר היחידות שנמכרו בארבע ערים בשנתיים. איזה אחוז מסך המכירות בשנה ב׳ היה בעיר אשדוד?",tb:{head:["עיר","שנה א׳","שנה ב׳"],rows:[["חיפה","200","120"],["באר שבע","180","180"],["אשדוד","180","150"],["נתניה","240","150"]]},o:["⁦25⁩%","⁦30⁩%","⁦22.5⁩%","⁦150⁩%"],a:0,e:"סך המכירות בשנה ב׳: ⁦120+180+150+150⁩ = 600. החלק של אשדוד: 150/600 = 25%.",w:["","חישוב לא נכון של החלק מהסך.","זה האחוז משנה א׳, לא משנה ב׳.","זה מספר היחידות, לא אחוז."]},{id:"q1-4",t:"בעיות דרך",q:"נהג נסע ממקום א׳ למקום ב׳ במהירות 40 קמ״ש וחזר באותו מסלול במהירות 60 קמ״ש. מהי המהירות הממוצעת שלו בכל הנסיעה (בקמ״ש)?",o:["⁦54⁩","⁦48⁩","⁦50⁩","⁦60⁩"],a:1,e:"מהירות ממוצעת = מרחק כולל \xF7 זמן כולל. נבחר מרחק חד־כיווני של 2400 ק״מ: זמן ההלוך 2400/40 = 60 שעות, זמן החזרה 2400/60 = 40 שעות. מרחק כולל 4800 ק״מ ב-100 שעות: 48 קמ״ש.",w:["ערך זה אינו מתקבל מחלוקת המרחק הכולל בזמן הכולל. המהירות הממוצעת תמיד נמוכה מהממוצע החשבוני כאן.","","ממוצע חשבוני של המהירויות אינו נכון, כי הנהג מבלה זמן רב יותר במהירות האיטית.","המהירות הממוצעת אינה המהירות השנייה."]},{id:"q1-5",t:"סטטיסטיקה",q:"נתונים המספרים ⁦29, 28, 6, 11, 24⁩. מהו ההפרש בין הממוצע לחציון? (ערך מוחלט)",o:["⁦4.4⁩","⁦24⁩","⁦19.6⁩","⁦8.6⁩"],a:0,e:"אחרי סידור: ⁦6, 11, 24, 28, 29⁩. החציון (האמצעי): 24. הממוצע: 98/5 = 19.6. ההפרש: 4.4.",w:["","זה החציון, לא ההפרש.","זה הממוצע, לא ההפרש.","נבחר המספר השני כחציון; החציון הוא האמצעי אחרי סידור."]},{id:"q1-6",t:"קומבינטוריקה",q:"במסעדה 3 מנות ראשונות, 4 מנות עיקריות ו-2 קינוחים. כמה ארוחות שונות אפשר להרכיב מכל סוג מנה אחת?",o:["⁦27⁩","⁦12⁩","⁦9⁩","⁦24⁩"],a:3,e:"לכל בחירה בנפרד מכפילים: 3\xD74\xD72 = 24.",w:["ערך זה אינו מכפלת מספר הבחירות בכל שלב: יש לכפול ולא להוסיף או להשמיט שלב.","שכחו את הקינוח.","בבחירות בלתי תלויות מכפילים את מספר האפשרויות ולא מחברים.",""]},{id:"q1-7",t:"בעיות הספק",q:"פועל א׳ מסיים עבודה לבד ב-6 ימים, ופועל ב׳ מסיים אותה לבד ב-3 ימים. בכמה ימים יסיימו אותה אם יעבדו יחד באותו קצב?",o:["⁦4.5⁩","⁦9⁩","⁦2⁩","⁦3⁩"],a:2,e:"בכל יום פועל א׳ עושה 1/6 מהעבודה ופועל ב׳ 1/3. יחד: 1/6+1/3 = 9/18. הזמן: 18/9 = 2 ימים.",w:["ממוצע זמנים אינו נכון: הזמן המשותף צריך להיות קצר מהזמן של הפועל המהיר.","סכום הזמנים אינו נכון: עבודה משותפת מקצרת את הזמן.","","הפרש הזמנים אינו קשור לקצב העבודה המשותף."]},{id:"q1-8",t:"חזקות ושורשים",q:"מהו הערך של ⁦√12 \xD7 √27⁩ ?",o:["⁦18⁩","⁦19⁩","⁦324⁩","⁦19.5⁩"],a:0,e:"⁦√12 \xD7 √27 = √324⁩, ו-⁦18\xB2 = 324⁩. לכן התוצאה 18.",w:["","חישוב השורש נעצר מוקדם או חרג ממנו: מעלים את הערך בריבוע ובודקים אם מתקבלת המכפלה.","שכחו להוציא שורש מהמכפלה.","שורש של מכפלה אינו ממוצע של המספרים."]},{id:"q1-9",t:"אלגברה",q:"נתון כי ⁦x + y = 7⁩ וגם ⁦x - y = 3⁩. מהו הערך של ⁦x\xB2 - y\xB2⁩?",o:["⁦40⁩","⁦28⁩","⁦10⁩","⁦21⁩"],a:3,e:"נוסחת הכפל המקוצר: ⁦x\xB2 - y\xB2 = (x+y)(x-y)⁩. לכן 7\xD73 = 21.",w:["זה לא הערך המבוקש.","נוסחת הכפל המקוצר נותנת את המכפלה s\xD7d בלבד, ללא תוספת של s.","הנוסחה היא מכפלה, לא סכום.",""]},{id:"q1-10",t:"הסתברות",q:"בקופסה 4 כדורים אדומים ו-2 כדורים כחולים. מוציאים שני כדורים אחד אחרי השני, בלי להחזיר. מה ההסתברות ששני הכדורים אדומים?",o:["⁦8/15⁩","⁦4/9⁩","⁦2/5⁩","⁦8/7⁩"],a:2,e:"ההסתברות לאדום ראשון: 4/6. אחרי זה נשארו 3 אדומים מתוך 5 כדורים: 3/5. המכפלה: ⁦2/5⁩.",w:["אחרי הוצאת כדור אדום נשארים a-1 כדורים אדומים, לא a.","אחרי הוצאת כדור אחד לא מחזירים אותו, ולכן ההסתברות השנייה משתנה.","","אין דרך לקבל את התוצאה באופן זה."]},{id:"q1-11",t:"גאומטריה",q:"אורך מלבן גדול ב-5 ס״מ מרוחבו, וההיקף שלו 30 ס״מ. מהו שטח המלבן (בסמ״ר)?",o:["⁦55⁩","⁦50⁩","⁦49⁩","⁦150⁩"],a:1,e:"נסמן רוחב x, אורך x+5: ⁦2x + 2(x+5) = 30⁩. ⁦4x = 20⁩, ⁦x = 5⁩. האורך 10. השטח 5\xD710 = 50.",w:["ערך זה אינו שטח המלבן: השטח הוא אורך כפול רוחב, ללא תוספת.","","זה שטח ריבוע עם אותו היקף, לא המלבן.","שילוב לא תקין של הנתונים."]},{id:"q1-12",t:"חזקות ושורשים",q:"מהו הערך של ⁦2^5 \xD7 4^1 \xF7 8^2⁩ ?",o:["⁦4⁩","⁦8⁩","⁦16⁩","⁦2⁩"],a:3,e:"מביאים לבסיס 2: ⁦4^1 = 2^2⁩, ⁦8^2 = 2^6⁩. מחברים בכפל ומחסרים בחילוק: ⁦5 + 2 - 6 = 1⁩. התוצאה ⁦2⁩.",w:["המעריך הנכון הוא 5+2-6 = 1. ערך זה סוטה ממנו במעריך אחד, כלומר שגיאת חיבור או חיסור בחישוב.","בכפל חזקות עם אותו בסיס מחברים מעריכים, לא מכפילים.","יש להביא לבסיס משותף: 4 הוא 2\xB2 ו-8 הוא 2\xB3; המעריך מוכפל.",""]},{id:"q1-13",t:"מערכת צירים",q:"מהו המרחק בין הנקודות ⁦(0,1)⁩ ו-⁦(5,13)⁩ במערכת צירים?",o:["⁦17⁩","⁦60⁩","⁦13⁩","⁦14⁩"],a:2,e:"הפרש ב-x: 5, הפרש ב-y: 12. לפי פיתגורס: ⁦√(5\xB2+12\xB2) = √169 = 13⁩.",w:["מרחק אלכסוני קצר מסכום ההפרשים לאורך הצירים.","מכפלה אינה מרחק.","","המרחק הוא השורש של סכום ריבועי ההפרשים; ערך זה גדול ממנו ב-1 ואינו מקיים את הנוסחה."]},{id:"q1-14",t:"אחוזים",q:"מחירו של מוצר הוא 500 ש״ח. המחיר הועלה ב-40%, ולאחר מכן המחיר החדש הורד ב-25%. מהו המחיר הסופי (בש״ח)?",o:["⁦575⁩","⁦500⁩","⁦700⁩","⁦525⁩"],a:3,e:"אחרי העלאה של 40%: 500\xD71.4 = 700. הורדה של 25% מהמחיר החדש: 700\xD70.75 = 525.",w:["חישוב לפי הפרש האחוזים (40%-25%) הוא טעות: האחוז השני מחושב מהמחיר החדש ולא מהמחיר המקורי.","המחיר הסופי לא חייב לחזור למחיר המקורי; האחוזים מחושבים מבסיסים שונים.","זה המחיר אחרי ההעלאה בלבד, לפני ההורדה של 25%.",""]},{id:"q1-15",t:"חזקות ושורשים",q:"מהו הערך של ⁦2^3 \xD7 4^2 \xF7 8^4⁩ ?",o:["⁦4⁩","⁦1/16⁩","⁦1/32⁩","⁦2⁩"],a:2,e:"מביאים לבסיס 2: ⁦4^2 = 2^4⁩, ⁦8^4 = 2^12⁩. מחברים בכפל ומחסרים בחילוק: ⁦3 + 4 - 12 = -5⁩. התוצאה ⁦1/32⁩.",w:["בכפל חזקות עם אותו בסיס מחברים מעריכים, לא מכפילים.","המעריך הנכון הוא 3+4-12 = -5. ערך זה סוטה ממנו במעריך אחד, כלומר שגיאת חיבור או חיסור בחישוב.","","יש להביא לבסיס משותף: 4 הוא 2\xB2 ו-8 הוא 2\xB3; המעריך מוכפל."]},{id:"q1-16",t:"יחס וחלוקה",q:"שלושה שותפים חילקו 100 ש״ח ביניהם ביחס 1:3:6. מה ההפרש בין הסכום הגדול ביותר לקטן ביותר?",o:["⁦100/3⁩","⁦10⁩","⁦60⁩","⁦50⁩"],a:3,e:"סכום חלקי היחס: 10. שווי חלק אחד: 100/10 = 10. הגדול: 6\xD710 = 60, הקטן: 1\xD710 = 10. ההפרש: 50.",w:["חילוק שווה לשלושה אינו מתאים ליחס הנתון.","זה הסכום הקטן ביותר, לא ההפרש.","זה הסכום הגדול ביותר, לא ההפרש.",""]},{id:"q1-17",t:"ממוצעים",q:"בכיתה א׳ 15 תלמידים והממוצע שלהם במבחן הוא 62. בכיתה ב׳ 10 תלמידים והממוצע שלהם 82. מהו הממוצע המשותף של שתי הכיתות?",o:["⁦70⁩","⁦73⁩","⁦175/3⁩","⁦72⁩"],a:0,e:"סכום ציוני כיתה א׳: 15\xD762 = 930. כיתה ב׳: 10\xD782 = 820. סך הכול 1750 ל-25 תלמידים: 70.",w:["","ערך זה אינו הסכום הכולל של הציונים (1750) חלקי מספר כל התלמידים (25).","חילוק ב-30 אינו נכון: יש לחלק את סכום הציונים הכולל ב-25, מספר כל התלמידים.","ממוצע פשוט של שני הממוצעים מתעלם ממספרי התלמידים השונים בכיתות."]},{id:"q1-18",t:"אחוזים",q:"מחיר של מוצר ירד ב-50%. בכמה אחוזים יש להעלות את המחיר החדש כדי שיחזור למחירו המקורי?",o:["⁦50⁩%","⁦75⁩%","⁦100⁩%","⁦110⁩%"],a:2,e:"נניח שהמחיר המקורי 100. אחרי הירידה: 50. כדי לחזור ל-100 צריך להוסיף 50. אחוז ההעלאה: 50/50 = 100%.",w:["ההעלאה מחושבת מהמחיר החדש, הקטן יותר, ולכן היא גדולה מ-50%.","אין כלל שאומר שההעלאה היא 50% ועוד חצי ממנו. בדקו עם מחיר מקורי 100: ההעלאה נקבעת לפי החלק 50 מתוך 50.","","ההעלאה הנדרשת קטנה מערך זה: אחרי העלאה כזו המחיר היה עובר את המחיר המקורי."]},{id:"q1-19",t:"הסקה מטבלה",q:"הטבלה מציגה את מספר המנויים של חברה בשלוש שנים. בכמה אחוזים השתנה מספר המנויים בין 2022 ל-2023? (שלילי פירושו ירידה)",tb:{head:["שנה","מספר מנויים"],rows:[["2021","200"],["2022","250"],["2023","275"]]},o:["⁦10⁩%","⁦37.5⁩%","⁦25⁩%","⁦100/11⁩%"],a:0,e:"2022: 250, 2023: 275. השינוי 25, והבסיס הוא 250: ⁦25/250⁩ = 10%.",w:["","זה השינוי מ-2021 ל-2023, לא מ-2022.","זה ההפרש במספרים, לא באחוזים.","האחוז מחושב מהערך ההתחלתי (2022), לא מהערך הסופי."]},{id:"q1-20",t:"בעיות דרך",q:"שתי מכוניות יוצאות באותו זמן משני מקומות, ונוסעות זו לקראת זו. מהירות האחת 60 קמ״ש והשנייה 20 קמ״ש. הן נפגשות אחרי 2 שעות. מה המרחק בין שני המקומות (בק״מ)?",o:["⁦80⁩","⁦220⁩","⁦120⁩","⁦160⁩"],a:3,e:"כל שעה המרחק בין המכוניות קטן ב-60+20 = 80 ק״מ. אחרי 2 שעות: 80\xD72 = 160 ק״מ.",w:["במהלך נסיעה זו לקראת זו המהירויות מתחברות ולא נחסרות.","הוספת 60 למרחק אינה נובעת מהנתונים: המרחק הוא סכום המהירויות כפול הזמן, ללא תוספת.","זה המרחק שעברה המכונית המהירה בלבד.",""]}],q2:[{id:"q2-1",t:"אי־שוויונות",q:"כמה מספרים שלמים x מקיימים את אי־השוויון ⁦-3 < 3x + 1 ≤ 12⁩ ?",o:["⁦4⁩","⁦5⁩","⁦15⁩","⁦6⁩"],a:1,e:"מחסרים 1: ⁦-4 < 3x ≤ 11⁩. מחלקים ב-3: ⁦-4/3 < x ≤ 11/3⁩. המספרים השלמים: ⁦-1⁩, ⁦0⁩, ⁦1⁩, ⁦2⁩, ⁦3⁩ - סך הכול 5.",w:["נראה שהקצה אחד לא נספר; בדקו אם הוא מקיים את אי־השוויון.","","זה ההפרש בין הקצוות ולא מספר הפתרונות.","יש לבדוק את הקצוות: הצד השמאלי חזק (<) והצד הימני חלש (≤)."]},{id:"q2-2",t:"משוואות",q:"פי 5 ממספר מסוים ועוד 9 שווה ל-24. מהו המספר?",o:["⁦3⁩","⁦15⁩","⁦33⁩","⁦4.8⁩"],a:0,e:"נסמן את המספר ב-x: ⁦5x + 9 = 24⁩. מחסרים 9: ⁦5x = 15⁩. מחלקים ב-5: ⁦x = 3⁩.",w:["","זה הערך לפני החלוקה ב-5.","יש להחסיר את 9 ולא להוסיף.","יש להחסיר את 9 לפני החילוק."]},{id:"q2-3",t:"אחוזים",q:"מחירו של מוצר הוא 200 ש״ח. המחיר הועלה ב-25%, ולאחר מכן המחיר החדש הורד ב-40%. מהו המחיר הסופי (בש״ח)?",o:["⁦200⁩","⁦170⁩","⁦250⁩","⁦150⁩"],a:3,e:"אחרי העלאה של 25%: 200\xD71.25 = 250. הורדה של 40% מהמחיר החדש: 250\xD70.6 = 150.",w:["המחיר הסופי לא חייב לחזור למחיר המקורי; האחוזים מחושבים מבסיסים שונים.","חישוב לפי הפרש האחוזים (25%-40%) הוא טעות: האחוז השני מחושב מהמחיר החדש ולא מהמחיר המקורי.","זה המחיר אחרי ההעלאה בלבד, לפני ההורדה של 40%.",""]},{id:"q2-4",t:"אחוזים",q:"מחיר של מוצר ירד ב-60%. בכמה אחוזים יש להעלות את המחיר החדש כדי שיחזור למחירו המקורי?",o:["⁦60⁩%","⁦90⁩%","⁦160⁩%","⁦150⁩%"],a:3,e:"נניח שהמחיר המקורי 100. אחרי הירידה: 40. כדי לחזור ל-100 צריך להוסיף 60. אחוז ההעלאה: 60/40 = 150%.",w:["ההעלאה מחושבת מהמחיר החדש, הקטן יותר, ולכן היא גדולה מ-60%.","אין כלל שאומר שההעלאה היא 60% ועוד חצי ממנו. בדקו עם מחיר מקורי 100: ההעלאה נקבעת לפי החלק 60 מתוך 40.","ההעלאה הנדרשת קטנה מערך זה: אחרי העלאה כזו המחיר היה עובר את המחיר המקורי.",""]},{id:"q2-5",t:"אחוזים",q:"מחירו של מוצר הוא 200 ש״ח. המחיר הועלה ב-50%, ולאחר מכן המחיר החדש הורד ב-30%. מהו המחיר הסופי (בש״ח)?",o:["⁦300⁩","⁦240⁩","⁦210⁩","⁦200⁩"],a:2,e:"אחרי העלאה של 50%: 200\xD71.5 = 300. הורדה של 30% מהמחיר החדש: 300\xD70.7 = 210.",w:["זה המחיר אחרי ההעלאה בלבד, לפני ההורדה של 30%.","חישוב לפי הפרש האחוזים (50%-30%) הוא טעות: האחוז השני מחושב מהמחיר החדש ולא מהמחיר המקורי.","","המחיר הסופי לא חייב לחזור למחיר המקורי; האחוזים מחושבים מבסיסים שונים."]},{id:"q2-6",t:"גאומטריה",q:"תיבה בעלת מידות 4\xD74\xD75 ס״מ. מגדילים כל אחד מהמידות פי 2. פי כמה גדל נפח התיבה?",o:["⁦8⁩","⁦6⁩","⁦4⁩","⁦2⁩"],a:0,e:"נפח מקורי: 80. נפח חדש: ⁦8\xD78\xD710 = 640⁩. היחס 8.",w:["","הכפלה בשלוש אינה מתאימה.","כך גדל שטח פנים, לא הנפח.","הנפח תלוי בשלוש המידות, ולכן גדל בחזקה שלישית."]},{id:"q2-7",t:"גאומטריה",q:"במשולש ישר־זווית אורכי הניצבים 5 ו-12 ס״מ. מהו אורך היתר (בס״מ)?",o:["⁦17⁩","⁦13⁩","⁦30⁩","⁦12⁩"],a:1,e:"לפי משפט פיתגורס: ⁦5\xB2 + 12\xB2 = 169⁩, והשורש של 169 הוא 13.",w:["סכום הניצבים אינו היתר; לפי פיתגורס היתר קצר מהסכום.","","זה השטח, לא אורך היתר.","היתר הוא השורש של סכום ריבועי הניצבים; ערך זה קטן ממנו ב-1 ואינו מקיים את משפט פיתגורס."]},{id:"q2-8",t:"אחוזים",q:"סכום של 5000 ש״ח הופקד בבנק בריבית דריבית של 10% בשנה. כמה כסף יהיה בחשבון אחרי שנתיים (בש״ח)?",o:["⁦5500⁩","⁦6000⁩","⁦6050⁩","⁦5020⁩"],a:2,e:"אחרי שנה: 5000\xD71.1 = 5500. אחרי שנתיים: 5500\xD71.1 = 6050.",w:["זה הסכום אחרי שנה אחת בלבד.","זו ריבית פשוטה: הריבית של השנה השנייה מחושבת גם על הריבית שנצברה.","","הוספת אחוזים כמספר."]},{id:"q2-9",t:"ממוצעים",q:"בכיתה א׳ 20 תלמידים והממוצע שלהם במבחן הוא 93. בכיתה ב׳ 25 תלמידים והממוצע שלהם 66. מהו הממוצע המשותף של שתי הכיתות?",o:["⁦78⁩","⁦70.2⁩","⁦81⁩","⁦79.5⁩"],a:0,e:"סכום ציוני כיתה א׳: 20\xD793 = 1860. כיתה ב׳: 25\xD766 = 1650. סך הכול 3510 ל-45 תלמידים: 78.",w:["","חילוק ב-50 אינו נכון: יש לחלק את סכום הציונים הכולל ב-45, מספר כל התלמידים.","ערך זה אינו הסכום הכולל של הציונים (3510) חלקי מספר כל התלמידים (45).","ממוצע פשוט של שני הממוצעים מתעלם ממספרי התלמידים השונים בכיתות."]},{id:"q2-10",t:"בעיות דרך",q:"נהג נסע ממקום א׳ למקום ב׳ במהירות 50 קמ״ש וחזר באותו מסלול במהירות 75 קמ״ש. מהי המהירות הממוצעת שלו בכל הנסיעה (בקמ״ש)?",o:["⁦67.5⁩","⁦75⁩","⁦62.5⁩","⁦60⁩"],a:3,e:"מהירות ממוצעת = מרחק כולל \xF7 זמן כולל. נבחר מרחק חד־כיווני של 3750 ק״מ: זמן ההלוך 3750/50 = 75 שעות, זמן החזרה 3750/75 = 50 שעות. מרחק כולל 7500 ק״מ ב-125 שעות: 60 קמ״ש.",w:["ערך זה אינו מתקבל מחלוקת המרחק הכולל בזמן הכולל. המהירות הממוצעת תמיד נמוכה מהממוצע החשבוני כאן.","המהירות הממוצעת אינה המהירות השנייה.","ממוצע חשבוני של המהירויות אינו נכון, כי הנהג מבלה זמן רב יותר במהירות האיטית.",""]},{id:"q2-11",t:"בעיות דרך",q:"שתי מכוניות יוצאות באותו זמן משני מקומות, ונוסעות זו לקראת זו. מהירות האחת 60 קמ״ש והשנייה 30 קמ״ש. הן נפגשות אחרי 2 שעות. מה המרחק בין שני המקומות (בק״מ)?",o:["⁦240⁩","⁦120⁩","⁦60⁩","⁦180⁩"],a:3,e:"כל שעה המרחק בין המכוניות קטן ב-60+30 = 90 ק״מ. אחרי 2 שעות: 90\xD72 = 180 ק״מ.",w:["הוספת 60 למרחק אינה נובעת מהנתונים: המרחק הוא סכום המהירויות כפול הזמן, ללא תוספת.","זה המרחק שעברה המכונית המהירה בלבד.","במהלך נסיעה זו לקראת זו המהירויות מתחברות ולא נחסרות.",""]},{id:"q2-12",t:"גאומטריה",q:"אורך מלבן גדול ב-2 ס״מ מרוחבו, וההיקף שלו 28 ס״מ. מהו שטח המלבן (בסמ״ר)?",o:["⁦49⁩","⁦56⁩","⁦48⁩","⁦54⁩"],a:2,e:"נסמן רוחב x, אורך x+2: ⁦2x + 2(x+2) = 28⁩. ⁦4x = 24⁩, ⁦x = 6⁩. האורך 8. השטח 6\xD78 = 48.",w:["זה שטח ריבוע עם אותו היקף, לא המלבן.","שילוב לא תקין של הנתונים.","","ערך זה אינו שטח המלבן: השטח הוא אורך כפול רוחב, ללא תוספת."]},{id:"q2-13",t:"תכונות מספרים",q:"מהו המספר הטבעי הקטן ביותר, גדול מ-1, שבחלוקתו ב-4 וב-6 נשאר שארית 1 בשני המקרים?",o:["⁦25⁩","⁦13⁩","⁦11⁩","⁦12⁩"],a:1,e:"המספר פחות 1 מתחלק ב-4 וב-6, ולכן הוא כפולה משותפת. הכפולה המשותפת הקטנה ביותר היא 12. המספר: 12+1 = 13.",w:["אפשר להשתמש במכפלה, אך הכפולה המשותפת הקטנה ביותר היא 12, ולכן יש מספר קטן יותר.","","לא נובע מכללי החלוקה.","הכפולה המשותפת עצמה נותנת שארית 0, ולא 1."]},{id:"q2-14",t:"משוואות",q:"סכום 3 מספרים שלמים עוקבים הוא 78. מהו המספר הגדול ביותר?",o:["⁦25⁩","⁦29⁩","⁦26⁩","⁦27⁩"],a:3,e:"הממוצע של מספרים עוקבים הוא המספר האמצעי: 78/3 = 26. הגדול ביותר: 26+1 = 27.",w:["זה המספר הקטן ביותר.","הערך אינו נובע מהחישוב.","זה המספר האמצעי ולא הגדול ביותר.",""]},{id:"q2-15",t:"הסקה מטבלה",q:"הטבלה מציגה את מספר היחידות שנמכרו בארבע ערים בשנתיים. איזה אחוז מסך המכירות בשנה ב׳ היה בעיר נתניה?",tb:{head:["עיר","שנה א׳","שנה ב׳"],rows:[["חיפה","150","120"],["באר שבע","200","200"],["אשדוד","240","180"],["נתניה","120","300"]]},o:["⁦37.5⁩%","⁦300⁩%","⁦1200/71⁩%","⁦42.5⁩%"],a:0,e:"סך המכירות בשנה ב׳: ⁦120+200+180+300⁩ = 800. החלק של נתניה: 300/800 = 37.5%.",w:["","זה מספר היחידות, לא אחוז.","זה האחוז משנה א׳, לא משנה ב׳.","חישוב לא נכון של החלק מהסך."]},{id:"q2-16",t:"אחוזים",q:"מחיר של מוצר ירד ב-40%. בכמה אחוזים יש להעלות את המחיר החדש כדי שיחזור למחירו המקורי?",o:["⁦200/3⁩%","⁦40⁩%","⁦60⁩%","⁦230/3⁩%"],a:0,e:"נניח שהמחיר המקורי 100. אחרי הירידה: 60. כדי לחזור ל-100 צריך להוסיף 40. אחוז ההעלאה: 40/60 = 200/3%.",w:["","ההעלאה מחושבת מהמחיר החדש, הקטן יותר, ולכן היא גדולה מ-40%.","אין כלל שאומר שההעלאה היא 40% ועוד חצי ממנו. בדקו עם מחיר מקורי 100: ההעלאה נקבעת לפי החלק 40 מתוך 60.","ההעלאה הנדרשת קטנה מערך זה: אחרי העלאה כזו המחיר היה עובר את המחיר המקורי."]},{id:"q2-17",t:"אי־שוויונות",q:"כמה מספרים שלמים x מקיימים את אי־השוויון ⁦-1 < 3x + 1 ≤ 19⁩ ?",o:["⁦20⁩","⁦6⁩","⁦8⁩","⁦7⁩"],a:3,e:"מחסרים 1: ⁦-2 < 3x ≤ 18⁩. מחלקים ב-3: ⁦-2/3 < x ≤ 6⁩. המספרים השלמים: ⁦0⁩, ⁦1⁩, ⁦2⁩, ⁦3⁩, ⁦4⁩, ⁦5⁩, ⁦6⁩ - סך הכול 7.",w:["זה ההפרש בין הקצוות ולא מספר הפתרונות.","נראה שהקצה אחד לא נספר; בדקו אם הוא מקיים את אי־השוויון.","יש לבדוק את הקצוות: הצד השמאלי חזק (<) והצד הימני חלש (≤).",""]},{id:"q2-18",t:"חזקות ושורשים",q:"מהו הערך של ⁦√27 \xD7 √3⁩ ?",o:["⁦81⁩","⁦10⁩","⁦15⁩","⁦9⁩"],a:3,e:"⁦√27 \xD7 √3 = √81⁩, ו-⁦9\xB2 = 81⁩. לכן התוצאה 9.",w:["שכחו להוציא שורש מהמכפלה.","חישוב השורש נעצר מוקדם או חרג ממנו: מעלים את הערך בריבוע ובודקים אם מתקבלת המכפלה.","שורש של מכפלה אינו ממוצע של המספרים.",""]},{id:"q2-19",t:"קומבינטוריקה",q:"בכמה סדרים שונים אפשר לסדר 6 אנשים בשורה?",o:["⁦360⁩","⁦120⁩","⁦720⁩","⁦36⁩"],a:2,e:"למקום הראשון 6 אפשרויות, לשני 5, וכן הלאה: ⁦6\xD75\xD74\xD73\xD72\xD71⁩ = 720.",w:["אין חלוקה בשניים כאן, כי כל שני סידורים שונים נחשבים שונים.","זה מספר הסידורים במעגל, לא בשורה.","","סידור בשורה הוא מספר התמורות, לא n בריבוע."]},{id:"q2-20",t:"בעיות דרך",q:"שתי מכוניות יוצאות באותו זמן משני מקומות, ונוסעות זו לקראת זו. מהירות האחת 60 קמ״ש והשנייה 30 קמ״ש. הן נפגשות אחרי 4 שעות. מה המרחק בין שני המקומות (בק״מ)?",o:["⁦240⁩","⁦360⁩","⁦420⁩","⁦120⁩"],a:1,e:"כל שעה המרחק בין המכוניות קטן ב-60+30 = 90 ק״מ. אחרי 4 שעות: 90\xD74 = 360 ק״מ.",w:["זה המרחק שעברה המכונית המהירה בלבד.","","הוספת 60 למרחק אינה נובעת מהנתונים: המרחק הוא סכום המהירויות כפול הזמן, ללא תוספת.","במהלך נסיעה זו לקראת זו המהירויות מתחברות ולא נחסרות."]}],x:[{id:"x-1",t:"גאומטריה",q:"במשולש ישר־זווית אורכי הניצבים 8 ו-15 ס״מ. מהו אורך היתר (בס״מ)?",o:["⁦23⁩","⁦60⁩","⁦16⁩","⁦17⁩"],a:3,e:"לפי משפט פיתגורס: ⁦8\xB2 + 15\xB2 = 289⁩, והשורש של 289 הוא 17.",w:["סכום הניצבים אינו היתר; לפי פיתגורס היתר קצר מהסכום.","זה השטח, לא אורך היתר.","היתר הוא השורש של סכום ריבועי הניצבים; ערך זה קטן ממנו ב-1 ואינו מקיים את משפט פיתגורס.",""]},{id:"x-2",t:"ממוצעים",q:"הממוצע של 4 מספרים הוא 20. מוסיפים להם את המספר 25. מהו הממוצע החדש של 5 המספרים?",o:["⁦22.5⁩","⁦20⁩","⁦21⁩","⁦26.25⁩"],a:2,e:"סכום 4 המספרים: 4\xD720 = 80. אחרי הוספת 25: 105. הממוצע החדש: 105/5 = 21.",w:["ממוצע בין הממוצע הישן למספר החדש אינו נכון: יש לתת משקל ל-4 המספרים.","הממוצע לא יישאר 20: המספר שנוסף (25) גדול מהממוצע, ולכן הוא מזיז את הממוצע מעלה.","","סכום המספרים חולק ב-4 ולא ב-5."]},{id:"x-3",t:"חזקות ושורשים",q:"מהו הערך של ⁦√3 \xD7 √12⁩ ?",o:["⁦36⁩","⁦6⁩","⁦7.5⁩","⁦7⁩"],a:1,e:"⁦√3 \xD7 √12 = √36⁩, ו-⁦6\xB2 = 36⁩. לכן התוצאה 6.",w:["שכחו להוציא שורש מהמכפלה.","","שורש של מכפלה אינו ממוצע של המספרים.","חישוב השורש נעצר מוקדם או חרג ממנו: מעלים את הערך בריבוע ובודקים אם מתקבלת המכפלה."]},{id:"x-4",t:"בעיות הספק",q:"פועל א׳ מסיים עבודה לבד ב-15 ימים, ופועל ב׳ מסיים אותה לבד ב-10 ימים. בכמה ימים יסיימו אותה אם יעבדו יחד באותו קצב?",o:["⁦5⁩","⁦25⁩","⁦12.5⁩","⁦6⁩"],a:3,e:"בכל יום פועל א׳ עושה 1/15 מהעבודה ופועל ב׳ 1/10. יחד: 1/15+1/10 = 25/150. הזמן: 150/25 = 6 ימים.",w:["הפרש הזמנים אינו קשור לקצב העבודה המשותף.","סכום הזמנים אינו נכון: עבודה משותפת מקצרת את הזמן.","ממוצע זמנים אינו נכון: הזמן המשותף צריך להיות קצר מהזמן של הפועל המהיר.",""]},{id:"x-5",t:"אלגברה",q:"נתון כי ⁦x + y = 10⁩ וגם ⁦x - y = 4⁩. מהו הערך של ⁦x\xB2 - y\xB2⁩?",o:["⁦50⁩","⁦84⁩","⁦14⁩","⁦40⁩"],a:3,e:"נוסחת הכפל המקוצר: ⁦x\xB2 - y\xB2 = (x+y)(x-y)⁩. לכן 10\xD74 = 40.",w:["נוסחת הכפל המקוצר נותנת את המכפלה s\xD7d בלבד, ללא תוספת של s.","זה לא הערך המבוקש.","הנוסחה היא מכפלה, לא סכום.",""]},{id:"x-6",t:"בעיות מילוליות",q:"אביו של דן מבוגר ממנו פי 3. סכום גילאיהם עכשיו הוא 56. מה יהיה סכום גילאיהם בעוד 8 שנים?",o:["⁦64⁩","⁦72⁩","⁦80⁩","⁦88⁩"],a:1,e:"כל אחד מהשניים מתבגר ב-8 שנים, ולכן הסכום גדל ב-2\xD78 = 16. הסכום החדש: 56+16 = 72. (היחס 3:1 מיותר כאן.)",w:["כל אחד מהם מתבגר ב-8 שנים, ולכן מוסיפים 2\xD78.","","הוספת שנים מיותרת.","היחס בין הגילאים אינו נשמר אחרי שנים."]},{id:"x-7",t:"אי־שוויונות",q:"כמה מספרים שלמים x מקיימים את אי־השוויון ⁦-5 < 3x + 1 ≤ 12⁩ ?",o:["⁦5⁩","⁦4⁩","⁦6⁩","⁦17⁩"],a:0,e:"מחסרים 1: ⁦-6 < 3x ≤ 11⁩. מחלקים ב-3: ⁦-2 < x ≤ 11/3⁩. המספרים השלמים: ⁦-1⁩, ⁦0⁩, ⁦1⁩, ⁦2⁩, ⁦3⁩ - סך הכול 5.",w:["","נראה שהקצה אחד לא נספר; בדקו אם הוא מקיים את אי־השוויון.","יש לבדוק את הקצוות: הצד השמאלי חזק (<) והצד הימני חלש (≤).","זה ההפרש בין הקצוות ולא מספר הפתרונות."]},{id:"x-8",t:"אחוזים",q:"מחיר של מוצר ירד ב-10%. בכמה אחוזים יש להעלות את המחיר החדש כדי שיחזור למחירו המקורי?",o:["⁦15⁩%","⁦190/9⁩%","⁦10⁩%","⁦100/9⁩%"],a:3,e:"נניח שהמחיר המקורי 100. אחרי הירידה: 90. כדי לחזור ל-100 צריך להוסיף 10. אחוז ההעלאה: 10/90 = 100/9%.",w:["אין כלל שאומר שההעלאה היא 10% ועוד חצי ממנו. בדקו עם מחיר מקורי 100: ההעלאה נקבעת לפי החלק 10 מתוך 90.","ההעלאה הנדרשת קטנה מערך זה: אחרי העלאה כזו המחיר היה עובר את המחיר המקורי.","ההעלאה מחושבת מהמחיר החדש, הקטן יותר, ולכן היא גדולה מ-10%.",""]},{id:"x-9",t:"משוואות",q:"סכום 5 מספרים שלמים עוקבים הוא 85. מהו המספר הגדול ביותר?",o:["⁦22⁩","⁦15⁩","⁦17⁩","⁦19⁩"],a:3,e:"הממוצע של מספרים עוקבים הוא המספר האמצעי: 85/5 = 17. הגדול ביותר: 17+2 = 19.",w:["הערך אינו נובע מהחישוב.","זה המספר הקטן ביותר.","זה המספר האמצעי ולא הגדול ביותר.",""]},{id:"x-10",t:"חזקות ושורשים",q:"מהו הערך של ⁦2^2 \xD7 4^3 \xF7 8^5⁩ ?",o:["⁦1⁩","⁦2⁩","⁦1/128⁩","⁦1/64⁩"],a:2,e:"מביאים לבסיס 2: ⁦4^3 = 2^6⁩, ⁦8^5 = 2^15⁩. מחברים בכפל ומחסרים בחילוק: ⁦2 + 6 - 15 = -7⁩. התוצאה ⁦1/128⁩.",w:["יש להביא לבסיס משותף: 4 הוא 2\xB2 ו-8 הוא 2\xB3; המעריך מוכפל.","בכפל חזקות עם אותו בסיס מחברים מעריכים, לא מכפילים.","","המעריך הנכון הוא 2+6-15 = -7. ערך זה סוטה ממנו במעריך אחד, כלומר שגיאת חיבור או חיסור בחישוב."]},{id:"x-11",t:"אי־שוויונות",q:"כמה מספרים שלמים x מקיימים את אי־השוויון ⁦-1 < 3x + 1 ≤ 16⁩ ?",o:["⁦7⁩","⁦17⁩","⁦6⁩","⁦5⁩"],a:2,e:"מחסרים 1: ⁦-2 < 3x ≤ 15⁩. מחלקים ב-3: ⁦-2/3 < x ≤ 5⁩. המספרים השלמים: ⁦0⁩, ⁦1⁩, ⁦2⁩, ⁦3⁩, ⁦4⁩, ⁦5⁩ - סך הכול 6.",w:["יש לבדוק את הקצוות: הצד השמאלי חזק (<) והצד הימני חלש (≤).","זה ההפרש בין הקצוות ולא מספר הפתרונות.","","נראה שהקצה אחד לא נספר; בדקו אם הוא מקיים את אי־השוויון."]},{id:"x-12",t:"תכונות מספרים",q:"מהו המספר הטבעי הקטן ביותר, גדול מ-3, שבחלוקתו ב-4 וב-10 נשאר שארית 3 בשני המקרים?",o:["⁦43⁩","⁦17⁩","⁦23⁩","⁦20⁩"],a:2,e:"המספר פחות 3 מתחלק ב-4 וב-10, ולכן הוא כפולה משותפת. הכפולה המשותפת הקטנה ביותר היא 20. המספר: 20+3 = 23.",w:["אפשר להשתמש במכפלה, אך הכפולה המשותפת הקטנה ביותר היא 20, ולכן יש מספר קטן יותר.","לא נובע מכללי החלוקה.","","הכפולה המשותפת עצמה נותנת שארית 0, ולא 3."]},{id:"x-13",t:"גאומטריה",q:"רדיוס מעגל הוגדל פי 3. פי כמה גדל שטחו?",o:["⁦3⁩","⁦4⁩","⁦9⁩","⁦6⁩"],a:2,e:"שטח מעגל: ⁦πr\xB2⁩. רדיוס חדש 3r: ⁦π(3r)\xB2 = 9πr\xB2⁩. לכן השטח גדל פי 9.",w:["השטח תלוי ברדיוס בריבוע, ולא ביחס ישר אליו.","אין קשר בין השינוי הזה לנוסחת השטח.","","זה יחס ההיקף כפול 2; ההיקף גדל פי 3 והשטח אחרת."]},{id:"x-14",t:"הסתברות",q:"בקופסה 2 כדורים אדומים ו-3 כדורים כחולים. מוציאים שני כדורים אחד אחרי השני, בלי להחזיר. מה ההסתברות ששני הכדורים אדומים?",o:["⁦1/10⁩","⁦1/5⁩","⁦2/3⁩","⁦4/25⁩"],a:0,e:"ההסתברות לאדום ראשון: 2/5. אחרי זה נשארו 1 אדומים מתוך 4 כדורים: 1/4. המכפלה: ⁦1/10⁩.",w:["","אחרי הוצאת כדור אדום נשארים a-1 כדורים אדומים, לא a.","אין דרך לקבל את התוצאה באופן זה.","אחרי הוצאת כדור אחד לא מחזירים אותו, ולכן ההסתברות השנייה משתנה."]},{id:"x-15",t:"גאומטריה",q:"תיבה בעלת מידות 2\xD73\xD74 ס״מ. מגדילים כל אחד מהמידות פי 2. פי כמה גדל נפח התיבה?",o:["⁦2⁩","⁦8⁩","⁦4⁩","⁦6⁩"],a:1,e:"נפח מקורי: 24. נפח חדש: ⁦4\xD76\xD78 = 192⁩. היחס 8.",w:["הנפח תלוי בשלוש המידות, ולכן גדל בחזקה שלישית.","","כך גדל שטח פנים, לא הנפח.","הכפלה בשלוש אינה מתאימה."]},{id:"x-16",t:"הסקה מטבלה",q:"הטבלה מציגה את מספר היחידות שנמכרו בארבע ערים בשנתיים. איזה אחוז מסך המכירות בשנה ב׳ היה בעיר באר שבע?",tb:{head:["עיר","שנה א׳","שנה ב׳"],rows:[["חיפה","180","240"],["באר שבע","200","120"],["אשדוד","180","120"],["נתניה","120","120"]]},o:["⁦120⁩%","⁦20⁩%","⁦500/17⁩%","⁦25⁩%"],a:1,e:"סך המכירות בשנה ב׳: ⁦240+120+120+120⁩ = 600. החלק של באר שבע: 120/600 = 20%.",w:["זה מספר היחידות, לא אחוז.","","זה האחוז משנה א׳, לא משנה ב׳.","חישוב לא נכון של החלק מהסך."]},{id:"x-17",t:"משוואות",q:"סכום 5 מספרים שלמים עוקבים הוא 75. מהו המספר הגדול ביותר?",o:["⁦20⁩","⁦15⁩","⁦17⁩","⁦13⁩"],a:2,e:"הממוצע של מספרים עוקבים הוא המספר האמצעי: 75/5 = 15. הגדול ביותר: 15+2 = 17.",w:["הערך אינו נובע מהחישוב.","זה המספר האמצעי ולא הגדול ביותר.","","זה המספר הקטן ביותר."]},{id:"x-18",t:"גאומטריה",q:"אורך מלבן גדול ב-2 ס״מ מרוחבו, וההיקף שלו 16 ס״מ. מהו שטח המלבן (בסמ״ר)?",o:["⁦32⁩","⁦16⁩","⁦18⁩","⁦15⁩"],a:3,e:"נסמן רוחב x, אורך x+2: ⁦2x + 2(x+2) = 16⁩. ⁦4x = 12⁩, ⁦x = 3⁩. האורך 5. השטח 3\xD75 = 15.",w:["שילוב לא תקין של הנתונים.","זה שטח ריבוע עם אותו היקף, לא המלבן.","ערך זה אינו שטח המלבן: השטח הוא אורך כפול רוחב, ללא תוספת.",""]},{id:"x-19",t:"אלגברה",q:"נתון כי ⁦x + y = 8⁩ וגם ⁦x - y = 6⁩. מהו הערך של ⁦x\xB2 - y\xB2⁩?",o:["⁦14⁩","⁦56⁩","⁦28⁩","⁦48⁩"],a:3,e:"נוסחת הכפל המקוצר: ⁦x\xB2 - y\xB2 = (x+y)(x-y)⁩. לכן 8\xD76 = 48.",w:["הנוסחה היא מכפלה, לא סכום.","נוסחת הכפל המקוצר נותנת את המכפלה s\xD7d בלבד, ללא תוספת של s.","זה לא הערך המבוקש.",""]},{id:"x-20",t:"בעיות הספק",q:"פועל א׳ מסיים עבודה לבד ב-12 ימים, ופועל ב׳ מסיים אותה לבד ב-6 ימים. בכמה ימים יסיימו אותה אם יעבדו יחד באותו קצב?",o:["⁦6⁩","⁦9⁩","⁦18⁩","⁦4⁩"],a:3,e:"בכל יום פועל א׳ עושה 1/12 מהעבודה ופועל ב׳ 1/6. יחד: 1/12+1/6 = 18/72. הזמן: 72/18 = 4 ימים.",w:["הפרש הזמנים אינו קשור לקצב העבודה המשותף.","ממוצע זמנים אינו נכון: הזמן המשותף צריך להיות קצר מהזמן של הפועל המהיר.","סכום הזמנים אינו נכון: עבודה משותפת מקצרת את הזמן.",""]}]},prac:{an:[{id:"pan-1",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["כועס : צועק","תשוש : עייף","כועס : רגוע","כועס : זועם"],a:3,e:"תשוש הוא דרגה חזקה יותר של עייף, וזועם הוא דרגה חזקה יותר של כועס.",w:["זה יחס בין מצב להתנהגות אפשרית שלו.","הסדר הפוך: כאן הדרגה החלשה באה אחרונה.","זה יחס של ניגוד.",""],stem:"עייף : תשוש"},{id:"pan-2",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["לימון : מיץ","מתוק : חמוץ","לימון : חמוץ","סוכר : קפה"],a:2,e:"מתיקות היא תכונה אופיינית של סוכר, וחמיצות היא תכונה אופיינית של לימון.",w:["זה יחס בין פרי למוצר ממנו.","זה יחס של ניגוד בין תכונות.","","זה יחס בין תוספת למשקה."],stem:"סוכר : מתוק"},{id:"pan-3",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["קמח : טחינה","בגד : אופנה","בגד : בד","בגד : ארון"],a:2,e:"לחם עשוי מקמח, ובגד עשוי מבד. היחס הוא מוצר וחומר הגלם שלו.",w:["אין כאן יחס בין מוצר לחומר גלם.","זה יחס בין חפץ לתחום שבו הוא מופיע.","","זה יחס בין חפץ למקום אחסונו."],stem:"לחם : קמח"},{id:"pan-4",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["ספר : ספרייה","מלחין : סימפוניה","קורא : קריאה","סימפוניה : תזמורת"],a:1,e:"מחבר יוצר ספר, ומלחין יוצר סימפוניה. היחס הוא יוצר ויצירתו.",w:["זה יחס בין חפץ למקום.","","זה יחס בין אדם לפעולה.","זה יחס בין יצירה למבצעים שלה."],stem:"מחבר : ספר"},{id:"pan-5",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["מגדלור : ים","נהג : רכב","מגדלור : ספינות","רמזור : צומת"],a:2,e:"רמזור מכוון את תנועת הנהגים, ומגדלור מכוון את תנועת הספינות. היחס הוא אמצעי הכוונה ומי שהוא מכוון.",w:["זה יחס בין מבנה למקום.","זה יחס בין אדם לכלי.","","זה יחס בין חפץ למקום שבו הוא נמצא."],stem:"רמזור : נהגים"},{id:"pan-6",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["פסטה : מסננת","מסננת : מטבח","סינון : מים","מקרר : קירור"],a:3,e:"מסננת היא כלי שנועד לסנן, ומקרר הוא מכשיר שנועד לקרר. היחס הוא כלי ותפקידו.",w:["זה יחס בין חומר לכלי שמטפל בו.","זה יחס בין כלי למקום.","זה יחס בין פעולה לחומר שהיא פועלת עליו.",""],stem:"מסננת : סינון"},{id:"pan-7",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["ירידה : מדרון","עלייה : התקדמות","עלייה : ירידה","עלייה : הר"],a:2,e:"הרחבה וצמצום הן פעולות מנוגדות, וכך גם עלייה וירידה.",w:["זה יחס בין תהליך למקום.","שתי המילים קרובות במשמעות ואינן הפוכות.","","זה יחס בין פעולה למקום."],stem:"הרחבה : צמצום"},{id:"pan-8",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["הליכה : רגל","מסלול : מטייל","צעד : מהר","שלב : תהליך"],a:3,e:"צעד הוא חלק ממסלול, ושלב הוא חלק מתהליך. היחס הוא חלק ומכלול.",w:["זה יחס בין פעולה לאיבר שמבצע אותה.","זה יחס בין דרך למי שהולך בה.","אין כאן יחס של חלק ומכלול.",""],stem:"צעד : מסלול"},{id:"pan-9",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["קריאה : ספר","ראייה : עין","משקפיים : אף","מכשיר שמיעה : שמיעה"],a:3,e:"משקפיים עוזרים לראייה, ומכשיר שמיעה עוזר לשמיעה. היחס הוא אמצעי עזר ויכולת.",w:["זה יחס בין פעולה לחפץ.","זה יחס בין יכולת לאיבר.","זה יחס בין חפץ לאיבר שהוא נשען עליו.",""],stem:"משקפיים : ראייה"},{id:"pan-10",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["זהיר : פזיז","זהיר : זהירות","בזבזן : עשיר","חסכן : קמצן"],a:0,e:"חסכן ובזבזן הן תכונות מנוגדות, וכך גם זהיר ופזיז.",w:["","זה יחס בין תכונה לשם העצם שלה.","זה קשר אפשרי ולא ניגוד.","שתי המילים קרובות במשמעות."],stem:"חסכן : בזבזן"},{id:"pan-11",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["פשע : עונש","רופא : בית חולים","שוטר : פשיעה","שריפה : עשן"],a:2,e:"כבאי נלחם בשריפה, ושוטר נלחם בפשיעה. היחס הוא בעל מקצוע והתופעה שהוא נלחם בה.",w:["זה יחס בין מעשה להשלכה שלו.","זה יחס בין בעל מקצוע למקום.","","זה יחס בין תופעה לתוצאה שלה."],stem:"כבאי : שריפה"},{id:"pan-12",t:"אנלוגיה",q:"מצאו את זוג המילים שהיחס ביניהן דומה ליחס בין המילים המודגשות.",o:["ביצה : אפרוח","אפרוח : חצר","תרנגולת : ביצה","ביצה : מקרר"],a:0,e:"מזרע מתפתח צמח, ומביצה מתפתח אפרוח. היחס הוא שלב התחלתי והיצור שמתפתח ממנו.",w:["","זה יחס בין בעל חיים למקום.","זה יחס בין מי שמייצר למוצר שלו.","זה יחס בין חפץ למקום אחסונו."],stem:"זרע : צמח"}],rs:[{id:"prs-1",t:"הסקה מטקסט",q:"סוכנות נסיעות פרסמה: 80% מהלקוחות שלנו מרוצים מאוד. בסקר השתתפו רק לקוחות שהזמינו חבילת נופש יוקרתית. מדוע המסקנה על שביעות הרצון של כלל הלקוחות עלולה להיות שגויה?",o:["80% הוא אחוז נמוך מדי.","הלקוחות שנבחרו אינם מייצגים את כלל הלקוחות.","הלקוחות לא נשאלו בטלפון.","הסוכנות מפרסמת הרבה."],a:1,e:"המדגם כלל קבוצה מיוחדת ולכן אי אפשר להכליל ממנו לכלל הלקוחות.",w:["אחוז גבוה אינו הבעיה.","","שיטת הסקר אינה הסיבה.","אין קשר לתקפות המסקנה."]},{id:"prs-2",t:"הסקה מטקסט",q:"כל הספרים בספרייה מסווגים לפי נושא. חלק מהספרים בספרייה הם ספרי בישול. מה נובע בהכרח?",o:["ספרי הבישול מסווגים לפי נושא.","יש נושאים שאין להם ספרים.","כל הספרים בספרייה הם ספרי בישול.","ספרי הבישול נמצאים במדף נפרד."],a:0,e:"כל הספרים מסווגים לפי נושא, וספרי הבישול הם חלק מהספרים, ולכן גם הם מסווגים לפי נושא.",w:["","אין מידע זה.","רק חלק מהם.","אין מידע על מיקום."]},{id:"prs-3",t:"הסקה מטקסט",q:"נתון: אם נלמד יותר, נצליח במבחן. דני לא הצליח במבחן. איזו מסקנה נובעת?",o:["דני לא למד יותר.","דני לא למד כלל.","כל מי שלא למד יותר נכשל.","דני למד יותר אבל לא הצליח."],a:0,e:"שלילת התוצאה (לא הצליח) מובילה לשלילת התנאי (לא למד יותר).",w:["","ייתכן שלמד קצת.","זה היפוך של הכלל.","זה סותר את הכלל."]},{id:"prs-4",t:"הסקה מטקסט",q:"בעיר שתי מאפיות. מאפיית א׳ מוכרת 120 כיכרות ביום במחיר 12 ש״ח. מאפיית ב׳ מוכרת 150 כיכרות ביום במחיר 9 ש״ח. איזו מסקנה נובעת בהכרח לגבי ההכנסה היומית מכיכרות?",o:["ההכנסות שוות.","ההכנסה של מאפיית א׳ גבוהה מזו של מאפיית ב׳.","אי אפשר לדעת.","ההכנסה של מאפיית ב׳ גבוהה יותר כי היא מוכרת יותר כיכרות."],a:1,e:"א׳: 120\xD712=1,440. ב׳: 150\xD79=1,350. הכנסת א׳ גבוהה יותר.",w:["1,440 לעומת 1,350.","","אפשר לחשב לפי הנתונים.","ב׳ מוכרת 1,350 ש״ח; א׳ מוכרת 1,440 ש״ח."]},{id:"prs-5",t:"הסקה מטקסט",q:"המנהל אמר: אם הפרויקט יסתיים עד יום חמישי, כל הצוות יקבל יום חופש. הפרויקט הסתיים ביום שישי. מה אפשר לומר בוודאות?",o:["לא ניתן לדעת אם הצוות יקבל יום חופש.","הצוות לא יקבל יום חופש.","הפרויקט הסתיים מוקדם.","הצוות יקבל יום חופש."],a:0,e:"הכלל אינו שולל חופש בדרכים אחרות. לכן כשהתנאי לא מתקיים, אי אפשר לדעת.",w:["","התנאי לא התקיים, אבל זה לא אומר שהצוות לא יקבל חופש מסיבה אחרת.","הפרויקט הסתיים יום אחרי המועד.","אין בנתונים בסיס לכך."]},{id:"prs-6",t:"השלמת משפטים",q:"ההצלחה של הספר נבעה לא רק מכתיבתו המרתקת, אלא ____ מהעובדה שהופיע בתקופה שבה הציבור ____ לספרות מסוג זה.",o:["אף / צמא","גם / צמא","גם / התעלם","רק / התעלם"],a:1,e:"הצירוף 'לא רק ... אלא גם' מוסיף סיבה נוספת להצלחה: הציבור היה צמא לספרות כזו.",w:["'אלא אף' נשמע שגוי, והמשמעות נשברת.","","התעלמות הציבור אינה מסבירה את ההצלחה.","'לא רק ... אלא גם' דורש תוספת, ואין היגיון בהתעלמות הציבור."]},{id:"prs-7",t:"השלמת משפטים",q:"הנשיא נשא נאום ____: הוא אמר דברים ברורים ופשוטים, ולא השאיר מקום לפרשנויות שונות.",o:["חד־משמעי","עמום","מסתורי","ארוך"],a:0,e:"דברים ברורים שאין להם פרשנויות שונות הם חד־משמעיים.",w:["","עמום הוא ההפך מברור.","מסתורי סותר את הפשטות.","אורך אינו מתיישב עם 'ברורים ופשוטים'."]},{id:"prs-8",t:"הסקה מטקסט",q:"בעיר מסוימת ירד מספר תאונות הדרכים ב-20% אחרי התקנת מצלמות אכיפה. עיתונאי מסיק שהמצלמות הן הסיבה לירידה. איזו שאלה חשוב לשאול כדי לבדוק את המסקנה?",o:["האם במקביל חל שינוי אחר, כמו הגבלת מהירות או סגירת כבישים?","איפה יוצרו המצלמות?","מי הציע להתקין את המצלמות?","כמה עלו המצלמות?"],a:0,e:"כדי לבדוק סיבתיות צריך לשלול הסברים חלופיים שאירעו באותו זמן.",w:["","מקום הייצור אינו רלוונטי.","זהות היוזם אינה משנה את הקשר.","עלות אינה קשורה לסיבתיות."]},{id:"prs-9",t:"הסקה מטקסט",q:"קבוצת תלמידים קיבלה הסבר מפורט לפני מבחן, וקבוצה אחרת לא. ממוצע קבוצת ההסבר היה גבוה ב-10 נקודות. החוקרת בחרה לקבוצת ההסבר את התלמידים המצטיינים. מה הבעיה במסקנה שההסבר הועיל?",o:["הממוצע לא נבדק בשתי הקבוצות.","ההסבר היה מפורט מדי.","הקבוצות לא היו דומות מלכתחילה.","עשר נקודות הן הפרש קטן."],a:2,e:"בחירת המצטיינים לקבוצת ההסבר גורמת לכך שההפרש ייתכן בגללם, ולא בגלל ההסבר.",w:["הממוצע נבדק.","פירוט אינו בעיה מתודולוגית.","","גודל ההפרש אינו הבעיה."]},{id:"prs-10",t:"הסקה מטקסט",q:"חנות הורידה את מחירי כל הנעליים ב-20% וגם אחרי כן העלתה אותם ב-20% מהמחיר החדש. מה נכון לגבי המחיר הסופי לעומת המקורי?",o:["גבוה מהמחיר המקורי.","אי אפשר לקבוע בלי מחיר.","נמוך מהמחיר המקורי.","זהה למחיר המקורי."],a:2,e:"0.8\xD71.2 = 0.96, כלומר המחיר הסופי נמוך ב-4% מהמקורי.",w:["המחיר הסופי הוא 96% מהמקורי.","אפשר: 0.8\xD71.2=0.96 לכל מחיר.","","אחוזים בבסיסים שונים אינם מבטלים זה את זה."]}],rd:[{id:"prd-1",t:"הבנת הנקרא",q:"מהו הרעיון המרכזי של הקטע?",o:["חפצים ישנים שווים יותר מחדשים.","מומחי ארגון הם אנשים מרוכזים.","יש כמה הסברים פסיכולוגיים לקושי לוותר על חפצים, ויש דרך מעשית להתמודד איתו.","אנשים אוספים חפצים כדי להרוויח כסף."],a:2,e:"הקטע מונה שלושה הסברים וסוגר בעצה מעשית.",w:["הקטע אינו קובע זאת.","אין בקטע התייחסות כזו.","","הקטע אינו עוסק ברווח כלכלי."],p:"ob"},{id:"prd-2",t:"הבנת הנקרא",q:"מהו אפקט הבעלות, לפי הקטע?",o:["הקושי לקנות חפצים חדשים.","העדפה לחפצים יקרים.","הערכה גבוהה יותר של חפץ שבבעלותנו מזו שהיינו משלמים עליו.","נטייה לתת חפצים במתנה."],a:2,e:"ההגדרה בקטע: מעריכים חפץ שלנו יותר ממה שהיינו משלמים עליו.",w:["הקטע מגדיר את האפקט כהערכת יתר של חפץ שיש לנו.","אין לכך אזכור.","","זו אינה ההגדרה בקטע."],p:"ob"},{id:"prd-3",t:"הבנת הנקרא",q:"מי מהבאים עשוי להתקשות במיוחד לוותר על חולצה ישנה, לפי הקטע?",o:["מי שקנה אותה לפני יומיים.","מי שהחולצה מזכירה לו טיול משמעותי.","מי שמעולם לא לבש אותה ולא מכיר אותה.","מי שלא אוהב את הצבע שלה."],a:1,e:"ההסבר השלישי עוסק בזיכרונות הקשורים לחפצים.",w:["הקטע מתייחס לחפצים שלא נעשה בהם שימוש שנים.","","אין זיכרון שמקשר אותו אליה.","אין בכך הסבר לקושי בוויתור."],p:"ob"},{id:"prd-4",t:"הבנת הנקרא",q:"מה תפקיד המשפט האחרון בקטע?",o:["לסכם את ההסברים הפסיכולוגיים.","להציג את ההסבר הרביעי.","להציע דרך מעשית שמאפשרת לשמור על הזיכרון בלי לשמור את החפץ.","לבקר את המומחים."],a:2,e:"המשפט מציע תצלום כתחליף לשמירת החפץ.",w:["הוא מוסיף הצעה ולא מסכם.","הוא אינו הסבר אלא עצה.","","הוא אינו מבקר אותם."],p:"ob"},{id:"prd-5",t:"הבנת הנקרא",q:"מה פירוש המילה 'סנטימנטלי' בקטע?",o:["לא שימושי.","יקר ערך כספית.","שבור.","קשור ברגשות ובזיכרונות."],a:3,e:"בהקשר, חפץ סנטימנטלי הוא חפץ שיקר לנו בגלל רגשות וזיכרונות.",w:["המילה אינה מתארת שימושיות.","סנטימנטלי אינו עוסק במחיר.","אין קשר לשבר.",""],p:"ob"}],q:[{id:"pq-1",t:"חזקות ושורשים",q:"מהו הערך של ⁦√18 \xD7 √50⁩ ?",o:["⁦31⁩","⁦900⁩","⁦34⁩","⁦30⁩"],a:3,e:"⁦√18 \xD7 √50 = √900⁩, ו-⁦30\xB2 = 900⁩. לכן התוצאה 30.",w:["חישוב השורש נעצר מוקדם או חרג ממנו: מעלים את הערך בריבוע ובודקים אם מתקבלת המכפלה.","שכחו להוציא שורש מהמכפלה.","שורש של מכפלה אינו ממוצע של המספרים.",""]},{id:"pq-2",t:"בעיות דרך",q:"נהג נסע ממקום א׳ למקום ב׳ במהירות 60 קמ״ש וחזר באותו מסלול במהירות 90 קמ״ש. מהי המהירות הממוצעת שלו בכל הנסיעה (בקמ״ש)?",o:["⁦72⁩","⁦81⁩","⁦90⁩","⁦75⁩"],a:0,e:"מהירות ממוצעת = מרחק כולל \xF7 זמן כולל. נבחר מרחק חד־כיווני של 5400 ק״מ: זמן ההלוך 5400/60 = 90 שעות, זמן החזרה 5400/90 = 60 שעות. מרחק כולל 10800 ק״מ ב-150 שעות: 72 קמ״ש.",w:["","ערך זה אינו מתקבל מחלוקת המרחק הכולל בזמן הכולל. המהירות הממוצעת תמיד נמוכה מהממוצע החשבוני כאן.","המהירות הממוצעת אינה המהירות השנייה.","ממוצע חשבוני של המהירויות אינו נכון, כי הנהג מבלה זמן רב יותר במהירות האיטית."]},{id:"pq-3",t:"משוואות",q:"סכום 5 מספרים שלמים עוקבים הוא 55. מהו המספר הגדול ביותר?",o:["⁦11⁩","⁦9⁩","⁦16⁩","⁦13⁩"],a:3,e:"הממוצע של מספרים עוקבים הוא המספר האמצעי: 55/5 = 11. הגדול ביותר: 11+2 = 13.",w:["זה המספר האמצעי ולא הגדול ביותר.","זה המספר הקטן ביותר.","הערך אינו נובע מהחישוב.",""]},{id:"pq-4",t:"בעיות הספק",q:"פועל א׳ מסיים עבודה לבד ב-10 ימים, ופועל ב׳ מסיים אותה לבד ב-15 ימים. בכמה ימים יסיימו אותה אם יעבדו יחד באותו קצב?",o:["⁦5⁩","⁦6⁩","⁦12.5⁩","⁦25⁩"],a:1,e:"בכל יום פועל א׳ עושה 1/10 מהעבודה ופועל ב׳ 1/15. יחד: 1/10+1/15 = 25/150. הזמן: 150/25 = 6 ימים.",w:["הפרש הזמנים אינו קשור לקצב העבודה המשותף.","","ממוצע זמנים אינו נכון: הזמן המשותף צריך להיות קצר מהזמן של הפועל המהיר.","סכום הזמנים אינו נכון: עבודה משותפת מקצרת את הזמן."]},{id:"pq-5",t:"גאומטריה",q:"במשולש ישר־זווית אורכי הניצבים 6 ו-8 ס״מ. מהו אורך היתר (בס״מ)?",o:["⁦10⁩","⁦14⁩","⁦24⁩","⁦9⁩"],a:0,e:"לפי משפט פיתגורס: ⁦6\xB2 + 8\xB2 = 100⁩, והשורש של 100 הוא 10.",w:["","סכום הניצבים אינו היתר; לפי פיתגורס היתר קצר מהסכום.","זה השטח, לא אורך היתר.","היתר הוא השורש של סכום ריבועי הניצבים; ערך זה קטן ממנו ב-1 ואינו מקיים את משפט פיתגורס."]},{id:"pq-6",t:"משוואות",q:"פי 3 ממספר מסוים ועוד 3 שווה ל-39. מהו המספר?",o:["⁦12⁩","⁦13⁩","⁦36⁩","⁦14⁩"],a:0,e:"נסמן את המספר ב-x: ⁦3x + 3 = 39⁩. מחסרים 3: ⁦3x = 36⁩. מחלקים ב-3: ⁦x = 12⁩.",w:["","יש להחסיר את 3 לפני החילוק.","זה הערך לפני החלוקה ב-3.","יש להחסיר את 3 ולא להוסיף."]},{id:"pq-7",t:"תכונות מספרים",q:"מהו המספר הטבעי הקטן ביותר, גדול מ-3, שבחלוקתו ב-6 וב-10 נשאר שארית 3 בשני המקרים?",o:["⁦33⁩","⁦19⁩","⁦63⁩","⁦30⁩"],a:0,e:"המספר פחות 3 מתחלק ב-6 וב-10, ולכן הוא כפולה משותפת. הכפולה המשותפת הקטנה ביותר היא 30. המספר: 30+3 = 33.",w:["","לא נובע מכללי החלוקה.","אפשר להשתמש במכפלה, אך הכפולה המשותפת הקטנה ביותר היא 30, ולכן יש מספר קטן יותר.","הכפולה המשותפת עצמה נותנת שארית 0, ולא 3."]},{id:"pq-8",t:"ממוצעים",q:"הממוצע של 4 מספרים הוא 10. מוסיפים להם את המספר 40. מהו הממוצע החדש של 5 המספרים?",o:["⁦25⁩","⁦20⁩","⁦16⁩","⁦10⁩"],a:2,e:"סכום 4 המספרים: 4\xD710 = 40. אחרי הוספת 40: 80. הממוצע החדש: 80/5 = 16.",w:["ממוצע בין הממוצע הישן למספר החדש אינו נכון: יש לתת משקל ל-4 המספרים.","סכום המספרים חולק ב-4 ולא ב-5.","","הממוצע לא יישאר 10: המספר שנוסף (40) גדול מהממוצע, ולכן הוא מזיז את הממוצע מעלה."]},{id:"pq-9",t:"ממוצעים",q:"הממוצע של 6 מספרים הוא 15. מוסיפים להם את המספר 43. מהו הממוצע החדש של 7 המספרים?",o:["⁦133/6⁩","⁦19⁩","⁦15⁩","⁦29⁩"],a:1,e:"סכום 6 המספרים: 6\xD715 = 90. אחרי הוספת 43: 133. הממוצע החדש: 133/7 = 19.",w:["סכום המספרים חולק ב-6 ולא ב-7.","","הממוצע לא יישאר 15: המספר שנוסף (43) גדול מהממוצע, ולכן הוא מזיז את הממוצע מעלה.","ממוצע בין הממוצע הישן למספר החדש אינו נכון: יש לתת משקל ל-6 המספרים."]},{id:"pq-10",t:"מערכת צירים",q:"מהו המרחק בין הנקודות ⁦(-1,2)⁩ ו-⁦(3,5)⁩ במערכת צירים?",o:["⁦6⁩","⁦5⁩","⁦12⁩","⁦7⁩"],a:1,e:"הפרש ב-x: 4, הפרש ב-y: 3. לפי פיתגורס: ⁦√(4\xB2+3\xB2) = √25 = 5⁩.",w:["המרחק הוא השורש של סכום ריבועי ההפרשים; ערך זה גדול ממנו ב-1 ואינו מקיים את הנוסחה.","","מכפלה אינה מרחק.","מרחק אלכסוני קצר מסכום ההפרשים לאורך הצירים."]},{id:"pq-11",t:"קומבינטוריקה",q:"בכמה סדרים שונים אפשר לסדר 4 אנשים בשורה?",o:["⁦6⁩","⁦16⁩","⁦24⁩","⁦12⁩"],a:2,e:"למקום הראשון 4 אפשרויות, לשני 3, וכן הלאה: ⁦4\xD73\xD72\xD71⁩ = 24.",w:["זה מספר הסידורים במעגל, לא בשורה.","סידור בשורה הוא מספר התמורות, לא n בריבוע.","","אין חלוקה בשניים כאן, כי כל שני סידורים שונים נחשבים שונים."]},{id:"pq-12",t:"בעיות דרך",q:"שתי מכוניות יוצאות באותו זמן משני מקומות, ונוסעות זו לקראת זו. מהירות האחת 60 קמ״ש והשנייה 40 קמ״ש. הן נפגשות אחרי 5 שעות. מה המרחק בין שני המקומות (בק״מ)?",o:["⁦500⁩","⁦300⁩","⁦560⁩","⁦100⁩"],a:0,e:"כל שעה המרחק בין המכוניות קטן ב-60+40 = 100 ק״מ. אחרי 5 שעות: 100\xD75 = 500 ק״מ.",w:["","זה המרחק שעברה המכונית המהירה בלבד.","הוספת 60 למרחק אינה נובעת מהנתונים: המרחק הוא סכום המהירויות כפול הזמן, ללא תוספת.","במהלך נסיעה זו לקראת זו המהירויות מתחברות ולא נחסרות."]},{id:"pq-13",t:"משוואות",q:"פי 3 ממספר מסוים ועוד 3 שווה ל-12. מהו המספר?",o:["⁦4⁩","⁦5⁩","⁦9⁩","⁦3⁩"],a:3,e:"נסמן את המספר ב-x: ⁦3x + 3 = 12⁩. מחסרים 3: ⁦3x = 9⁩. מחלקים ב-3: ⁦x = 3⁩.",w:["יש להחסיר את 3 לפני החילוק.","יש להחסיר את 3 ולא להוסיף.","זה הערך לפני החלוקה ב-3.",""]},{id:"pq-14",t:"ממוצעים",q:"בכיתה א׳ 10 תלמידים והממוצע שלהם במבחן הוא 84. בכיתה ב׳ 30 תלמידים והממוצע שלהם 64. מהו הממוצע המשותף של שתי הכיתות?",o:["⁦69⁩","⁦72⁩","⁦74⁩","⁦46⁩"],a:0,e:"סכום ציוני כיתה א׳: 10\xD784 = 840. כיתה ב׳: 30\xD764 = 1920. סך הכול 2760 ל-40 תלמידים: 69.",w:["","ערך זה אינו הסכום הכולל של הציונים (2760) חלקי מספר כל התלמידים (40).","ממוצע פשוט של שני הממוצעים מתעלם ממספרי התלמידים השונים בכיתות.","חילוק ב-60 אינו נכון: יש לחלק את סכום הציונים הכולל ב-40, מספר כל התלמידים."]},{id:"pq-15",t:"ממוצעים",q:"הממוצע של 6 מספרים הוא 12. מוסיפים להם את המספר 47. מהו הממוצע החדש של 7 המספרים?",o:["⁦29.5⁩","⁦12⁩","⁦119/6⁩","⁦17⁩"],a:3,e:"סכום 6 המספרים: 6\xD712 = 72. אחרי הוספת 47: 119. הממוצע החדש: 119/7 = 17.",w:["ממוצע בין הממוצע הישן למספר החדש אינו נכון: יש לתת משקל ל-6 המספרים.","הממוצע לא יישאר 12: המספר שנוסף (47) גדול מהממוצע, ולכן הוא מזיז את הממוצע מעלה.","סכום המספרים חולק ב-6 ולא ב-7.",""]},{id:"pq-16",t:"אחוזים",q:"סכום של 1000 ש״ח הופקד בבנק בריבית דריבית של 10% בשנה. כמה כסף יהיה בחשבון אחרי שנתיים (בש״ח)?",o:["⁦1200⁩","⁦1100⁩","⁦1210⁩","⁦1020⁩"],a:2,e:"אחרי שנה: 1000\xD71.1 = 1100. אחרי שנתיים: 1100\xD71.1 = 1210.",w:["זו ריבית פשוטה: הריבית של השנה השנייה מחושבת גם על הריבית שנצברה.","זה הסכום אחרי שנה אחת בלבד.","","הוספת אחוזים כמספר."]},{id:"pq-17",t:"ממוצעים",q:"בכיתה א׳ 10 תלמידים והממוצע שלהם במבחן הוא 66. בכיתה ב׳ 25 תלמידים והממוצע שלהם 87. מהו הממוצע המשותף של שתי הכיתות?",o:["⁦84⁩","⁦76.5⁩","⁦81⁩","⁦56.7⁩"],a:2,e:"סכום ציוני כיתה א׳: 10\xD766 = 660. כיתה ב׳: 25\xD787 = 2175. סך הכול 2835 ל-35 תלמידים: 81.",w:["ערך זה אינו הסכום הכולל של הציונים (2835) חלקי מספר כל התלמידים (35).","ממוצע פשוט של שני הממוצעים מתעלם ממספרי התלמידים השונים בכיתות.","","חילוק ב-50 אינו נכון: יש לחלק את סכום הציונים הכולל ב-35, מספר כל התלמידים."]},{id:"pq-18",t:"בעיות דרך",q:"נהג נסע ממקום א׳ למקום ב׳ במהירות 20 קמ״ש וחזר באותו מסלול במהירות 30 קמ״ש. מהי המהירות הממוצעת שלו בכל הנסיעה (בקמ״ש)?",o:["⁦25⁩","⁦24⁩","⁦30⁩","⁦27⁩"],a:1,e:"מהירות ממוצעת = מרחק כולל \xF7 זמן כולל. נבחר מרחק חד־כיווני של 600 ק״מ: זמן ההלוך 600/20 = 30 שעות, זמן החזרה 600/30 = 20 שעות. מרחק כולל 1200 ק״מ ב-50 שעות: 24 קמ״ש.",w:["ממוצע חשבוני של המהירויות אינו נכון, כי הנהג מבלה זמן רב יותר במהירות האיטית.","","המהירות הממוצעת אינה המהירות השנייה.","ערך זה אינו מתקבל מחלוקת המרחק הכולל בזמן הכולל. המהירות הממוצעת תמיד נמוכה מהממוצע החשבוני כאן."]},{id:"pq-19",t:"יחס וחלוקה",q:"שלושה שותפים חילקו 120 ש״ח ביניהם ביחס 2:3:5. מה ההפרש בין הסכום הגדול ביותר לקטן ביותר?",o:["⁦60⁩","⁦36⁩","⁦40⁩","⁦24⁩"],a:1,e:"סכום חלקי היחס: 10. שווי חלק אחד: 120/10 = 12. הגדול: 5\xD712 = 60, הקטן: 2\xD712 = 24. ההפרש: 36.",w:["זה הסכום הגדול ביותר, לא ההפרש.","","חילוק שווה לשלושה אינו מתאים ליחס הנתון.","זה הסכום הקטן ביותר, לא ההפרש."]},{id:"pq-20",t:"סטטיסטיקה",q:"נתונים המספרים ⁦13, 17, 18, 3, 10⁩. מהו ההפרש בין הממוצע לחציון? (ערך מוחלט)",o:["⁦2.2⁩","⁦13⁩","⁦12.2⁩","⁦0.8⁩"],a:3,e:"אחרי סידור: ⁦3, 10, 13, 17, 18⁩. החציון (האמצעי): 13. הממוצע: 61/5 = 12.2. ההפרש: 0.8.",w:["נבחר המספר השני כחציון; החציון הוא האמצעי אחרי סידור.","זה החציון, לא ההפרש.","זה הממוצע, לא ההפרש.",""]},{id:"pq-21",t:"יחס וחלוקה",q:"שלושה שותפים חילקו 300 ש״ח ביניהם ביחס 1:3:6. מה ההפרש בין הסכום הגדול ביותר לקטן ביותר?",o:["⁦30⁩","⁦150⁩","⁦100⁩","⁦180⁩"],a:1,e:"סכום חלקי היחס: 10. שווי חלק אחד: 300/10 = 30. הגדול: 6\xD730 = 180, הקטן: 1\xD730 = 30. ההפרש: 150.",w:["זה הסכום הקטן ביותר, לא ההפרש.","","חילוק שווה לשלושה אינו מתאים ליחס הנתון.","זה הסכום הגדול ביותר, לא ההפרש."]},{id:"pq-22",t:"סטטיסטיקה",q:"נתונים המספרים ⁦3, 24, 4, 10, 12⁩. מהו ההפרש בין הממוצע לחציון? (ערך מוחלט)",o:["⁦10.6⁩","⁦10⁩","⁦6.6⁩","⁦0.6⁩"],a:3,e:"אחרי סידור: ⁦3, 4, 10, 12, 24⁩. החציון (האמצעי): 10. הממוצע: 53/5 = 10.6. ההפרש: 0.6.",w:["זה הממוצע, לא ההפרש.","זה החציון, לא ההפרש.","נבחר המספר השני כחציון; החציון הוא האמצעי אחרי סידור.",""]},{id:"pq-23",t:"סטטיסטיקה",q:"נתונים המספרים ⁦5, 20, 29, 8, 2⁩. מהו ההפרש בין הממוצע לחציון? (ערך מוחלט)",o:["⁦8⁩","⁦7.8⁩","⁦4.8⁩","⁦12.8⁩"],a:2,e:"אחרי סידור: ⁦2, 5, 8, 20, 29⁩. החציון (האמצעי): 8. הממוצע: 64/5 = 12.8. ההפרש: 4.8.",w:["זה החציון, לא ההפרש.","נבחר המספר השני כחציון; החציון הוא האמצעי אחרי סידור.","","זה הממוצע, לא ההפרש."]},{id:"pq-24",t:"גאומטריה",q:"אורך מלבן גדול ב-2 ס״מ מרוחבו, וההיקף שלו 24 ס״מ. מהו שטח המלבן (בסמ״ר)?",o:["⁦36⁩","⁦40⁩","⁦48⁩","⁦35⁩"],a:3,e:"נסמן רוחב x, אורך x+2: ⁦2x + 2(x+2) = 24⁩. ⁦4x = 20⁩, ⁦x = 5⁩. האורך 7. השטח 5\xD77 = 35.",w:["זה שטח ריבוע עם אותו היקף, לא המלבן.","ערך זה אינו שטח המלבן: השטח הוא אורך כפול רוחב, ללא תוספת.","שילוב לא תקין של הנתונים.",""]},{id:"pq-25",t:"אחוזים",q:"מחיר של מוצר ירד ב-20%. בכמה אחוזים יש להעלות את המחיר החדש כדי שיחזור למחירו המקורי?",o:["⁦35⁩%","⁦25⁩%","⁦30⁩%","⁦20⁩%"],a:1,e:"נניח שהמחיר המקורי 100. אחרי הירידה: 80. כדי לחזור ל-100 צריך להוסיף 20. אחוז ההעלאה: 20/80 = 25%.",w:["ההעלאה הנדרשת קטנה מערך זה: אחרי העלאה כזו המחיר היה עובר את המחיר המקורי.","","אין כלל שאומר שההעלאה היא 20% ועוד חצי ממנו. בדקו עם מחיר מקורי 100: ההעלאה נקבעת לפי החלק 20 מתוך 80.","ההעלאה מחושבת מהמחיר החדש, הקטן יותר, ולכן היא גדולה מ-20%."]},{id:"pq-26",t:"ממוצעים",q:"הממוצע של 6 מספרים הוא 20. מוסיפים להם את המספר 48. מהו הממוצע החדש של 7 המספרים?",o:["⁦28⁩","⁦34⁩","⁦20⁩","⁦24⁩"],a:3,e:"סכום 6 המספרים: 6\xD720 = 120. אחרי הוספת 48: 168. הממוצע החדש: 168/7 = 24.",w:["סכום המספרים חולק ב-6 ולא ב-7.","ממוצע בין הממוצע הישן למספר החדש אינו נכון: יש לתת משקל ל-6 המספרים.","הממוצע לא יישאר 20: המספר שנוסף (48) גדול מהממוצע, ולכן הוא מזיז את הממוצע מעלה.",""]},{id:"pq-27",t:"תכונות מספרים",q:"מהו המספר הטבעי הקטן ביותר, גדול מ-5, שבחלוקתו ב-6 וב-8 נשאר שארית 5 בשני המקרים?",o:["⁦29⁩","⁦24⁩","⁦19⁩","⁦53⁩"],a:0,e:"המספר פחות 5 מתחלק ב-6 וב-8, ולכן הוא כפולה משותפת. הכפולה המשותפת הקטנה ביותר היא 24. המספר: 24+5 = 29.",w:["","הכפולה המשותפת עצמה נותנת שארית 0, ולא 5.","לא נובע מכללי החלוקה.","אפשר להשתמש במכפלה, אך הכפולה המשותפת הקטנה ביותר היא 24, ולכן יש מספר קטן יותר."]},{id:"pq-28",t:"משוואות",q:"פי 4 ממספר מסוים ועוד 3 שווה ל-51. מהו המספר?",o:["⁦54⁩","⁦12.75⁩","⁦12⁩","⁦48⁩"],a:2,e:"נסמן את המספר ב-x: ⁦4x + 3 = 51⁩. מחסרים 3: ⁦4x = 48⁩. מחלקים ב-4: ⁦x = 12⁩.",w:["יש להחסיר את 3 ולא להוסיף.","יש להחסיר את 3 לפני החילוק.","","זה הערך לפני החלוקה ב-4."]},{id:"pq-29",t:"בעיות דרך",q:"שתי מכוניות יוצאות באותו זמן משני מקומות, ונוסעות זו לקראת זו. מהירות האחת 50 קמ״ש והשנייה 70 קמ״ש. הן נפגשות אחרי 5 שעות. מה המרחק בין שני המקומות (בק״מ)?",o:["⁦350⁩","⁦600⁩","⁦-100⁩","⁦650⁩"],a:1,e:"כל שעה המרחק בין המכוניות קטן ב-50+70 = 120 ק״מ. אחרי 5 שעות: 120\xD75 = 600 ק״מ.",w:["זה המרחק שעברה המכונית המהירה בלבד.","","במהלך נסיעה זו לקראת זו המהירויות מתחברות ולא נחסרות.","הוספת 50 למרחק אינה נובעת מהנתונים: המרחק הוא סכום המהירויות כפול הזמן, ללא תוספת."]},{id:"pq-30",t:"הסתברות",q:"בקופסה 4 כדורים אדומים ו-4 כדורים כחולים. מוציאים שני כדורים אחד אחרי השני, בלי להחזיר. מה ההסתברות ששני הכדורים אדומים?",o:["⁦1/4⁩","⁦3/14⁩","⁦8/9⁩","⁦2/7⁩"],a:1,e:"ההסתברות לאדום ראשון: 4/8. אחרי זה נשארו 3 אדומים מתוך 7 כדורים: 3/7. המכפלה: ⁦3/14⁩.",w:["אחרי הוצאת כדור אחד לא מחזירים אותו, ולכן ההסתברות השנייה משתנה.","","אין דרך לקבל את התוצאה באופן זה.","אחרי הוצאת כדור אדום נשארים a-1 כדורים אדומים, לא a."]},{id:"pq-31",t:"משוואות",q:"פי 2 ממספר מסוים ועוד 5 שווה ל-29. מהו המספר?",o:["⁦12⁩","⁦24⁩","⁦17⁩","⁦14.5⁩"],a:0,e:"נסמן את המספר ב-x: ⁦2x + 5 = 29⁩. מחסרים 5: ⁦2x = 24⁩. מחלקים ב-2: ⁦x = 12⁩.",w:["","זה הערך לפני החלוקה ב-2.","יש להחסיר את 5 ולא להוסיף.","יש להחסיר את 5 לפני החילוק."]},{id:"pq-32",t:"אלגברה",q:"נתון כי ⁦x + y = 9⁩ וגם ⁦x - y = 2⁩. מהו הערך של ⁦x\xB2 - y\xB2⁩?",o:["⁦18⁩","⁦11⁩","⁦27⁩","⁦77⁩"],a:0,e:"נוסחת הכפל המקוצר: ⁦x\xB2 - y\xB2 = (x+y)(x-y)⁩. לכן 9\xD72 = 18.",w:["","הנוסחה היא מכפלה, לא סכום.","נוסחת הכפל המקוצר נותנת את המכפלה s\xD7d בלבד, ללא תוספת של s.","זה לא הערך המבוקש."]}]},english:[{id:"en01",t:"Sentence completion",q:"Although the museum is small, it ______ a remarkable collection of ancient pottery.",o:["rejects","forgets","houses","avoids"],a:2,e:"houses פירושו מכיל. 'Although' מציג ניגוד בין גודל קטן לאוסף מרשים.",w:["rejects does not fit the meaning of the sentence.","forgets makes no sense with
