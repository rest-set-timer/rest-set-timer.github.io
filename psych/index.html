<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3efe8">
<title>אפליקציית פסיכומטרי</title>
<style>
:root{
  --ds-page:#ffffff; --ds-ink:#1c1f26; --ds-ink-2:#5b6472; --ds-hairline:#e4e1da; --ds-line:#d9d4cc;
}
html,body{margin:0;padding:0;background:#f3efe8;}
body{font-family:-apple-system,"SF Pro Text","Segoe UI",Arial,sans-serif;}
.fc{max-width:760px;margin:0 auto;background:var(--ds-page);min-height:100dvh;padding:18px 16px 40px;box-shadow:0 0 24px rgba(0,0,0,.06);}
@media (min-width:820px){.fc{margin:24px auto;border-radius:20px;min-height:auto;}}
.hd h1{font-size:26px;margin:6px 0 2px;color:var(--ds-ink);}
.hd-fact{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ds-ink-2);}
.hd-intro{margin:0 0 10px;font-size:15px;line-height:1.6;color:var(--ds-ink-2);}
.grp{margin:14px 0;}
.grp-h{font-size:18px;margin:0 0 6px;color:var(--ds-ink);}
.grp-l{font-size:14px;font-weight:700;color:var(--ds-ink-2);margin-bottom:6px;}
.callout{border:1px solid var(--ds-hairline);border-inline-start:4px solid #0f766e;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px;line-height:1.7;}
.callout.warning{border-inline-start-color:#b42318;}
.callout>div{margin-top:4px;}
.closing{margin-top:22px;padding-top:12px;border-top:1px solid var(--ds-hairline);font-size:13px;color:var(--ds-ink-2);line-height:1.6;}

u05E6\u05E8\u05D9\u05DB\u05D4 \u05D4\u05E0\u05D7\u05D4 \u05DB\u05DC \u05DB\u05DA \u05D7\u05D6\u05E7\u05D4; \u05D9\u05DB\u05D5\u05DC\u05D5\u05EA \u05DC\u05D4\u05D9\u05D5\u05EA \u05DE\u05E1\u05E2\u05D3\u05D5\u05EA \u05D0\u05D7\u05E8\u05D5\u05EA.",""]},{id:"v1-10",t:"\u05D4\u05E9\u05DC\u05DE\u05EA \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD",q:"\u05D4\u05DE\u05E0\u05D4\u05DC \u05DC\u05D0 \u05D4\u05EA\u05E8\u05D2\u05E9 \u05DE\u05D4\u05D1\u05D9\u05E7\u05D5\u05E8\u05EA \u05E2\u05DC \u05D4\u05D7\u05DC\u05D8\u05EA\u05D5, \u05D5\u05DC\u05D0 ____ \u05D1\u05D4, \u05D0\u05DC\u05D0 ____ \u05DC\u05D9\u05D9\u05E9\u05DD \u05D0\u05D5\u05EA\u05D4 \u05D1\u05DE\u05DC\u05D5\u05D0\u05D4.",o:["\u05D4\u05EA\u05E2\u05E7\u05E9 / \u05D4\u05DE\u05E9\u05D9\u05DA","\u05D4\u05EA\u05E2\u05E7\u05E9 / \u05D5\u05D9\u05EA\u05E8","\u05D7\u05D6\u05E8 \u05D1\u05D5 / \u05D4\u05DE\u05E9\u05D9\u05DA","\u05D7\u05D6\u05E8 \u05D1\u05D5 / \u05D5\u05D9\u05EA\u05E8"],a:2,e:"\u05D4\u05DE\u05E9\u05E4\u05D8 \u05DE\u05EA\u05D0\u05E8 \u05DE\u05E0\u05D4\u05DC \u05E9\u05DC\u05D0 \u05D6\u05D6 \u05DE\u05E2\u05DE\u05D3\u05EA\u05D5: \u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D7\u05D6\u05E8 \u05D1\u05D5 \u05D0\u05DC\u05D0 \u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05D9\u05D9\u05E9\u05DD. \u05D4\u05E6\u05D9\u05E8\u05D5\u05E3 '\u05DC\u05D0 ... \u05D0\u05DC\u05D0' \u05D3\u05D5\u05E8\u05E9 \u05E0\u05D9\u05D2\u05D5\u05D3.",w:["'\u05DC\u05D0 \u05D4\u05EA\u05E2\u05E7\u05E9 \u05D1\u05D4 \u05D0\u05DC\u05D0 \u05D4\u05DE\u05E9\u05D9\u05DA' \u05D0\u05D9\u05E0\u05D5 \u05D4\u05D2\u05D9\u05D5\u05E0\u05D9, \u05DB\u05D9 \u05D4\u05DD \u05DB\u05DE\u05E2\u05D8 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8.","\u05D4\u05EA\u05E2\u05E7\u05E9 \u05D5\u05D2\u05DD \u05D5\u05D9\u05EA\u05E8 \u05E1\u05D5\u05EA\u05E8\u05D9\u05DD \u05D6\u05D4 \u05D0\u05EA \u05D6\u05D4, \u05D5\u05D4\u05D7\u05D9\u05D1\u05D5\u05E8 \u05DC'\u05D0\u05DC\u05D0' \u05D0\u05D9\u05E0\u05D5 \u05D4\u05D2\u05D9\u05D5\u05E0\u05D9.","","\u05D0\u05D7\u05E8\u05D9 '\u05D0\u05DC\u05D0' \u05E6\u05E8\u05D9\u05DA \u05DC\u05D1\u05D5\u05D0 \u05D4\u05D4\u05E4\u05DA \u05DE\u05D7\u05D6\u05E8\u05D4 \u05D1\u05D5, \u05D5\u05D5\u05D9\u05EA\u05D5\u05E8 \u05D0\u05D9\u05E0\u05D5 \u05DB\u05D6\u05D4."]},{id:"v1-11",t:"\u05D4\u05E1\u05E7\u05D4 \u05DE\u05D8\u05E7\u05E1\u05D8",q:"\u05D1\u05E2\u05E7\u05D1\u05D5\u05EA \u05D4\u05E4\u05D7\u05EA\u05EA \u05DE\u05D7\u05D9\u05E8 \u05D4\u05DB\u05E8\u05D8\u05D9\u05E1\u05D9\u05DD \u05DC\u05E1\u05E8\u05D8\u05D9\u05DD, \u05DE\u05E1\u05E4\u05E8 \u05D4\u05E6\u05D5\u05E4\u05D9\u05DD \u05D1\u05E7\u05D5\u05DC\u05E0\u05D5\u05E2 \u05D4\u05D5\u05DB\u05E4\u05DC, \u05D5\u05D0\u05D9\u05DC\u05D5 \u05D4\u05DB\u05E0\u05E1\u05D5\u05EA \u05D4\u05E7\u05D5\u05DC\u05E0\u05D5\u05E2 \u05D9\u05E8\u05D3\u05D5. \u05DE\u05D4 \u05D1\u05D4\u05DB\u05E8\u05D7 \u05E0\u05DB\u05D5\u05DF?",o:["\u05D4\u05D4\u05DB\u05E0\u05E1\u05D5\u05EA \u05D9\u05E8\u05D3\u05D5 \u05D1\u05D2\u05DC\u05DC \u05D9\u05E8\u05D9\u05D3\u05D4 \u05D1\u05E7\u05E0\u05D9\u05D5\u05EA \u05DE\u05D6\u05D5\u05DF.","\u05DE\u05D7\u05D9\u05E8 \u05D4\u05DB\u05E8\u05D8\u05D9\u05E1 \u05D9\u05E8\u05D3 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05DE-50%.","\u05DE\u05D7\u05D9\u05E8 \u05D4\u05DB\u05E8\u05D8\u05D9\u05E1 \u05D9\u05E8\u05D3 \u05D1\u05E4\u05D7\u05D5\u05EA \u05DE-50%.","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05E6\u05D5\u05E4\u05D9\u05DD \u05E2\u05DC\u05D4 \u05D1\u05DB\u05DC \u05D4\u05D0\u05D5\u05DC\u05DE\u05D5\u05EA."],a:1,e:"\u05D4\u05DB\u05E0\u05E1\u05D5\u05EA = \u05DE\u05D7\u05D9\u05E8 \xD7 \u05DB\u05DE\u05D5\u05EA. \u05D4\u05DB\u05DE\u05D5\u05EA \u05D4\u05D5\u05DB\u05E4\u05DC\u05D4 \u05D5\u05D4\u05D4\u05DB\u05E0\u05E1\u05D5\u05EA \u05D9\u05E8\u05D3\u05D5, \u05D5\u05DC\u05DB\u05DF \u05D4\u05DE\u05D7\u05D9\u05E8 \u05D9\u05E8\u05D3 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05DE-50%. \u05D0\u05D9\u05DC\u05D5 \u05D9\u05E8\u05D3 \u05D1\u05E4\u05D7\u05D5\u05EA \u05DE-50% \u05D4\u05D4\u05DB\u05E0\u05E1\u05D5\u05EA \u05D4\u05D9\u05D5 \u05E2\u05D5\u05DC\u05D5\u05EA.",w:["\u05D4\u05DE\u05D9\u05D3\u05E2 \u05D0\u05D9\u05E0\u05D5 \u05DE\u05D6\u05DB\u05D9\u05E8 \u05DB\u05DA.","","\u05D0\u05DD \u05DB\u05DA \u05D4\u05D4\u05DB\u05E0\u05E1\u05D5\u05EA \u05D4\u05D9\u05D5 \u05E2\u05D5\u05DC\u05D5\u05EA, \u05DB\u05D9 \u05D4\u05DB\u05DE\u05D5\u05EA \u05D4\u05D5\u05DB\u05E4\u05DC\u05D4.","\u05D4\u05E0\u05EA\u05D5\u05DF \u05D4\u05D5\u05D0 \u05E2\u05DC \u05E1\u05DA \u05D4\u05E6\u05D5\u05E4\u05D9\u05DD."]},{id:"v1-12",t:"\u05D4\u05E1\u05E7\u05D4",q:"\u05D0\u05DD \u05D4\u05D7\u05D1\u05E8\u05D4 \u05EA\u05E2\u05DC\u05D4 \u05D0\u05EA \u05D4\u05DE\u05D7\u05D9\u05E8\u05D9\u05DD, \u05DE\u05DB\u05D9\u05E8\u05D5\u05EA\u05D9\u05D4 \u05D9\u05E4\u05D7\u05EA\u05D5. \u05DE\u05DB\u05D9\u05E8\u05D5\u05EA \u05D4\u05D7\u05D1\u05E8\u05D4 \u05DC\u05D0 \u05E4\u05D7\u05EA\u05D5. \u05DE\u05D4 \u05E0\u05D5\u05D1\u05E2 \u05D1\u05D4\u05DB\u05E8\u05D7?",o:["\u05D4\u05D7\u05D1\u05E8\u05D4 \u05D4\u05D5\u05E8\u05D9\u05D3\u05D4 \u05D0\u05EA \u05D4\u05DE\u05D7\u05D9\u05E8\u05D9\u05DD.","\u05DE\u05DB\u05D9\u05E8\u05D5\u05EA \u05D4\u05D7\u05D1\u05E8\u05D4 \u05E2\u05DC\u05D5.","\u05D4\u05D7\u05D1\u05E8\u05D4 \u05DC\u05D0 \u05D4\u05E2\u05DC\u05EA\u05D4 \u05D0\u05EA \u05D4\u05DE\u05D7\u05D9\u05E8\u05D9\u05DD.","\u05D4\u05D7\u05D1\u05E8\u05D4 \u05EA\u05E2\u05DC\u05D4 \u05D0\u05EA \u05D4\u05DE\u05D7\u05D9\u05E8\u05D9\u05DD \u05D1\u05E2\u05EA\u05D9\u05D3."],a:2,e:"\u05D0\u05DD \u05D4\u05E2\u05DC\u05D0\u05EA \u05DE\u05D7\u05D9\u05E8\u05D9\u05DD \u05D2\u05D5\u05E8\u05E8\u05EA \u05D9\u05E8\u05D9\u05D3\u05D4 \u05D1\u05DE\u05DB\u05D9\u05E8\u05D5\u05EA, \u05DB\u05E9\u05D0\u05D9\u05DF \u05D9\u05E8\u05D9\u05D3\u05D4 \u05D1\u05D4\u05DB\u05E8\u05D7 \u05DC\u05D0 \u05D4\u05D5\u05E2\u05DC\u05D5 \u05D4\u05DE\u05D7\u05D9\u05E8\u05D9\u05DD.",w:["\u05D9\u05D9\u05EA\u05DB\u05DF \u05E9\u05D4\u05DE\u05D7\u05D9\u05E8\u05D9\u05DD \u05E0\u05E9\u05D0\u05E8\u05D5 \u05DB\u05E9\u05D4\u05D9\u05D5.","\u05D9\u05D9\u05EA\u05DB\u05DF \u05E9\u05D4\u05DE\u05DB\u05D9\u05E8\u05D5\u05EA \u05E0\u05E9\u05D0\u05E8\u05D5 \u05DC\u05DC\u05D0 \u05E9\u05D9\u05E0\u05D5\u05D9.","","\u05D4\u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05D0\u05D9\u05E0\u05DD \u05E2\u05D5\u05E1\u05E7\u05D9\u05DD \u05D1\u05E2\u05EA\u05D9\u05D3."]},{id:"v1-13",t:"\u05D4\u05E1\u05E7\u05D4 \u05DE\u05D8\u05E7\u05E1\u05D8",q:"\u05DE\u05E0\u05D4\u05DC\u05EA \u05D4\u05E6\u05D4\u05D9\u05E8\u05D4: \u05E8\u05E7 \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD \u05E9\u05E2\u05DE\u05D3\u05D5 \u05D1\u05D9\u05E2\u05D3\u05D9\u05DD \u05D4\u05E9\u05E0\u05D4 \u05D9\u05E7\u05D1\u05DC\u05D5 \u05D1\u05D5\u05E0\u05D5\u05E1. \u05D0\u05D5\u05E8\u05D9 \u05E7\u05D9\u05D1\u05DC \u05D1\u05D5\u05E0\u05D5\u05E1. \u05DE\u05D4 \u05E0\u05D5\u05D1\u05E2 \u05D1\u05D4\u05DB\u05E8\u05D7?",o:["\u05D0\u05D5\u05E8\u05D9 \u05E2\u05DE\u05D3 \u05D1\u05D9\u05E2\u05D3\u05D9\u05DD \u05D4\u05E9\u05E0\u05D4.","\u05D0\u05D5\u05E8\u05D9 \u05E2\u05D5\u05D1\u05D3 \u05D1\u05D7\u05D1\u05E8\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05E9\u05E0\u05D4.","\u05DB\u05DC \u05DE\u05D9 \u05E9\u05E2\u05DE\u05D3 \u05D1\u05D9\u05E2\u05D3\u05D9\u05DD \u05E7\u05D9\u05D1\u05DC \u05D1\u05D5\u05E0\u05D5\u05E1.","\u05D0\u05D5\u05E8\u05D9 \u05D4\u05D9\u05D4 \u05D4\u05E2\u05D5\u05D1\u05D3 \u05D4\u05D8\u05D5\u05D1 \u05D1\u05D9\u05D5\u05EA\u05E8."],a:0,e:"'\u05E8\u05E7 \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD \u05E9\u05E2\u05DE\u05D3\u05D5 \u05D1\u05D9\u05E2\u05D3\u05D9\u05DD \u05D9\u05E7\u05D1\u05DC\u05D5' \u05E4\u05D9\u05E8\u05D5\u05E9\u05D5 \u05E9\u05E2\u05DE\u05D9\u05D3\u05D4 \u05D1\u05D9\u05E2\u05D3\u05D9\u05DD \u05D4\u05D9\u05D0 \u05EA\u05E0\u05D0\u05D9 \u05D4\u05DB\u05E8\u05D7\u05D9. \u05D0\u05D5\u05E8\u05D9 \u05E7\u05D9\u05D1\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D5\u05D0 \u05E2\u05DE\u05D3 \u05D1\u05D9\u05E2\u05D3\u05D9\u05DD.",w:["","\u05D4\u05E0\u05EA\u05D5\u05DF \u05D0\u05D9\u05E0\u05D5 \u05DE\u05D5\u05E4\u05D9\u05E2.","\u05D4\u05D4\u05E6\u05D4\u05E8\u05D4 \u05E7\u05D5\u05D1\u05E2\u05EA \u05EA\u05E0\u05D0\u05D9 \u05D4\u05DB\u05E8\u05D7\u05D9 \u05D5\u05DC\u05D0 \u05DE\u05E1\u05E4\u05D9\u05E7.","\u05D0\u05D9\u05DF \u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05E2\u05DC \u05D4\u05E9\u05D5\u0 C\u05DC\u05EA \u05DC\u05D0 \u05D4\u05E9\u05EA\u05E0\u05EA\u05D4."]},{id:"v1-15",t:"\u05D4\u05E9\u05DC\u05DE\u05EA \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD",q:"\u05D4\u05D7\u05D5\u05E7\u05E8 \u05DC\u05D0 \u05D4\u05E1\u05EA\u05E4\u05E7 \u05D1\u05E2\u05D3\u05D5\u05D9\u05D5\u05EA ____, \u05D5\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05D7\u05E4\u05E9 \u05E8\u05D0\u05D9\u05D5\u05EA ____ \u05E9\u05D9\u05E7\u05E9\u05E8\u05D5 \u05D0\u05EA \u05D4\u05D7\u05E9\u05D5\u05D3 \u05DC\u05D6\u05D9\u05E8\u05D4.",o:["\u05E2\u05E7\u05D9\u05E4\u05D5\u05EA / \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA","\u05D7\u05DC\u05E9\u05D5\u05EA / \u05D7\u05DC\u05E9\u05D5\u05EA","\u05D9\u05E9\u05D9\u05E8\u05D5\u05EA / \u05E2\u05E7\u05D9\u05E4\u05D5\u05EA","\u05DE\u05D5\u05E6\u05E7\u05D5\u05EA / \u05E2\u05E7\u05D9\u05E4\u05D5\u05EA"],a:0,e:"\u05D4\u05D7\u05D5\u05E7\u05E8 \u05DC\u05D0 \u05D4\u05E1\u05EA\u05E4\u05E7 \u05D1\u05E2\u05D3\u05D5\u05D9\u05D5\u05EA \u05E2\u05E7\u05D9\u05E4\u05D5\u05EA, \u05D5\u05DC\u05DB\u05DF \u05D7\u05D9\u05E4\u05E9 \u05E8\u05D0\u05D9\u05D5\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA. \u05D6\u05D4 \u05D4\u05DE\u05E2\u05D1\u05E8 \u05D4\u05D8\u05D1\u05E2\u05D9 \u05D1\u05D4\u05DC\u05D9\u05DA \u05D7\u05E7\u05D9\u05E8\u05D4.",w:["","\u05D0\u05D9\u05DF \u05DE\u05E9\u05DE\u05E2\u05D5\u05EA \u05DC\u05D7\u05D9\u05E4\u05D5\u05E9 \u05E8\u05D0\u05D9\u05D5\u05EA \u05D7\u05DC\u05E9\u05D5\u05EA.","\u05D4\u05E1\u05D3\u05E8 \u05DE\u05EA\u05D4\u05E4\u05DA: \u05DC\u05D0 \u05DE\u05E1\u05EA\u05E4\u05E7\u05D9\u05DD \u05D1\u05E2\u05D3\u05D5\u05D9\u05D5\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05D5\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA?","\u05DE\u05D9 \u05E9\u05D9\u05E9 \u05DC\u05D5 \u05E8\u05D0\u05D9\u05D5\u05EA \u05DE\u05D5\u05E6\u05E7\u05D5\u05EA \u05D0\u05D9\u05E0\u05D5 \u05DE\u05DE\u05E9\u05D9\u05DA \u05DC\u05D7\u05E4\u05E9 \u05E8\u05D0\u05D9\u05D5\u05EA \u05E7\u05E9\u05D5\u05E8\u05D5\u05EA."]},{id:"v1-16",t:"\u05DB\u05DC\u05DC\u05D9\u05DD \u05D5\u05E1\u05D9\u05D3\u05D5\ 5D9\u05D9\u05DF. '\u05D5\u05D0\u05D9\u05DC\u05D5' \u05DE\u05E6\u05D9\u05D2 \u05E0\u05D9\u05D2\u05D5\u05D3, \u05D5\u05DC\u05DB\u05DF \u05D4\u05E0\u05D5\u05D0\u05DD \u05D4\u05DE\u05E9\u05D9\u05DA \u05D1\u05DC\u05D4\u05D8.",w:["","'\u05D5\u05D0\u05D9\u05DC\u05D5' \u05D3\u05D5\u05E8\u05E9 \u05E0\u05D9\u05D2\u05D5\u05D3, \u05D5\u05E0\u05D7\u05DC\u05E9 \u05D0\u05D9\u05E0\u05D5 \u05E0\u05D9\u05D2\u05D5\u05D3 \u05DC\u05D0\u05D9\u05D1\u05D5\u05D3 \u05E2\u05E0\u05D9\u05D9\u05DF.","'\u05D0\u05E8\u05D5\u05DA \u05D5\u05DE\u05D9\u05D9\u05D2\u05E2' \u05D0\u05D9\u05E0\u05D5 \u05DE\u05EA\u05D9\u05D9\u05E9\u05D1 \u05E2\u05DD \u05D2\u05D9\u05DC\u05D5\u05D9 \u05E2\u05E0\u05D9\u05D9\u05DF.","'\u05D1\u05DC\u05D4\u05D8' \u05E1\u05D5\u05EA\u05E8 \u05D4\u05E4\u05E1\u05E7\u05D4."]},{id:"v2-9",t:"\u05D4\u05E1\u05E7\u05D4",q:"\u05DB\u05DC \u05D4\u05E8\u05D5\u05E4\u05D0\u05D9\u05DD \u05D1\u05D1\u05D9\u05EA \u05D4\u05D7\u05D5\u05DC\u05D9\u05DD \u05E2\u05D1\u05E8\u05D5 \u05D4\u05DB\u05E9\u05E8\u05D4 \u05D1\u05E2\u05D6\u05E8\u05D4 \u05E8\u05D0\u05E9\u05D5\u05E0\u05D4. \u05D7\u05DC\u05E7 \u05DE\u05E2\u05D5\u05D1\u05D3\u05D9 \u05D1\u05D9\u05EA \u05D4\u05D7\u05D5\u05DC\u05D9\u05DD \u05D4\u05DD \u05D0\u05D7\u05D9\u05D5\u05EA. \u05DE\u05D4 \u05E0\u05D5\u05D1\u05E2 \u05D1\u05D4\u05DB\u05E8\u05D7?",o:["\u05D0\u05D9\u05DF \u05D0\u05D7\u05D9\u05D5\u05EA \u05E9\u05E2\u05D1\u05E8\u05D5 \u05D4\u05DB\u05E9\u05E8\u05D4 \u05D1\u05E2\u05D6\u05E8\u05D4 \u05E8\u05D0\u05E9\u05D5\u05E0\u05D4.","\u05DB\u05DC \u05D4\u05D0\u05D7\u05D9\u05D5\u05EA \u05E2\u05D1\u05E8\u05D5 \u05D4\u05DB\u05E9\u05E8\u05D4 \u05D1\u05E2\u05D6\u05E8\u05D4 \u05E8\u05D0\u05E9\u05D5\u05E0\u05D4.","\u05D7\u05DC\u05E7 \u05DE\u05D4\u05E8\u05D5\u05E4\u05D0\u05D9\u05DD \u05D4\u05DD \u05D0\u05D7\u05D9\u05D5\u05EA.","\u05DC\u05D0 \u05E0\u05D9\u05EA\u05DF \u05DC\u05D3\u05E2\u05EA \u05D0\u05DD \u05D4\u05D0\u05D7\u05D9\u05D5\u05EA \u05E2\u05D1\u05E8\u05D5 \u05D4\u05DB\u05E9\u05E8\u05D4 \u05D1\u05E2\u05D6\u05E8\u05D4 \u05E8\u05D0\u05E9\u05D5\u05E0\u05D4."],a:3,e:"\u05D4\u05DB\u05DC\u05DC \u05D4\u05E8\u05D0\u05E9\u05D5\u05DF \u05DE\u05D3\u05D1\u05E8 \u05E2\u05DC \u05D4\u05E8\u05D5\u05E4\u05D0\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3, \u05D5\u05D4\u05E0\u05EA\u05D5\u05DF \u05D4\u05E9\u05E0\u05D9 \u05DE\u05D3\u05D1\u05E8 \u05E2\u05DC \u05D0\u05D7\u05D9\u05D5\u05EA. \u05D0\u05D9\u05DF \u05D7\u05D9\u05D1\u05D5\u05E8 \u05DC\u05D5\u05D2\u05D9 \u05D1\u05D9\u05E0\u05D9\u05D4\u05DD, \u05D5\u05DC\u05DB\u05DF \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E1\u05D9\u05E7 \u05D3\u05D1\u05E8 \u05E2\u05DC \u05D4\u05D0\u05D7\u05D9\u05D5\u05EA.",w:["\u05D2\u05DD \u05D6\u05D4 \u05D0\u05D9\u05E0\u05D5 \u05E0\u05D5\u05D1\u05E2, \u05DB\u05D9 \u05D0\u05D9\u05DF \u05DE\u05D9\u05D3\u05E2 \u05E2\u05DC \u05D4\u05D0\u05D7\u05D9\u05D5\u05EA.","\u05D4\u05E0\u05EA\u05D5\u05DF \u05E2\u05D5\u05E1\u05E7 \u05D1\u05E8\u05D5\u05E4\u05D0\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3.","\u05D0\u05D9\u05DF \u05D1\u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05E7\u05E9\u05E8 \u05D1\u05D9\u05DF \u05D4\u05E7\u05D1\u05D5\u05E6\u05D5\u05EA.",""]},{id:"v2-10",t:"\u05D7\u05D9\u05D6\u05D5\u05E7 \u05D5\u05D4\u05D7\u05DC\u05E9\u05D4",q:"\u05E2\u05D9\u05EA\u05D5\u05E0\u05D0\u05D9 \u05DB\u05EA\u05D1: \u05DE\u05D7\u05E7\u05E8 \u05DE\u05E6\u05D0 \u05E9\u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05D0\u05D5\u05DB\u05DC\u05D9\u05DD \u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8 \u05DE\u05D3\u05D9 \u05D9\u05D5\u05DD \u05E9\u05D5\u05E7\u05DC\u05D9\u05DD \u05E4\u05D7\u05D5\u05EA \u05DE\u05D0\u05D7\u05E8\u05D9\u05DD. \u05DC\u05DB\u05DF \u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8 \u05DE\u05E1\u05D9\u05D9\u05E2\u05EA \u05DC\u05D9\u05E8\u05D9\u05D3\u05D4 \u05D1\u05DE\u05E9\u05E7\u05DC. \u05D0\u05D9\u05D6\u05D4 \u05DE\u05DE\u05E6\u05D0 \u05E0\u05D5\u05E1\u05E3 \u05D9\u05D7\u05DC\u05D9\u05E9 \u05D0\u05EA \u05D4\u05DE\u05E1\u05E7\u05E0\u05D4?",o:["\u05D9\u05E9 \u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05D0\u05D5\u05DB\u05DC\u05D9\u05DD \u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8 \u05D5\u05E9\u05D5\u05E7\u05DC\u05D9\u05DD \u05D4\u05E8\u05D1\u05D4.","\u05D0\u05E8\u05D5\u05D7\u05D5\u05EA \u05D1\u05D5\u05E7\u05E8 \u05E9\u05D5\u05E0\u05D5\u05EA \u05D1\u05DE\u05E8\u05DB\u05D9\u05D1\u05D9\u05D4\u05DF.","\u05E8\u05D5\u05D1 \u05D4\u05E0\u05D1\u05D3\u05E7\u05D9\u05DD \u05D4\u05D9\u05D5 \u05D1\u05E0\u05D9 \u05E9\u05DC\u05D5\u05E9\u05D9\u05DD.","\u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05DE\u05E7\u05E4\u05D9\u05D3\u05D9\u05DD \u05E2\u05DC \u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8 \u05DE\u05E7\u05E4\u05D9\u05D3\u05D9\u05DD \u05D2\u05DD \u05E2\u05DC \u05E4\u05E2\u05D9\u05DC\u05D5\u05EA \u05D2\u05D5\u05E4\u05E0\u05D9\u05EA \u05D5\u05E2\u05DC \u05EA\u05D6\u05D5\u05E0\u05D4 \u05DE\u05D0\u05D5\u05D6\u05E0\u05EA."],a:3,e:"\u05D0\u05DD \u05D4\u05D4\u05E8\u05D2\u05DC\u05D9\u05DD \u05D4\u05D1\u05E8\u05D9\u05D0\u05D9\u05DD \u05E0\u05DC\u05D5\u05D5\u05D9\u05DD \u05DC\u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8, \u05D9\u05D9\u05EA\u05DB\u05DF \u05E9\u05D4\u05DD \u05D4\u05D2\u05D5\u05E8\u05DD \u05DC\u05E9\u05E7\u05D9\u05DC\u05D4 \u05D4\u05E0\u05DE\u05D5\u05DB\u05D4 \u05D5\u05DC\u05D0 \u05D0\u05E8\u05D5\u05D7\u05EA \u05D4\u05D1\u05D5\u05E7\u05E8 \u05E2\u05E6\u05DE\u05D4.",w:["\u05D6\u05D4 \u05D7\u05E8\u05D9\u05D2, \u05D5\u05D0\u05D9\u05E0\u05D5 \u05E1\u05D5\u05EA\u05E8 \u05DE\u05D2\u05DE\u05D4.","\u05D0\u05D9\u05DF \u05D1\u05DB\u05DA \u05DB\u05D3\u05D9 \u05DC\u05E4\u05D2\u05D5\u05E2 \u05D1\u05DE\u05E1\u05E7\u05E0\u05D4, \u05E8\u05E7 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E9\u05DC\u05D4.","\u05D4\u05D2\u05D9\u05DC \u05E9\u05DC \u05D4\u05E0\u05D1\u05D3\u05E7\u05D9\u05DD \u05D0\u05D9\u05E0\u05D5 \u05DE\u05E2\u05E8\u05E2\u05E8 \u05E2\u05DC \u05D4\u05E7\u05E9\u05E8 \u05D4\u05E1\u05D9\u05D1\u05EA\u05D9.",""]},{id:"v2-11",t:"\u05D4\u05E1\u05E7\u05D4 \u05DE\u05D8\u05E7\u05E1\u05D8",q:"\u05D8\u05D1\u05DC\u05D4 \u05DE\u05E8\u05D0\u05D4 \u05DB\u05D9 \u05D1\u05E2\u05D9\u05E8 X \u05E9\u05D9\u05E2\u05D5\u05E8 \u05D4\u05D7\u05D5\u05DC\u05D9\u05DD \u05D1\u05E9\u05E4\u05E2\u05EA \u05D2\u05D1\u05D5\u05D4 \u05D1\u05D7\u05D5\u05E8\u05E3 \u05E4\u05D9 \u05E9\u05E0\u05D9\u05D9\u05DD \u05DE\u05D0\u05E9\u05E8 \u05D1\u05E7\u05D9\u05E5. \u05E8\u05D0\u05E9 \u05D4\u05E2\u05D9\u05E8 \u05D8\u05D5\u05E2\u05DF \u05E9\u05D4\u05E1\u05D9\u05D1\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05E7\u05D5\u05E8. \u05D0\u05D9\u05D6\u05D4 \u05E0\u05EA\u05D5\u05DF \u05D9\u05D7\u05DC\u05D9\u05E9 \u05D0\u05EA \u05D8\u05E2\u05E0\u05EA\u05D5?",o:["\u05D4\u05E7\u05D9\u05E5 \u05D1\u05E2\u05D9\u05E8 X \u05D7\u05DD \u05DE\u05D0\u05D5\u05D3.","\u05D1\u05E2\u05D9\u05E8 X \u05D9\u05E9 \u05DE\u05E2\u05D8 \u05DE\u05E8\u05E4\u05D0\u05D5\u05EA.","\u05D1\u05D7\u05D5\u05E8\u05E3 \u05D9\u05E9 \u05D9\u05D5\u05EA\u05E8 \u05D7\u05D5\u05DC\u05D9\u05DD \u05D1\u05DB\u05DC \u05D4\u05D2\u05D9\u05DC\u05D0\u05D9\u05DD.","\u05D1\u05E2\u05E8\u05D9\u05DD \u05D1\u05D0\u05E7\u05DC\u05D9\u05DD \u05D7\u05DD \u05E9\u05D1\u05D4\u05DF \u05D0\u05D9\u05DF \u05D7\u05D5\u05E8\u05E3 \u05E7\u05E8 \u05D9\u05E9 \u05D1\u05D7\u05D5\u05E8\u05E3 \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D9\u05E2\u05D5\u05E8 \u05D7\u05D5\u05DC\u05D9\u05DD."],a:3,e:"\u05D0\u05DD \u05D2\u05DD \u05D1\u05D0\u05E7\u05DC\u05D9\u05DD \u05D7\u05DD \u05D9\u05E9 \u05D9\u05D5\u05EA\u05E8 \u05D7\u05D5\u05DC\u05D9\u05DD \u05D1\u05D7\u05D5\u05E8\u05E3, \u05D4\u05D4\u05E1\u05D1\u05E8 \u05E9\u05DC \u05D4\u05E7\u05D5\u05E8 \u05E0\u05D7\u05DC\u05E9; \u05D9\u05D9\u05EA\u05DB\u05DF \u05E9\u05D4\u05E1\u05D9\u05D1\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05EA\u05E7\u05D4\u05DC\u05D5\u05EA \u05D1\u05D7\u05DC\u05DC\u05D9\u05DD \u05E1\u05D2\u05D5\u05E8\u05D9\u05DD \u05D0\u05D5 \u05D2\u05D5\u05E8\u05DD \u05D0\u05D7\u05E8.",w:["\u05D0\u05D9\u05DF \u05DB\u05D0\u05DF \u05E0\u05EA\u05D5\u05DF \u05E9\u05DE\u05D7\u05DC\u05D9\u05E9 \u05D0\u05EA \u05D4\u05E7\u05E9\u05E8.","\u05D6\u05D4 \u05D0\u05D9\u05E0\u05D5 \u05E7\u05E9\u05D5\u05E8 \u05DC\u05E9\u05D9\u05E2\u05D5\u05E8 \u05D4\u05D7\u05D5\u05DC\u05D9\u05DD.","\u05D0\u05D9\u05DF \u05D1\u05DB\u05DA \u05E9\u05DC\u05D9\u05DC\u05D4 \u05E9\u05DC \u05E7\u05E9\u05E8 \u05DC\u05E7\u05D5\u05E8.",""]},{id:"v2-12",t:"\u05D4\u05E9\u05DC\u05DE\u05EA \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD",q:"\u05D4\u05DB\u05EA\u05D1\u05D4 \u05D4\u05E6\u05D9\u05D2\u05D4 \u05D0\u05EA \u05D4\u05D3\u05E2\u05D5\u05EA \u05E9\u05DC \u05E9\u05E0\u05D9 \u05D4\u05E6\u05D3\u05D3\u05D9\u05DD \u05D5\u05DC\u05D0 \u05D4\u05DB\u05E8\u05D9\u05E2\u05D4 \u05D1\u05D9\u05E0\u05D9\u05D4\u05DD. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05D0\u05E8 \u05D0\u05EA \u05E2\u05DE\u05D3\u05EA \u05D4\u05DB\u05EA\u05D1\u05D4 \u05DB____.",o:["\u05EA\u05D5\u05E7\u05E4\u05E0\u05D9\u05EA","\u05E0\u05DC\u05D4\u05D1\u05EA","\u05DE\u05D8\u05E2\u05D4","\u05E0\u05D9\u05D8\u05E8\u05DC\u05D9\u05EA"],a:3,e:"\u05DB\u05E9\u05DB\u05EA\u05D1\u05D4 \u05DE\u05E6\u05D9\u05D2\u05D4 \u05E6\u05D3\u05D3\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05D4\u05DB\u05E8\u05D9\u05E2, \u05E2\u05DE\u05D3\u05EA\u05D4 \u05E0\u05D9\u05D8\u05E8\u05DC\u05D9\u05EA.",w:["\u05EA\u05D5\u05E7\u05E4\u05E0\u05D5\u05EA \u05DE\u05EA\u05D0\u05E8\u05EA \u05D4\u05EA\u05E7\u05E4\u05D4 \u05E2\u05DC \u05E6\u05D3, \u05D5\u05DC\u05D0 \u05D4\u05E6\u05D2\u05D4 \u05DC\u05DC\u05D0 \u05D4\u05DB\u05E8\u05E2\u05D4.","\u05D4\u05EA\u05DC\u05D4\u05D1\u05D5\u05EA \u05DE\u05EA\u05D0\u05E8\u05EA \u05EA\u05DE\u05D9\u05DB\u05D4 \u05E0\u05DE\u05E8\u05E6\u05EA \u05E9\u05D0\u05D9\u05E0\u05D4 \u05DE\u05D5\u05E4\u05D9\u05E2\u05D4 \u05DB\u05D0\u05DF.","\u05D0\u05D9\u05DF \u05D1\u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05D0\u05D9\u05E0\u05D3\u05D9\u05E7\u05E6\u05D9\u05D4 \u05E9\u05D4\u05DB\u05EA\u05D1\u05D4 \u05DE\u05D8\u05E2\u05D4.",""]},{id:"v2-13",t:"\u05D7\u05D9\u05D6\u05D5\u05E7 \u05D5\u05D4\u05D7\u05DC\u05E9\u05D4",q:"\u05D7\u05D1\u05E8\u05D4 \u05D4\u05DB\u05E8\u05D9\u05D6\u05D4: \u05DE\u05D9 \u05E9\u05DC\u05DE\u05D3 \u05D1\u05E7\u05D5\u05E8\u05E1 \u05E9\u05DC\u05E0\u05D5 \u05D9\u05E2\u05D1\u05D5\u05D3 \u05D1\u05EA\u05D5\u05DA \u05D7\u05E6\u05D9 \u05E9\u05E0\u05D4. \u05D1\u05E4\u05E8\u05E1\u05D5\u05DD \u05DE\u05D5\u05E6\u05D2\u05D9\u05DD \u05E9\u05DC\u05D5\u05E9\u05D4 \u05D1\u05D5\u05D2\u05E8\u05D9\u05DD \u05E9\u05E7\u05D9\u05D1\u05DC\u05D5 \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05E7\u05D5\u05E8\u05E1. \u05D0\u05D9\u05D6\u05D5 \u05D8\u05E2\u05E0\u05D4 \u05DE\u05D7\u05DC\u05D9\u05E9\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05D0\u05EA \u05D4\u05DE\u05E1\u05E7\u05E0\u05D4 \u05E9\u05D4\u05E7\u05D5\u05E8\u05E1 \u05DE\u05D5\u05D1\u05D9\u05DC \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4?",o:["\u05D4\u05E7\u05D5\u05E8\u05E1 \u05DE\u05EA\u05E7\u05D9\u05D9\u05DD \u05E4\u05E2\u05DE\u05D9\u05D9\u05DD \u05D1\u05E9\u05E0\u05D4.","\u05D4\u05E7\u05D5\u05E8\u05E1 \u05E0\u05DE\u05E9\u05DA \u05D0\u05E8\u05D1\u05E2\u05D4 \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD.","\u05E9\u05DC\u05D5\u05E9\u05EA \u05D4\u05D1\u05D5\u05D2\u05E8\u05D9\u05DD \u05E7\u05D9\u05D1\u05DC\u05D5 \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D1\u05E9\u05DC\u05D5\u05E9 \u05D7\u05D1\u05E8\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA.","\u05D4\u05D1\u05D5\u05D2\u05E8\u05D9\u05DD \u05E9\u05D4\u05D5\u05E6\u05D2\u05D5 \u05E0\u05D1\u05D7\u05E8\u05D5 \u05DE\u05EA\u05D5\u05DA \u05DE\u05D0\u05D5\u05EA \u05D1\u05D5\u05D2\u05E8\u05D9\u05DD, \u05D5\u05E8\u05D5\u05D1\u05DD \u05DC\u05D0 \u05DE\u05E6\u05D0\u05D5 \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D1\u05EA\u05D7\u05D5\u05DD."],a:3,e:"\u05D4\u05E4\u05E8\u05E1\u05D5\u05DD \u05DE\u05E6\u05D9\u05D2 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DE\u05E7\u05E8\u05D4. \u05D0\u05DD \u05D4\u05DF \u05D0\u05D9\u05E0\u05DF \u05DE\u05D9\u05D9\u05E6\u05D2\u05D5\u05EA, \u05D4\u05DE\u05E1\u05E7\u05E0\u05D4 \u05E2\u05DC \u05D4\u05E7\u05D5\u05E8\u05E1 \u05DB\u05D5\u05DC\u05D5 \u05E0\u05D7\u05DC\u05E9\u05EA.",w:["\u05EA\u05D3\u05D9\u05E8\u05D5\u05EA \u05D4\u05E7\u05D5\u05E8\u05E1 \u05D0\u05D9\u05E0\u05D4 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05DE\u05E1\u05E7\u05E0\u05D4.","\u05DE\u05E9\u05DA \u05D4\u05E7\u05D5\u05E8\u05E1 \u05D0\u05D9\u05E0\u05D5 \u05DE\u05E9\u05E4\u05D9\u05E2 \u05E2\u05DC \u05D4\u05E9\u05D0\u05DC\u05 u05DF \u05DE\u05D9 \u05E9\u05DE\u05D9\u05D9\u05E6\u05E8 \u05DC\u05DE\u05D5\u05E6\u05E8 \u05E9\u05DC\u05D5.","\u05D6\u05D4 \u05D9\u05D7\u05E1 \u05D1\u05D9\u05DF \u05D7\u05E4\u05E5 \u05DC\u05DE\u05E7\u05D5\u05DD \u05D0\u05D7\u05E1\u05D5\u05E0\u05D5."],stem:"\u05D6\u05E8\u05E2 : \u05E6\u05DE\u05D7"}],rs:[{id:"prs-1",t:"\u05D4\u05E1\u05E7\u05D4 \u05DE\u05D8\u05E7\u05E1\u05D8",q:"\u05E1\u05D5\u05DB\u05E0\u05D5\u05EA \u05E0\u05E1\u05D9\u05E2\u05D5\u05EA \u05E4\u05E8\u05E1\u05DE\u05D4: 80% \u05DE\u05D4\u05DC\u05E7\u05D5\u05D7\u05D5\u05EA \u05E9\u05DC\u05E0\u05D5 \u05DE\u05E8\u05D5\u05E6\u05D9\u05DD \u05DE\u05D0\u05D5\u05D3. \u05D1\u05E1\u05E7\u05E8 \u05D4\u05E9\u05EA\u05EA\u05E4\u05D5 \u05E8\u05E7 \u05DC\u05E7\u05D5\u05D7\u05D5\u05EA \u05E9\u05D4\u05D6\u05DE\u05D9\u05E0\u05D5 \u05D7\u05D1\u05D9\u05DC\u05EA \u05E0\u05D5\u05E4\u05E9 \u05D9\u05D5\u05E7\u05E8\u05EA\u05D9\u05EA. \u05DE\u05D3\u05D5\u05E2 \u05D4\u05DE\u05E1\u05E7\u05E0\u05D4 \u05E2\u05DC \u05E9\u05D1\u05D9\u05E2\u05D5\u05EA \u05D4\u05E8\u05E6\u05D5\u05DF \u05E9\u05DC \u05DB\u05DC\u05DC \u05D4\u05DC\u05E7\u05D5\u05D7\u05D5\u05EA \u05E2\u05DC\u05D5\u05DC\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D2\u05D5\u05D9\u05D4?",o:["80% \u05D4\u05D5\u05D0 \u05D0\u05D7\u05D5\u05D6 \u05E0\u05DE\u05D5\u05DA \u05DE\u05D3\u05D9.","\u05D4\u05DC\u05E7\u05D5\u05D7\u05D5\u05EA \u05E9\u05E0\u05D1\u05D7\u05E8\u05D5 \u05D0\u05D9\u05E0\u05DD \u05DE\u05D9\u05D9\u05E6\u05D2\u05D9\u05DD \u05D0\u05EA \u05DB\u05DC\u05DC \u05D4\u05DC\u05E7\u05D5\u05D7\u05D5\u05EA.","\u05D4\u05DC\u05E7\u05D5\u05D7\u05D5\u05EA \u05DC\u05D0 \u05E0\u05E9\u05D0\u05DC\u05D5 \u05D1\u05D8\u05DC\u05E4\u05D5\u05DF.","\u05D4\u05E1\u05D5\u05DB\u05E0\u05D5\u05EA \u05DE\u05E4\u05E8\u05E1\u05DE\u05EA \u05D4\u05E8\u05D1\u05D4."],a:1,e:"\u05D4\u05DE\u05D3\u05D2\u05DD \u05DB\u05DC\u05DC \u05E7\u05D1\u05D5\u05E6\u05D4 \u05DE\u05D9\u05D5\u05D7\u05D3\u05EA \u05D5\u05DC\u05DB\u05DF \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05DB\u05DC\u05D9\u05DC \u05DE\u05DE\u05E0\u05 D \u05E9\u05D0\u05D9\u05DF \u05DC\u05D4\u05DD \u05E4\u05E8\u05E9\u05E0\u05D5\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA \u05D4\u05DD \u05D7\u05D3\u05BE\u05DE\u05E9\u05DE\u05E2\u05D9\u05D9\u05DD.",w:["","\u05E2\u05DE\u05D5\u05DD \u05D4\u05D5\u05D0 \u05D4\u05D4\u05E4\u05DA \u05DE\u05D1\u05E8\u05D5\u05E8.","\u05DE\u05E1\u05EA\u05D5\u05E8\u05D9 \u05E1\u05D5\u05EA\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E9\u05D8\u05D5\u05EA.","\u05D0\u05D5\u05E8\u05DA \u05D0\u05D9\u05E0\u05D5 \u05DE\u05EA\u05D9\u05D9\u05E9\u05D1 \u05E2\u05DD '\u05D1\u05E8\u05D5\u05E8\u05D9\u05DD \u05D5\u05E4\u05E9\u05D5\u05D8\u05D9\u05DD'."]},{id:"prs-8",t:"\u05D4\u05E1\u05E7\u05D4 \u05DE\u05D8\u05E7\u05E1\u05D8",q:"\u05D1\u05E2\u05D9\u05E8 \u05DE\u05E1\u05D5\u05D9\u05DE\u05EA \u05D9\u05E8\u05D3 \u05DE\u05E1\u05E4\u05E8 \u05EA\u05D0\u05D5\u05E0\u05D5\u05EA \u05D4\u05D3\u05E8\u05DB\u05D9\u05DD \u05D1-20% \u05D0\u05D7\u05E8\u05D9 \u05D4\u05EA\u05E7\u05E0\u05EA \u05DE\u05E6\u05DC\u05DE\u05D5\u05EA \u05D0\u05DB\u05D9\u05E4\u05D4. \u05E2\u05D9\u05EA\u05D5\u05E0\u05D0\u05D9 \u05DE\u05E1\u05D9\u05E7 \u05E9\u05D4\u05DE\u05E6\u05DC\u05DE\u05D5\u05EA \u05D4\u05DF \u05D4\u05E1\u05D9\u05D1\u05D4 \u05DC\u05D9\u05E8\u05D9\u05D3\u05D4. \u05D0\u05D9\u05D6\u05D5 \u05E9\u05D0\u05DC\u05D4 \u05D7\u05E9\u05D5\u05D1 \u05DC\u05E9\u05D0\u05D5\u05DC \u05DB\u05D3\u05D9 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D0\u05EA \u05D4\u05DE\u05E1\u05E7\u05E0\u05D4?",o:["\u05D4\u05D0\u05DD \u05D1\u05DE\u05E7\u05D1\u05D9\u05DC \u05D7\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05E8, \u05DB\u05DE\u05D5 \u05D4\u05D2\u05D1\u05DC\u05EA \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D0\u05D5 \u05E1\u05D2\u05D9\u05E8\u05EA \u05DB\u05D1\u05D9\u05E9\u05D9\u05DD?","\u05D0\u05D9\u05E4\u05D4 \u05D9\u05D5\u05E6\u05E8\u05D5 \u05D4\u05DE\u05E6\u05DC\u05DE\u05D5\u05EA?","\u05DE\u05D9 \u05D4\u05E6\u05D9\u05E2 \u05DC\u05D4\u05EA\u05E7\u05D9\u05DF \u05D0\u05EA \u05D4\u05DE\u05E6\u05DC\u05DE\u05D5\u05EA?","\u05DB\u05DE\u05D4 \u05E2\u05DC\u05D5 \u05D4\u05DE\u05E6\u  \u05E2\u05DC \u05D7\u05E4\u05E5 \u05E0\u05EA\u05E4\u05E1 \u05DB\u05D4\u05E4\u05E1\u05D3, \u05D5\u05D4\u05D4\u05E4\u05E1\u05D3 \u05DB\u05D5\u05D0\u05D1 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D4\u05E8\u05D5\u05D5\u05D7 \u05E9\u05D1\u05E4\u05D9\u05E0\u05D5\u05D9 \u05DE\u05E7\u05D5\u05DD. \u05D4\u05D4\u05E1\u05D1\u05E8 \u05D4\u05E9\u05DC\u05D9\u05E9\u05D9 \u05D4\u05D5\u05D0 \u05E8\u05D2\u05E9\u05D9: \u05D7\u05E4\u05E6\u05D9\u05DD \u05DE\u05D6\u05DB\u05D9\u05E8\u05D9\u05DD \u05D0\u05D9\u05E8\u05D5\u05E2\u05D9\u05DD \u05D5\u05D0\u05E0\u05E9\u05D9\u05DD, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D5\u05D5\u05D9\u05EA\u05D5\u05E8 \u05E2\u05DC\u05D9\u05D4\u05DD \u05DE\u05E8\u05D2\u05D9\u05E9 \u05DB\u05D5\u05D5\u05D9\u05EA\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E2\u05E6\u05DE\u05D5. \u05DE\u05D5\u05DE\u05D7\u05D9\u05DD \u05DC\u05D0\u05E8\u05D2\u05D5\u05DF \u05D4\u05D1\u05D9\u05EA \u05DE\u05DE\u05DC\u05D9\u05E6\u05D9\u05DD \u05DC\u05E9\u05D0\u05D5\u05DC \u05DC\u05D2\u05D1\u05D9 \u05DB\u05DC \u05E4\u05E8\u05D9\u05D8 \u05D0\u05DD \u05D4\u05D9\u05D4 \u05E0\u05E8\u05DB\u05E9 \u05E9\u05D5\u05D1 \u05D4\u05D9\u05D5\u05DD. \u05DE\u05D9 \u05E9\u05E2\u05D5\u05E0\u05D4 \u05D1\u05E9\u05DC\u05D9\u05DC\u05D4, \u05DE\u05D5\u05D8\u05D1 \u05E9\u05D9\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC\u05D9\u05D5, \u05D5\u05D0\u05DD \u05D4\u05D5\u05D0 \u05E1\u05E0\u05D8\u05D9\u05DE\u05E0\u05D8\u05DC\u05D9, \u05D9\u05E9\u05DE\u05D5\u05E8 \u05EA\u05E6\u05DC\u05D5\u05DD \u05E9\u05DC\u05D5 \u05D1\u05DE\u05E7\u05D5\u05DD \u05D0\u05EA \u05D4\u05D7\u05E4\u05E5."},{id:"cn",title:"Cities and noise",text:"Researchers who study urban life have long known that noise affects health, but a recent project measured the effect more precisely. For two years they placed small sensors on streets in a large city and compared the sound levels with local hospital records. They found that people who lived near the loudest roads visited doctors more often for sleep problems and high blood pressure. The authors p u05DC\u05D5\u05EA. \u05D0\u05DD \u05E0\u05E9\u05D0\u05E8\u05D5 \u05E9\u05E0\u05D9\u05D5\u05EA, \u05E0\u05D7\u05E9\u05D5.","\u05DC\u05E4\u05E0\u05D9 \u05E0\u05D9\u05D7\u05D5\u05E9 \u05E0\u05E1\u05D5 \u05DC\u05E4\u05E1\u05D5\u05DC \u05E9\u05EA\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA. \u05D6\u05D4 \u05DE\u05DB\u05E4\u05D9\u05DC \u05D0\u05EA \u05E1\u05D9\u05DB\u05D5\u05D9 \u05D4\u05E0\u05D9\u05D7\u05D5\u05E9 \u05DE\u05BE25% \u05DC\u05BE50%.","\u05E1\u05D3\u05E8 \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05D1\u05DB\u05DC \u05E1\u05D5\u05D2 \u05E2\u05D5\u05DC\u05D4 \u05D1\u05E7\u05D5\u05E9\u05D9, \u05D5\u05DC\u05DB\u05DF \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D5\u05EA \u05D1\u05DB\u05DC \u05E1\u05D5\u05D2 \u05D4\u05DF \u05D4\u05E7\u05E9\u05D5\u05EA. \u05D0\u05DC \u05EA\u05E9\u05E7\u05D9\u05E2\u05D5 \u05E9\u05DC\u05D5\u05E9 \u05D3\u05E7\u05D5\u05EA \u05D1\u05E9\u05D0\u05DC\u05D4 \u05D0\u05D7\u05EA."]},{title:"\u05D0\u05E0\u05DC\u05D5\u05D2\u05D9\u05D5\u05EA",items:["\u05E9\u05DC\u05D1 \u05E8\u05D0\u05E9\u05D5\u05DF: \u05E0\u05E1\u05D7\u05D5 \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D0\u05EA \u05D4\u05D9\u05D7\u05E1 \u05D1\u05D9\u05DF \u05E9\u05EA\u05D9 \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D4\u05DE\u05D5\u05D3\u05D2\u05E9\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D0\u05EA\u05DD \u05E7\u05D5\u05E8\u05D0\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA.","\u05D0\u05DD \u05DB\u05DE\u05D4 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05DE\u05EA\u05D0\u05D9\u05DE\u05D5\u05EA, \u05D3\u05D9\u05D9\u05E7\u05D5 \u05D0\u05EA \u05D4\u05DE\u05E9\u05E4\u05D8: \u05D4\u05D5\u05E1\u05D9\u05E4\u05D5 \u05DB\u05D9\u05D5\u05D5\u05DF (\u05DE\u05D9 \u05DC\u05E4\u05E0\u05D9 \u05DE\u05D9) \u05D5\u05EA\u05DB\u05D5\u05E0\u05D4 (\u05E2\u05D5\u05E6\u05DE\u05D4, \u05EA\u05E4\u05E7\u05D9\u05D3).","\u05D4\u05DB\u05D9\u05D5\u05D5\u05DF \u05D7\u05E9\u05D5\u05D1. \u05D7\u05DC\u05E7 \u05D5\u05DE\u05DB\u05DC\u05D5\u05DC \u05D0\u05D9\u05E0\u05D5 \u05DE\u05DB\u05DC\u05D5\u05DC \u05D5\u05D7\u05DC\u05E7.","\u05E4\u05E1\u05DC\u05D5 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E9\u05D9\u05E9 \u05D1\u05D4\u05DF \u05D9\u05D7\u05E1 \u05DE\u05E7\u05D5\u05E8\u05D1 \u05D0\u05D1\u05DC \u05DC\u05D0 \u05D6\u05D4\u05D4, \u05DC\u05DE\u05E9\u05DC \u05EA\u05D5\u05E6\u05D0\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05E1\u05D9\u05D1\u05D4.","\u05DE\u05D9\u05DC\u05D4 \u05DC\u05D0 \u05DE\u05D5\u05DB\u05E8\u05EA: \u05D7\u05E4\u05E9\u05D5 \u05D1\u05D4 \u05E9\u05D5\u05E8\u05E9 \u05D0\u05D5 \u05DE\u05D9\u05DC\u05D4 \u05E7\u05E8\u05D5\u05D1\u05D4. \u05D0\u05DD \u05DC\u05D0 \u05DE\u05E6\u05DC\u05D9\u05D7\u05D9\u05DD, \u05E4\u05E1\u05DC\u05D5 \u05DC\u05E4\u05D9 \u05E9\u05D0\u05E8 \u05D4\u05D6\u05D5\u05D2\u05D5\u05EA."]},{title:"\u05D4\u05D1\u05E0\u05D4 \u05D5\u05D4\u05E1\u05E7\u05D4",items:["\u05D0\u05DC \u05EA\u05D5\u05E1\u05D9\u05E4\u05D5 \u05DE\u05D9\u05D3\u05E2. \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05E0\u05D0\u05DE\u05E8 \u05D1\u05D8\u05E7\u05E1\u05D8 \u05D0\u05D9\u05E0\u05D5 \u05E0\u05D5\u05D1\u05E2 \u05DE\u05DE\u05E0\u05D5.","\u05E9\u05D0\u05DC\u05D5\u05EA \u05D7\u05D9\u05D6\u05D5\u05E7 \u05D5\u05D4\u05D7\u05DC\u05E9\u05D4: \u05D6\u05D4\u05D5 \u05E7\u05D5\u05D3\u05DD \u05DE\u05D4 \u05D4\u05D8\u05E2\u05E0\u05D4 \u05D5\u05DE\u05D4 \u05D4\u05D4\u05E0\u05D7\u05D4. \u05D4\u05D7\u05DC\u05E9\u05D4 \u05E0\u05D5\u05D2\u05E2\u05EA \u05D1\u05D4\u05E0\u05D7\u05D4 \u05D0\u05D5 \u05DE\u05E6\u05D9\u05E2\u05D4 \u05D4\u05E1\u05D1\u05E8 \u05D7\u05DC\u05D5\u05E4\u05D9.","\u05E7\u05D5\u05E8\u05DC\u05E6\u05D9\u05D4 \u05D0\u05D9\u05E0\u05D4 \u05E1\u05D9\u05D1\u05EA\u05D9\u05D5\u05EA. \u05D7\u05E4\u05E9\u05D5 \u05D2\u05D5\u05E8\u05DD \u05E9\u05DC\u05D9\u05E9\u05D9 \u05D0\u05D5 \u05D4\u05D9\u05E4\u05D5\u05DA \u05DB\u05D9\u05D5\u05D5\u05DF.","\u05D1\u05E9\u05D0\u05DC\u05D5\u05EA \u05D4\u05E9\u05DC\u05DE\u05D4 \u05E7\u05E8\u05D0\u05D5 \u05D0\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05DE\u05E7\u05E9\u05E8\u05D5\u05EA (\u05D0\u05D1\u05DC, \u05D5\u05D0\u05D9\u05DC\u05D5, \u05DC\u05DB\u05DF, \u05D0\u05E3 \u05E2\u05DC \u05E4\u05D9). \u05D4\u05DF \u05E7\u05D5\u05D1\u05E2\u05D5\u05EA \u05D0\u05DD \u05D4\u05E6\u05D3 \u05D4\u05E9\u05E0\u05D9 \u05D3\u05D5\u05DE\u05D4 \u05D0\u05D5 \u05D4\u05E4\u05D5\u05DA.","\u05D1\u05E9\u05D0\u05DC\u05D5\u05EA \u05DC\u05D5\u05D2\u05D9\u05D5\u05EA \u05DB\u05EA\u05D1\u05D5 \u05E1\u05D9\u05DE\u05E0\u05D9\u05DD: \u05DB\u05DC = \u05EA\u05E0\u05D0\u05D9, \u05DC\u05D0 \u05E0\u05D5\u05D1\u05E2 \u05DE\u05D4\u05D4\u05D9\u05E4\u05D5\u05DA. \u05E9\u05DC\u05D9\u05DC\u05EA \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05DE\u05D5\u05D1\u05D9\u05DC\u05D4 \u05DC\u05E9\u05DC\u05D9\u05DC\u05EA \u05D4\u05EA\u05E0\u05D0\u05D9."]},{title:"\u05D4\u05D1\u05E0\u05EA \u05D4\u05E0\u05E7\u05E8\u05D0",items:["\u05E7\u05E8\u05D0\u05D5 \u05E7\u05D5\u05D3\u05DD \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA, \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D0\u05EA \u05D4\u05E7\u05D8\u05E2, \u05DB\u05D3\u05D9 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D4 \u05DC\u05D7\u05E4\u05E9. \u05D0\u05DD \u05D6\u05D4 \u05DC\u05D0 \u05DE\u05EA\u05D0\u05D9\u05DD \u05DC\u05DB\u05DD, \u05E7\u05E8\u05D0\u05D5 \u05D0\u05EA \u05D4\u05E7\u05D8\u05E2 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA \u05D1\u05E8\u05E6\u05E3 \u05D5\u05D1\u05D3\u05E7\u05D5 \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05DC\u05E4\u05D9 \u05D4\u05E1\u05D3\u05E8.","\u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05DE\u05E1\u05D5\u05D3\u05E8\u05D5\u05EA \u05DC\u05E4\u05D9 \u05E1\u05D3\u05E8 \u05D4\u05D5\u05E4\u05E2\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0 \u05D1\u05E7\u05D8\u05E2, \u05D5\u05DC\u05DB\u05DF \u05D4\u05E4\u05EA\u05E8\u05D5\u05DF \u05D9\u05EA\u05E7\u05D3\u05DD \u05D1\u05E7\u05D8\u05E2.","\u05D7\u05E4\u05E9\u05D5 \u05D1\u05E7\u05D8\u05E2 \u05DE\u05E9\u05E4\u05D8 \u05E9\u05DE\u05D5\u05DB\u05D9\u05D7 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4. \u05D0\u05DD \u05D0\u05D9\u05DF, \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05E0\u05E8\u05D0\u05D4 \u05E9\u05D2\u05D5\u05D9\u05D4.","\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E2\u05DD \u05DE\u05D9\u05DC\u05D9\u05DD \u05DB\u05DE\u05D5 \u05EA\u05DE\u05D9\u05D3, \u05D0\u05E3 \u05E4\u05E2\u05DD, \u05E8\u05E7 \u05D5\u05D1\u05D5\u05D5\u05D3\u05D0\u05D5\u05EA \u05D7\u05E9\u05D5\u05D3\u05D5\u05EA, \u05D0\u05DC\u05D0 \u05D0\u05DD \u05D4\u05E7\u05D8\u05E2 \u05D0\u05D5\u05DE\u05E8 \u05DB\u05DA \u05D1\u05DE\u05E4\u05D5\u05E8\u05E9.","\u05E9\u05D0\u05DC\u05D5\u05EA \u05DE\u05D9\u05DC\u05D4 \u05D1\u05D4\u05E7\u05E9\u05E8: \u05D4\u05E6\u05D9\u05D1\u05D5 \u05D0\u05EA \u05D4\u05DE\u05D9\u05DC\u05D4 \u05D4\u05D7\u05DC\u05D5\u05E4\u05D9\u05EA \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D5\u05E8\u05D0\u05D5 \u05D0\u05DD \u05D4\u05DE\u05E9\u05E4\u05D8 \u05E9\u05D5\u05DE\u05E8 \u05E2\u05DC \u05DE\u05E9\u05DE\u05E2\u05D5\u05EA\u05D5."]},{title:"\u05DE\u05D8\u05DC\u05EA \u05D4\u05DB\u05EA\u05D9\u05D1\u05D4",items:["\u05DE\u05E9\u05DA \u05D4\u05DE\u05D8\u05DC\u05D4 30 \u05D3\u05E7\u05D5\u05EA \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA. \u05EA\u05E7\u05E6\u05D1\u05D5 5 \u05D3\u05E7\u05D5\u05EA \u05DC\u05EA\u05DB\u05E0\u05D5\u05DF, 20 \u05DC\u05DB\u05EA\u05D9\u05D1\u05D4 \u05D5\u05BE5 \u05DC\u05E2\u05E8\u05D9\u05DB\u05D4.","\u05DE\u05D1\u05E0\u05D4 \u05DE\u05D5\u05DE\u05DC\u05E5: \u05E4\u05EA\u05D9\u05D7\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05E2\u05DD \u05E2\u05DE\u05D3\u05D4, \u05E9\u05EA\u05D9 \u05E2\u05D3 \u05E9\u05DC\u05D5\u05E9 \u05E4\u05E1\u05E7\u05D0\u05D5\u05EA \u05E0\u05D9\u05DE\u05D5\u05E7, \u05DB\u05DC \u05D0\u05D7\u05EA \u05E2\u05DD \u05D3\u05D5\u05D2\u05DE\u05D4, \u05D5\u05E1\u05D9\u05D5\u05DD \u05E7\u05E6\u05E8.","\u05DE\u05D0\u05DC\u05F4\u05D5 \u05DE\u05E2\u05E8\u05D9\u05DB\u05D4 \u05D0\u05EA \u05D4\u05EA\u05D5\u05DB\u05DF (\u05E8\u05DC\u05D5\u05D5\u05E0\u05D8\u05D9\u05D5\u05EA, \u05D1\u05D9\u05E1\u05D5\u05E1, \u05D7\u05E9\u05D9\u05D1\u05D4 \u05D1\u05D9\u05E7\u05D5\u05E8\u05EA\u05D9\u05EA, \u05D0\u05E8\u05D2\u05D5\u05DF) \u05D5\u05D0\u05EA \u05D4\u05DC\u05E9\u05D5\u05DF (\u05D1\u05D4\u05D9\u05E8\u05D5\u05EA, \u05E1\u05D2\u05E0\u05D5\u05DF \u05E2\u05D9\u05D5\u05
