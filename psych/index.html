a collection.","","avoids does not fit: a museum with a remarkable collection does not avoid it."],en:!0},{id:"en02",t:"Sentence completion",q:"The manager asked the staff to be ______ about the changes, because the plan was not yet public.",o:["careless","noisy","discreet","generous"],a:2,e:"discreet פירושו זהיר ושומר סוד, וזה מתאים לתוכנית שעדיין לא פורסמה.",w:["careless would risk revealing the plan.","noisy contradicts keeping a plan private.","","generous does not fit the idea of secrecy."],en:!0},{id:"en03",t:"Sentence completion",q:"Because the instructions were so ______, many users were unable to install the program without help.",o:["confusing","clear","helpful","short"],a:0,e:"'Because' דורש סיבה להצלחה חלקית: הוראות מבלבלות.",w:["","clear would not explain the difficulty.","helpful contradicts the users needing help.","short is not by itself the reason for failure; the sentence needs a quality that causes confusion."],en:!0},{id:"en04",t:"Sentence completion",q:"The scientist was ______ by her colleagues for her honesty, even when her results disproved her own theory.",o:["blamed","mocked","ignored","admired"],a:3,e:"הכנות מעוררת הערכה, ולכן admired.",w:["blamed does not fit praise for honesty.","mocked contradicts the positive context.","ignored does not fit the focus on honesty.",""],en:!0},{id:"en05",t:"Sentence completion",q:"Not only ______ the road closed, but the bridge was also damaged.",o:["was","be","is","were"],a:0,e:"אחרי 'Not only' בא היפוך נושא ופועל: 'was the road closed'. הנושא road ביחיד, בעבר.",w:["","be does not fit the structure.","the sentence is in the past.","road is singular, so 'was' is needed."],en:!0},{id:"en06",t:"Sentence completion",q:"She would have joined us if she ______ the invitation earlier.",o:["received","has received","would receive","had received"],a:3,e:"תנאי מסוג 3: would have + past participle בתוצאה, ו-had + past participle בתנאי.",w:["conditional type 3 requires the past perfect.","present perfect does not fit past unreal condition.","'would' does not appear after 'if' in this structure.",""],en:!0},{id:"en07",t:"Restatement",q:"Despite the heavy rain, the match was not cancelled.",o:["The rain stopped before the match was cancelled.","The match was cancelled, but the rain was light.","The match took place even though it rained heavily.","The match was cancelled because of the rain."],a:2,e:"Despite = למרות. המשחק לא בוטל, ולכן הוא התקיים.",w:["It adds an event that is not in the original.","It changes both facts.","","This is the opposite of the original."],en:!0},{id:"en08",t:"Restatement",q:"Few people attended the lecture, which surprised the organizers.",o:["Many people attended the lecture.","The organizers expected a small audience.","The lecture surprised many people.","The organizers were surprised that the audience was small."],a:3,e:"Few people = קהל קטן, וההפתעה היא של המארגנים.",w:["'Few' means almost none.","They were surprised, so they did not expect a small audience.","The surprise belongs to the organizers.",""],en:!0},{id:"en09",t:"Restatement",q:"Unless you hurry, you will miss the train.",o:["You will miss the train because you hurried.","If you do not hurry, you will miss the train.","You will hurry and miss the train.","If you hurry, you will miss the train."],a:1,e:"Unless = אם לא.",w:["Unless does not express a cause like this.","","It changes the structure of the condition.","This reverses the condition."],en:!0},{id:"en10",t:"Reading comprehension",q:"What is the main idea of the passage?",o:["Trees cause air pollution.","Noise in cities is linked to health problems, but other factors may also be involved.","People who live near roads are doctors.","Noise sensors are expensive."],a:1,e:"הקטע מתאר קשר בין רעש לבעיות בריאות ומסייג שייתכנו גורמים נוספים.",w:["The passage says trees could help.","","This is a misreading of the hospital records.","Cost is not mentioned."],p:"cn",en:!0},{id:"en11",t:"Reading comprehension",q:"According to the passage, why might noise not be the only cause of health problems?",o:["Busy roads also cause air pollution.","The sensors were not accurate.","The study lasted only two years.","People visit doctors for many reasons."],a:0,e:"הקטע אומר שכבישים עמוסים מביאים גם זיהום אוויר.",w:["","The passage does not question the sensors.","Length is not given as a reason.","This is not said in the passage."],p:"cn",en:!0},{id:"en12",t:"Reading comprehension",q:"What do the authors suggest?",o:["Moving hospitals away from roads.","Planting trees and lowering speed limits may help with both noise and air pollution.","Ignoring noise measurements.","Building more roads."],a:1,e:"ההצעה היא עצים והגבלת מהירות, והיא תטפל בשתי הבעיות.",w:["Not suggested.","","The authors rely on them.","Not suggested."],p:"cn",en:!0}],passages:[{id:"pl",title:"אפקט הפלצבו",text:"אפקט הפלצבו מוכר ברפואה כבר עשרות שנים: חולים שקיבלו כדור ללא חומר פעיל, אך האמינו שהם מקבלים תרופה, דיווחו לא פעם על הקלה של ממש בתסמינים. בעבר נהגו לראות בתופעה מעין דמיון שאינו ראוי לעניין רציני. מחקרים מהשנים האחרונות מצביעים על כך שהגוף עצמו מגיב לציפייה: כאשר אדם מצפה להקלה, מערכות במוח משחררות חומרים שמפחיתים כאב. עם זאת, ההשפעה אינה שווה בכל המצבים. היא בולטת בכאב, בבחילות ובחרדה, וכמעט נעדרת במחלות שאפשר למדוד בהן שינוי חיצוני, כמו גודלו של גידול. נוסף על כך, גם צורת המתן משנה: זריקה נתפסת כחזקה יותר מכדור, וכדור יקר נתפס כיעיל יותר מכדור זול. חוקרים מזהירים שאין להסיק מכך שאפשר להחליף טיפול רפואי באמונה, אלא שיש לתכנן ניסויים בקפידה כדי להפריד בין השפעת התרופה להשפעת הציפייה."},{id:"uh",title:"אי חום עירוני",text:"ביום קיץ חם הטמפרטורה במרכז עיר גדולה גבוהה לא פעם בכמה מעלות מזו שבשטחים הפתוחים שמחוצה לה. התופעה מכונה אי חום עירוני. הסיבה הראשונה היא החומרים: אספלט ובטון סופגים חום במשך היום ופולטים אותו אל האוויר גם בערב, ואילו אדמה וצמחייה סופגים פחות חום. הסיבה השנייה היא היעדר צמחייה: עצים לא רק מטילים צל, אלא גם מקררים את האוויר בתהליך של התאדות מים. הסיבה השלישית היא החום שנפלט ממכוניות, ממזגנים ומבנייני משרדים. מתכננים עירוניים מציעים לצבוע גגות בצבע בהיר, לשתול עצים ולהקים גינות על גגות. אולם פתרונות אלו יקרים, והיתרון שלהם מורגש בעיקר באזורים שבהם נוסף שטח ירוק משמעותי. יש הטוענים כי לפני ההשקעה בפתרונות יש למפות את האזורים החמים ביותר בעיר, כדי שהמשאבים המוגבלים יופנו אליהם."},{id:"ob",title:"למה קשה לוותר על חפצים ישנים",text:"רבים מאיתנו שומרים בבית חפצים שלא השתמשו בהם שנים: בגדים שאינם מתאימים, כלים שנשברו, ספרים שלא נקראו. פסיכולוגים מציעים כמה הסברים. ההסבר הראשון מכונה אפקט הבעלות: אנשים מעריכים חפץ שבבעלותם יותר ממה שהיו מוכנים לשלם עבורו אילו רצו לקנות אותו. ההסבר השני קשור לכאב ההפסד: ויתור על חפץ נתפס כהפסד, וההפסד כואב יותר מהרווח שבפינוי מקום. ההסבר השלישי הוא רגשי: חפצים מזכירים אירועים ואנשים, ולכן הוויתור עליהם מרגיש כוויתור על הזיכרון עצמו. מומחים לארגון הבית ממליצים לשאול לגבי כל פריט אם היה נרכש שוב היום. מי שעונה בשלילה, מוטב שיוותר עליו, ואם הוא סנטימנטלי, ישמור תצלום שלו במקום את החפץ."},{id:"cn",title:"Cities and noise",text:"Researchers who study urban life have long known that noise affects health, but a recent project measured the effect more precisely. For two years they placed small sensors on streets in a large city and compared the sound levels with local hospital records. They found that people who lived near the loudest roads visited doctors more often for sleep problems and high blood pressure. The authors point out, however, that busy roads also bring air pollution, so noise may not be the only cause. They suggest that planting trees and lowering speed limits could help with both problems at once.",en:!0}],vocab:[{id:0,w:"להפיג",m:"להקל, לגרום להיעלמות או להחלשה (למשל: להפיג מתח)"},{id:1,w:"מתון",m:"שקול, לא קיצוני"},{id:2,w:"נחרץ",m:"החלטי, נחוש"},{id:3,w:"שקדן",m:"אדם שמתמיד בלימוד או בעבודה"},{id:4,w:"להסתייג",m:"להביע הסכמה חלקית, להכניס סייג"},{id:5,w:"לגבב",m:"לאסוף ולצבור בלי סדר"},{id:6,w:"מרוכז",m:"ממוקד, קשוב; גם: מקובץ במקום אחד"},{id:7,w:"סתמי",m:"לא מיוחד, לא חשוב; נאמר בלי כוונה מיוחדת"},{id:8,w:"גלוי",m:"שאינו מוסתר, ידוע לכול"},{ אלות יש בערך 52 שניות לשאלה, ובפרק כמותי של 20 שאלות דקה לשאלה.","עברו על כל הפרק במעבר ראשון. שאלה שלא מתקדמת תוך כדקה, סמנו בעיפרון וחזרו אליה.","לפי מאל״ו הציון נקבע לפי תשובות נכונות בלבד ואין הפחתה על תשובה שגויה. לכן עונים על כל השאלות. אם נשארו שניות, נחשו.","לפני ניחוש נסו לפסול שתי תשובות. זה מכפיל את סיכוי הניחוש מ־25% ל־50%.","סדר השאלות בכל סוג עולה בקושי, ולכן השאלות האחרונות בכל סוג הן הקשות. אל תשקיעו שלוש דקות בשאלה אחת."]},{title:"אנלוגיות",items:["שלב ראשון: נסחו במשפט את היחס בין שתי המילים המודגשות לפני שאתם קוראים את התשובות.","אם כמה תשובות מתאימות, דייקו את המשפט: הוסיפו כיוון (מי לפני מי) ותכונה (עוצמה, תפקיד).","הכיוון חשוב. חלק ומכלול אינו מכלול וחלק.","פסלו תשובות שיש בהן יחס מקורב אבל לא זהה, למשל תוצאה במקום סיבה.","מילה לא מוכרת: חפשו בה שורש או מילה קרובה. אם לא מצליחים, פסלו לפי שאר הזוגות."]},{title:"הבנה והסקה",items:["אל תוסיפו מידע. מה שלא נאמר בטקסט אינו נובע ממנו.","שאלות חיזוק והחלשה: זהו קודם מה הטענה ומה ההנחה. החלשה נוגעת בהנחה או מציעה הסבר חלופי.","קורלציה אינה סיבתיות. חפשו גורם שלישי או היפוך כיוון.","בשאלות השלמה קראו את המילים שמקשרות (אבל, ואילו, לכן, אף על פי). הן קובעות אם הצד השני דומה או הפוך.","בשאלות לוגיות כתבו סימנים: כל = תנאי, לא נובע מההיפוך. שלילת התוצאה מובילה לשלילת התנאי."]},{title:"הבנת הנקרא",items:["קראו קודם את השאלות, אחר כך את הקטע, כדי לדעת מה לחפש. אם זה לא מתאים לכם, קראו את הקטע פעם אחת ברצף ובדקו את השאלות לפי הסדר.","השאלות מסודרות לפי סדר הופעת הנושא בקטע, ולכן הפתרון יתקדם בקטע.","חפשו בקטע משפט שמוכיח את התשובה. אם אין, התשובה כנראה שגויה.","תשובות עם מילים כמו תמיד, אף פעם, רק ובוודאות חשודות, אלא אם הקטע אומר כך במפורש.","שאלות מילה בהקשר: הציבו את המילה החלופית במשפט וראו אם המשפט שומר על משמעותו."]},{title:"מטלת הכתיבה",items:["משך המטלה 30 דקות בעברית. תקצבו 5 דקות לתכנון, 20 לכתיבה ו־5 לעריכה.","מבנה מומלץ: פתיחה קצרה עם עמדה, שתי עד שלוש פסקאות נימוק, כל אחת עם דוגמה, וסיום קצר.","מאל״ו מעריכה את התוכן (רלוונטיות, ביסוס, חשיבה ביקורתית, ארגון) ואת הלשון (בהירות, סגנון עיוני, תקינות, דיוק, עושר). כל חיבור נבדק בנפרד על ידי שני מעריכים.","מטלת הכתיבה היא 25% מהציון המילולי. לא ניתן לה ציון נפרד.","באפליקציה אין ציון למטלת הכתיבה. יש רק רשימת בדיקה עצמית."]},{title:"חשיבה כמותית",items:["הידע הנדרש אינו עולה על מתמטיקה ברמת 3 יחידות. רוב הנוסחאות מופיעות בדף הנוסחאות בבחינה.","בשאלות אחוזים והשוואות בחרו מספר נוח, בדרך כלל 100.","בשאלות מילוליות הגדירו נעלם, כתבו משוואה, ואז בדקו אם התשובה הגיונית.","בשאלות גאומטריה סרטטו, גם אם יש שרטוט, והוסיפו עליו את הנתונים.","כשהפתרון האלגברי ארוך, הציבו את התשובות במשוואה והתחילו מהאפשרות האמצעית.","בשאלות טבלה וגרף קראו כותרות, יחידות ושנים לפני החישוב."]},{title:"טעויות נפוצות",items:["חישוב אחוזים מהבסיס הלא נכון.","ממוצע של ממוצעים בלי משקלים.","מהירות ממוצעת כממוצע חשבוני של שתי מהירויות.","אי בדיקה אם התוצאה הגיונית לפני הבחירה, למשל מחיר שגדל אחרי הנחה.","בלבול בין תנאי להיפוכו: אם א אז ב אינו אומר אם ב אז א.","תשובה שמופיעה בקטע אבל אינה עונה על השאלה."]}],Ki={analogy:[["חלק ומכלול","עלה : עץ"],["כלי ותפקיד","מסננת : סינון"],["בעל מקצוע וכלי","נגר : פטיש"],["סיבה ותוצאה","בדיחה : צחוק"],["דרגה (עוצמה)","קר : קפוא"],["ניגוד","נדיב : קמצן"],["יוצר ויצירה","מלחין : סימפוניה"],["מוצר וחומר גלם","בגד : בד"],["שם קיבוצי","עדר : כבשים"],["צורך ומילוי הצורך","צמא : שתייה"],["מוכר וסחורה","ירקן : ירקות"],["מתחיל ומתפתח","זרע : צמח"]],logic:[["אם א אז ב. א קרה.","ב קרה. תקף."],["אם א אז ב. ב לא קרה.","א לא קרה. תקף."],["אם א אז ב. ב קרה.","אי אפשר לדעת על א. לא תקף."],["אם א אז ב. א לא קרה.","אי אפשר לדעת על ב. לא תקף."],["כל א הם ב.","לא נובע שכל ב הם א."],["רק א יכול ב.","ב הוא תנאי הכרחי: מי שב, בהכרח א."],["מחקר מצא קשר בין א לב.","לא מוכיח ש־א גורם ל־ב."]],quant:[["אחוז","חלק \xF7 שלם \xD7 100. שינוי באחוזים = (חדש − ישן) \xF7 ישן."],["שני אחוזים ברצף","מכפילים מקדמים: העלאה ב־20% והורדה ב־20% נותנות 1.2 \xD7 0.8 = 0.96."],["יחס","חלק אחד = סכום \xF7 סכום חלקי היחס."],["ממוצע","סכום \xF7 כמות. ממוצע משוקלל: סכום המכפלות \xF7 סך המשקלות."],["מהירות","דרך = מהירות \xD7 זמן. מהירות ממוצעת = דרך כוללת \xF7 זמן כולל."],["הספק","עבודה משותפת: 1/א + 1/ב = 1/ביחד."],["חזקות","a^m \xD7 a^n = a^(m+n). a^m \xF7 a^n = a^(m−n). (a^m)^n = a^(mn)."],["שורשים","√a \xD7 √b = √(ab)."],["כפל מקוצר","(a+b)(a−b) = a\xB2 − b\xB2. (a+b)\xB2 = a\xB2 + 2ab + b\xB2."],["מלבן","שטח = אורך \xD7 רוחב. היקף = 2(אורך + רוחב)."],["משולש","שטח = בסיס \xD7 גובה \xF7 2. סכום זוויות = 180\xB0. פיתגורס: a\xB2 + b\xB2 = c\xB2."],["מעגל","שטח = πr\xB2. היקף = 2πr."],["תיבה","נפח = אורך \xD7 רוחב \xD7 גובה. הגדלה פי k של כל המידות: נפח פי k\xB3, שטח פי k\xB2."],["קומבינטוריקה","כפל אפשרויות לבחירות בלתי תלויות. תמורות של n: n!. צירופים: n! \xF7 (k!(n−k)!)."],["הסתברות","מאורעות רצופים בלי החזרה: מכפילים הסתברויות לפי מה שנשאר."],["מספרים עוקבים","הממוצע של מספרים עוקבים הוא האמצעי."],["מרחק בין נקודות","√((x₂−x₁)\xB2 + (y₂−y₁)\xB2)."]]},Ju=["כתבתי עמדה ברורה בפתיחה","כל פסקה מתמקדת בנימוק אחד","יש לפחות דוגמה אחת קונקרטית","התייחסתי לטענה הנגדית ולמה היא פחות משכנעת","המשפטים קצרים וברורים, בלי חזרות","הסגנון עיוני ולא שיחתי","בדקתי כתיב ופיסוק בדקה האחרונה"],Ja=["יש הטוענים שצריך להפוך את הלימודים בבית הספר לוולונטריים אחרי כיתה י. האם אתם מסכימים? נמקו.","האם מדינה צריכה להגביל את זמן המסך של ילדים? כתבו חיבור שמציג עמדה ומנמק אותה.","האם עדיף לקבל החלטות חשובות לבד או בהתייעצות? הסבירו.","טענה: חדשות בעולם דיגיטלי הפכו לשטחיות. הסבירו מדוע אתם מסכימים או חולקים."],Uv=[["שבוע 1","הכירו את הבחינה, עברו על דף הנוסחאות והטיפים. פתרו תרגול בנושאים כמותיים בסיסיים (אחוזים, יחס, ממוצע) וסריקת אוצר מילים."],["שבוע 2","אנלוגיות והבנה והסקה. תרגלו כל יום 10 שאלות. חזרו על כל השאלות שטעיתם בהן וכתבו משפט אחד שמסביר מה טעיתם."],["שבוע 3","הבנת הנקרא וכמותי מתקדם (הספק, דרך, גאומטריה, קומבינטוריקה). פרק אחד מדוד בזמן בכל יום."],["שבוע 4","סימולציה מלאה, ניתוח טעויות, מטלת כתיבה אחת, ופרק או שניים מבחינה רשמית להתנסות."]];</script>

/* ---------- simulation ---------- */
function shuffle(l){var t=l.slice();for(var a=t.length-1;a>0;a--){var u=Math.floor(Math.random()*(a+1));var x=t[a];t[a]=t[u];t[u]=x}return t}

function secs(endAt){return Math.max(0,Math.ceil((endAt-Date.now())/1000))}

function results(p){var V=DATA.mock.v1.concat(DATA.mock.v2),Q=DATA.mock.q1.concat(DATA.mock.q2);return {V:V,Q:Q,vc:cnt(V,p.ans),qc:cnt(Q,p.ans),xc:cnt(DATA.mock.x,p.ans)}}

}

function wc(t){return t.trim()?t.trim().split(/\s+/).length:0}

/* ---------- routing / render ---------- */
var ROUTES={home:vHome,practice:vPractice,qbank:vQbank,vocab:vVocab,writing:vWriting,tips:vTips,sources:vSources,stats:vStats,profile:vProfile,sim:vSim};
var NAV=[['home','בית'],['practice','תרגול'],['sim','סימולציה'],['stats','ניתוח'],['profile','פרופיל']];
var NAVOF={home:'home',practice:'practice',qbank:'practice',vocab:'practice',writing:'practice',tips:'practice',sim:'sim',stats:'stats',profile:'profile',sources:'profile'};
function cur(){var h=(location.hash||'#/home').replace(/^#\//,'').split(':');return {r:ROUTES[h[0]]?h[0]:'home',a:h[1]}}
function go(to){var p=to.split(':');
  if(p[0]==='qbank'){if(p[1]==='wrong'){UI.filter='wrong';UI.topic='';var w=SEC.filter(function(s){return s.qs.some(function(q){return prog[q.id]===2})})[0];UI.qs=w?w.k:UI.qs;UI.idx=0}else if(p[1]){UI.qs=p[1];UI.filter='all';UI.topic='';UI.idx=0}}

window.addEventListener('hashchange',function(){UI.m={};UI.t0=Date.now();render()});

/* ---------- events ---------- */
function pickAnswer(q,i){

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(g.getAttribute('data-go'));return}
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id'),i=+b.getAttribute('data-i');
  switch(a){
  case 'pick':{var q=ALLQ.filter(function(x){return x.id===id})[0];if(UI.m[id]!==undefined)return;var fw=UI.filter==='wrong';pickAnswer(q,i);if(fw){var t=today();t.w=(t.w||0)+1;saveProf()}render();break}
  case 'sec':UI.qs=b.getAttribute('data-k');UI.idx=0;UI.topic='';UI.m={};UI.t0=Date.now();render();break;
  case 'filt':UI.filter=b.getAttribute('data-f');UI.idx=0;render();break;
  case 'goq':UI.idx=+b.getAttribute('data-n');UI.t0=Date.now();render();window.scrollTo(0,0);break;
  case 'prev':UI.idx=Math.max(0,UI.idx-1);UI.t0=Date.now();render();window.scrollTo(0,0);break;
  case 'next':UI.idx++;UI.t0=Date.now();render();window.scrollTo(0,0);break;
  case 'retry':{var l=filtered(),q2=l[UI.idx];delete UI.m[q2.id];delete sel[q2.id];sv('psy.sel.v1',sel);UI.t0=Date.now();render();break}
  case 'resume':{var k=prof.last&&prof.last.k||'an';UI.qs=k;UI.filter='new';UI.topic='';UI.idx=0;if(!filtered().length){UI.filter='all'}UI.m={};UI.t0=Date.now();location.hash='#/qbank';render();break}
  case 'editdate':UI.editDate=true;render();break;
  case 'setdate':prof.examDate=b.getAttribute('data-d');UI.editDate=false;saveProf();render();break;
  case 'cleardate':prof.examDate='';saveProf();render();break;
  case 'essaynext':UI.essayI=(UI.essayI+1)%Ja.length;UI.wchk=Ju.map(function(){return false});render();break;
  case 'vscan':case 'vdrill':{var seen=new Set(vs.known.concat(vs.miss));UI.vq=a==='vscan'?DATA.vocab.filter(function(w){return !seen.has(w.id)}).map(function(w){return w.id}):vs.miss.slice();UI.vmode=a==='vscan'?'scan':'drill';UI.vflip=false;render();break}
  case 'vmenu':UI.vmode='menu';UI.vconf=false;render();break;
  case 'vreset':if(!UI.vconf){UI.vconf=true}else{vs={known:[],miss:[]};sv('psy.vocab.v1',vs);UI.vconf=false}render();break;
  case 'vflip':UI.vflip=true;render();break;
  case 'vknow':case 'vdont':{if(!UI.vflip)return;var v=UI.vq[0],k2=a==='vknow',K=new Set(vs.known),M=new Set(vs.miss);if(k2){K.add(v);M.delete(v)}else{M.add(v);K.delete(v)}
    vs={known:Array.from(K).sort(function(x,y){return x-y}),miss:Array.from(M).sort(function(x,y){return x-y})};sv('psy.vocab.v1',vs);
    var d=UI.vq.slice(1);UI.vq=(UI.vmode==='drill'&&!k2)?d.concat([v]):d;UI.vflip=false;var tt=today();tt.v=(tt.v||0)+1;tt.a=1;saveProf();render();break}
  case 'simstart':{var tm=$('#testmode')&&$('#testmode').checked;run={phase:'writing',test:tm,ch:-1,dur:tm?15:1200,endAt:Date.now()+(tm?15:1800)*1000,ans:{},order:shuffle(['v1','q1','v2','q2','x']),essay:'',pi:Math.floor(Math.random()*Ja.length),wc:Ju.map(function(){return false})};saveRun();render();break}
  case 'simnext':run=Object.assign({},run,{phase:'chapter',ch:run.ch+1,endAt:Date.now()+run.dur*1000});saveRun();render();window.scrollTo(0,0);break;
  case 'simfin':finish(run);window.scrollTo(0,0);break;
  case 'simpick':{run.ans[id]=i;saveRun();var box=b.parentNode;Array.prototype.forEach.call(box.children,function(x,n){x.className='opt'+(n===i?' sel':'')});var T=DATA.mock[run.order[run.ch]];var el=$('#answered');if(el)el.textContent='נענו '+T.filter(function(x){return run.ans[x.id]!==undefined}).length+' מתוך '+T.length;break}
  case 'simfilter':UI.simWrong=!UI.simWrong;render();break;
  case 'simreset':if(!UI.simConfirm){UI.simConfirm=true}else{run=null;UI.simConfirm=false;saveRun()}render();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='topic'){UI.topic=t.value;UI.idx=0;render()}
  else if(t.id==='exd'){prof.examDate=t.value;UI.editDate=false;saveProf();render()}
  else if(t.id==='pname'){prof.name=t.value.trim()||'עמית';saveProf();render()}
  else if(t.getAttribute('data-act')==='wchk'){UI.wchk[+t.getAttribute('data-i')]=t.checked}
  else if(t.getAttribute('data-act')==='simwc'){run.wc[+t.getAttribute('data-i')]=t.checked;saveRun()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='essay'){run.essay=t.value;saveRun();var w=$('#wc');if(w)w.textContent=wc(t.value)+' מילים. התיבה מוגבלת ל־5,000 תווים כדי שהטקסט יישמר במכשיר.'}
  else if(t.id==='cv'||t.id==='cq'){var a=Math.min(46,Math.max(0,parseInt($('#cv').value||'0',10)||0)),b=Math.min(40,Math.max(0,parseInt($('#cq').value||'0',10)||0));$('#cout').textContent='מילולי: '+a+' מתוך 46 ('+pct(a,46)+'%) · כמותי: '+b+' מתוך 40 ('+pct(b,40)+'%)'}
});
setInterval(function(){
  if(!run||(run.phase!=='chapter'&&run.phase!=='writing'))return;
  if(Date.now()>=run.endAt){finish(run);return}
  var el=$('#tm');if(el&&cur().r==='sim'){var s=secs(run.endAt);el.textContent=fmt(s);el.parentNode.className='timer'+((run.phase==='writing'?s<=120:(s<=120&&run.dur>60)||s<=5)?' low':'')}
},250);
UI.t0=Date.now();
render();
})();
</script>
