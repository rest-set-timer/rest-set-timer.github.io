<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<title>טיימר מנוחה חכם</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0f14'/%3E%3Ctext y='70' x='50' font-size='56' text-anchor='middle'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d0f14; --card:#171b23; --card2:#1e232e; --line:#262c38;
  --txt:#f2f5f9; --dim:#8b93a3; --accent:#b4ff39; --accent2:#22d3ee;
  --danger:#ff5c5c; --ok:#34d399;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system, "SF Pro Text", "Segoe UI", Arial, sans-serif;
  font-size:16px; touch-action:manipulation; overscroll-behavior:none;
  display:flex; flex-direction:column; height:100dvh;
}
header{
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;
  text-align:center; flex:0 0 auto;
}
header h1{font-size:20px; margin:0; font-weight:800; letter-spacing:.3px;}
header h1 span{color:var(--accent);}
main{flex:1 1 auto; overflow-y:auto; padding:6px 14px calc(78px + var(--safe-b)); -webkit-overflow-scrolling:touch;}
section[hidden]{display:none;}

/* ---- timer card ---- */
#timerCard{
  background:linear-gradient(160deg, var(--card2), var(--card));
  border:1px solid var(--line); border-radius:22px;
  padding:18px 16px 16px; margin-bottom:14px; text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.35);
}
#timerCard.idle .t-body{display:none;}
#timerCard .t-hint{color:var(--dim); font-size:15px; padding:14px 4px; display:none;}
#timerCard.idle .t-hint{display:block;}
#tExercise{font-size:15px; color:var(--dim); margin-bottom:2px; min-height:20px;}
#tClock{font-size:76px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.05; letter-spacing:1px;}
#tClock.done{color:var(--accent); animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#tDoneMsg{display:none; font-size:22px; font-weight:800; color:var(--accent); margin:2px 0 6px;}
#tDoneMsg.show{display:block;}
#tSub{color:var(--dim); font-size:14px; margin-top:4px; min-height:18px;}
#tBar{height:8px; border-radius:6px; background:#0a0c10; margin:14px 4px 4px; overflow:hidden;}
#tBarFill{height:100%; width:100%; border-radius:6px; background:var(--accent2); transition:width .25s linear; transform-origin:right;}
#tBarFill.done{background:var(--accent);}
.t-btns{display:flex; gap:10px; margin-top:14px;}
.t-btns button{
  flex:1; border:1px solid var(--line); background:var(--card); color:var(--txt);
  border-radius:14px; padding:13px 0; font-size:16px; font-weight:700; cursor:pointer;
}
.t-btns button:active{background:var(--card2);}
#tSkip{color:var(--dim);}

/* ---- log form ---- */
.card{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px; margin-bottom:14px;}
label.f{display:block; color:var(--dim); font-size:13px; font-weight:700; margin:12px 2px 6px;}
label.f:first-child{margin-top:0;}
#exInput{
  width:100%; background:#0a0c10; border:1.5px solid var(--line); color:var(--txt);
  border-radius:14px; padding:13px 14px; font-size:17px; font-weight:600; outline:none;
}
#exInput:focus{border-color:var(--accent2);}
#acList{margin-top:6px; display:none; flex-wrap:wrap; gap:8px;}
#acList.show{display:flex;}
#acList button{
  background:var(--card2); border:1px solid var(--line); color:var(--txt);
  border-radius:999px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer;
}
#acList button:active{background:#262d3a;}
.seg{display:flex; background:#0a0c10; border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.seg button{
  flex:1; background:transparent; border:none; color:var(--dim);
  padding:12px 0; font-size:16px; font-weight:700; cursor:pointer;
}
.seg button.on{background:var(--accent2); color:#06202a;}
.stepper{display:flex; align-items:stretch; gap:10px;}
.stepper button{
  width:58px; border:1px solid var(--line); background:var(--card2); color:var(--accent);
  border-radius:14px; font-size:26px; font-weight:800; cursor:pointer;
}
.stepper button:active{background:#2a3240;}
.stepper input{
  flex:1; min-width:0; text-align:center; background:#0a0c10; border:1.5px solid var(--line);
  color:var(--txt); border-radius:14px; font-size:22px; font-weight:800; padding:10px 0; outline:none;
}
#rpeRow{display:grid; grid-template-columns:repeat(10,1fr); gap:6px;}
#rpeRow button{
  aspect-ratio:1; border:1px solid var(--line); background:#0a0c10; color:var(--dim);
  border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; padding:0;
}
#rpeRow button.on{background:var(--accent); border-color:var(--accent); color:#16210a; font-weight:900;}
#rpeHint{color:var(--dim); font-size:12.5px; margin-top:6px; min-height:16px;}
#logBtn{
  width:100%; margin-top:16px; border:none; border-radius:16px; padding:17px 0;
  background:var(--accent); color:#16210a; font-size:19px; font-weight:900; cursor:pointer;
  box-shadow:0 6px 20px rgba(180,255,57,.22);
}
#logBtn:active{transform:scale(.985);}
#logBtn.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---- history ---- */
h3.day{margin:18px 4px 8px; font-size:15px; color:var(--dim); font-weight:800;}
.setRow{
  display:flex; align-items:center; gap:10px; background:var(--card);
  border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:8px;
}
.setRow .info{flex:1; min-width:0;}
.setRow .ex{font-weight:800; font-size:16px;}
.setRow .meta{color:var(--dim); font-size:13.5px; margin-top:2px;}
.setRow .rest{font-size:12.5px; color:var(--accent2); background:#0c1a1e; border-radius:999px; padding:4px 10px; white-space:nowrap;}
.setRow .del{border:none; background:transparent; color:var(--dim); font-size:18px; cursor:pointer; padding:6px;}
.empty{color:var(--dim); text-align:center; padding:34px 20px; font-size:15px; line-height:1.7;}

/* ---- learn ---- */
.learnRow{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px;}
.learnRow .t{font-weight:800; font-size:16px;}
.learnRow .v{color:var(--dim); font-size:14px; margin-top:4px; line-height:1.6;}
.learnRow .v b{color:var(--accent); font-size:16px;}
.note{color:var(--dim); font-size:13.5px; line-height:1.7; background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:14px 16px; margin-bottom:14px;}

/* ---- tab bar ---- */
nav{
  position:fixed; bottom:0; right:0; left:0; z-index:10;
  display:flex; background:rgba(13,15,20,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding-bottom:var(--safe-b);
}
nav button{
  flex:1; background:none; border:none; color:var(--dim);
  padding:12px 0 10px; font-size:13px; font-weight:700; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .ic{font-size:21px;}
nav button.on{color:var(--accent);}
</style>
</head>
<body>
<header><h1>🏋️ טיימר מנוחה <span>חכם</span></h1></header>
<main>
  <section id="view-train">
    <div id="timerCard" class="idle">
      <div class="t-hint">רשום סט כדי להתחיל טיימר מנוחה ⏱️</div>
      <div class="t-body">
        <div id="tExercise"></div>
        <div id="tClock">0:00</div>
        <div id="tDoneMsg">💪 מוכן לסט הבא!</div>
        <div id="tSub"></div>
        <div id="tBar"><div id="tBarFill"></div></div>
        <div class="t-btns">
          <button id="tMinus">־15 שנ׳</button>
          <button id="tSkip">דלג</button>
          <button id="tPlus">+15 שנ׳</button>
        </div>
      </div>
    </div>

    <div class="card">
      <label class="f" for="exInput">תרגיל</label>
      <input id="exInput" type="text" placeholder="למשל: לחיצת ספסל" autocomplete="off" autocorrect="off">
      <div id="acList"></div>

      <label class="f">סוג תרגיל</label>
      <div class="seg" id="typeSeg">
        <button data-t="compound" class="on">מתחם 🏋️</button>
        <button data-t="isolation">בידוד 💪</button>
      </div>

      <label class="f" for="wInput">משקל (ק״ג)</label>
      <div class="stepper">
        <button id="wMinus">־</button>
        <input id="wInput" type="text" inputmode="decimal" value="0">
        <button id="wPlus">+</button>
      </div>

      <label class="f" for="rInput">חזרות</label>
      <div class="stepper">
        <button id="rMinus">־</button>
        <input id="rInput" type="text" inputmode="numeric" value="8">
        <button id="rPlus">+</button>
      </div>

      <label class="f">עצימות (RPE)</label>
      <div id="rpeRow"></div>
      <div id="rpeHint"></div>
      <button id="logBtn">סיימתי סט — התחל מנוחה ⏱️</button>
    </div>
  </section>

  <section id="view-history" hidden></section>
  <section id="view-learn" hidden></section>
</main>
<nav>
  <button data-v="train" class="on"><span class="ic">🏋️</span>אימון</button>
  <button data-v="history"><span class="ic">📋</span>היסטוריה</button>
  <button data-v="learn"><span class="ic">🧠</span>מה למדתי</button>
</nav>

<script>
"use strict";
/* ---------- storage ---------- */
const LS = {sets:'rt_sets', ex:'rt_ex', learn:'rt_learn', timer:'rt_timer'};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let sets  = load(LS.sets, []);
let exDB  = load(LS.ex, {});
let learn = load(LS.learn, {});
let timer = load(LS.timer, null);

/* ---------- exercise dictionary (type defaults) ---------- */
const DICT = {
  "סקוואט":"compound","דדליפט":"compound","דדליפט סומו":"compound","דדליפט רומני":"compound",
  "סקוואט קדמי":"compound","לחיצת ספסל":"compound","לחיצת ספסל בשיפוע":"compound",
  "לחיצת כתפיים":"compound","חתירה":"compound","חתירה במשקולת":"compound","משיכת גחן":"compound",
  "עליות מתח":"compound","מקבילים":"compound","לחיצת רגליים":"compound","פשיטת ירך":"compound",
  "לאנג׳ים":"compound","האק סקוואט":"compound","עליות מקבילים":"compound","חתירה בפולי תחתון":"compound",
  "כפיפת מרפקים":"isolation","כפיפת מרפקים בפולי":"isolation","פשיטת מרפקים":"isolation",
  "פשיטת מרפקים בפולי":"isolation","הרחקת כתפיים":"isolation","הרחקת כתפיים בפולי":"isolation",
  "פרפר":"isolation","פרפר בפולי":"isolation","הרמת שוקיים":"isolation","כפיפת שוקיים":"isolation",
  "פשיטת שוקיים":"isolation","קרל מוט":"isolation","קרל פטיש":"isolation","פליי קדמי":"isolation",
  "הרחקת ירכיים":"isolation","קרוסאובר":"isolation","הרמת שוקיים עומד":"isolation"
};
const bucket = rpe => rpe>=9 ? "high" : rpe>=7 ? "med" : "low";
const catKey = (type,rpe) => type+"-"+bucket(rpe);
const CAT_HE = {high:"גבוהה (9–10)", med:"בינונית (7–8)", low:"נמוכה (1–6)"};
const TYPE_HE = {compound:"מתחם", isolation:"בידוד"};

/* ---------- suggestion ---------- */
function rawSuggest(type,rpe,reps){
  let s = type==="compound" ? 150 : 90;
  s += (rpe-6)*15;
  if(reps<=6) s+=20; else if(reps>=13) s-=10;
  return Math.max(30, Math.round(s/5)*5);
}
function suggest(type,rpe,reps){
  const raw = rawSuggest(type,rpe,reps);
  const L = learn[catKey(type,rpe)];
  if(L && L.count>=2){
    const w = Math.min(0.25 + L.count*0.05, 0.75);   // יותר נתונים = יותר אמון בלמידה
    return Math.max(30, Math.round((raw*(1-w) + L.avg*w)/5)*5);
  }
  return raw;
}
function recordRest(prevSet, seconds){
  const k = catKey(prevSet.type, prevSet.rpe);
  const L = learn[k] || {avg:seconds, count:0};
  L.avg = Math.round((L.avg*L.count + seconds)/(L.count+1));
  L.count++;
  learn[k]=L; save(LS.learn,learn);
}

/* ---------- elements ---------- */
const $=s=>document.querySelector(s);
const exInput=$("#exInput"), acList=$("#acList");
const wInput=$("#wInput"), rInput=$("#rInput");
const timerCard=$("#timerCard"), tClock=$("#tClock"), tSub=$("#tSub"),
      tExercise=$("#tExercise"), tBarFill=$("#tBarFill"), tDoneMsg=$("#tDoneMsg");

let curType="compound", curRpe=8;

/* ---------- audio + vibration (iOS: unlock on first gesture) ---------- */
let AC=null;
function unlockAudio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
  }catch(e){}
}
window.addEventListener("pointerdown", unlockAudio, {passive:true});
function beep(times){
  if(!AC) return;
  for(let i=0;i<times;i++){
    const t0=AC.currentTime + i*0.35;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="square"; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.5,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0+0.3);
  }
}
function vibrate(){ try{ if(navigator.vibrate) navigator.vibrate([280,90,280,90,420]); }catch(e){} }

/* ---------- helpers ---------- */
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const num=(v,fb)=>{v=parseFloat(String(v).replace(",","."));return isFinite(v)?v:fb;};

/* ---------- autocomplete ---------- */
function allExercises(){
  const fromHist=Object.keys(exDB);
  const merged=[...fromHist, ...Object.keys(DICT).filter(e=>!fromHist.includes(e))];
  return merged;
}
function renderAC(){
  const q=exInput.value.trim();
  let list=allExercises();
  if(q) list=list.filter(e=>e.includes(q));
  list=list.slice(0,8);
  if(!list.length){acList.className=""; acList.innerHTML=""; return;}
  acList.innerHTML="";
  list.forEach(e=>{
    const b=document.createElement("button");
    b.textContent=e;
    b.addEventListener("click",()=>{selectExercise(e);});
    acList.appendChild(b);
  });
  acList.className="show";
}
function selectExercise(name){
  exInput.value=name; acList.className=""; acList.innerHTML="";
  const saved=exDB[name];
  setType(saved?saved.type:(DICT[name]||"compound"));
  if(saved){wInput.value=saved.weight; rInput.value=saved.reps; setRpe(saved.rpe);}
}
exInput.addEventListener("input",renderAC);
exInput.addEventListener("focus",renderAC);
exInput.addEventListener("blur",()=>setTimeout(()=>{acList.className="";},180));

/* ---------- controls ---------- */
function setType(t){
  curType=t;
  document.querySelectorAll("#typeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
}
document.querySelectorAll("#typeSeg button").forEach(b=>b.addEventListener("click",()=>setType(b.dataset.t)));

function step(input,delta,min){
  input.value=Math.max(min, Math.round((num(input.value,0)+delta)*10)/10);
}
$("#wMinus").addEventListener("click",()=>step(wInput,-2.5,0));
$("#wPlus").addEventListener("click",()=>step(wInput,2.5,0));
$("#rMinus").addEventListener("click",()=>step(rInput,-1,0));
$("#rPlus").addEventListener("click",()=>step(rInput,1,0));

const RPE_HE={1:"קל מאוד",2:"קל מאוד",3:"קל",4:"קל",5:"בינוני",6:"בינוני+",7:"קשה",8:"קשה מאוד",9:"כמעט מקסימום",10:"מקסימום 💀"};
const rpeRow=$("#rpeRow");
for(let i=1;i<=10;i++){
  const b=document.createElement("button");
  b.textContent=i; b.dataset.v=i;
  b.addEventListener("click",()=>setRpe(i));
  rpeRow.appendChild(b);
}
function setRpe(v){
  curRpe=v;
  document.querySelectorAll("#rpeRow button").forEach(b=>b.classList.toggle("on",+b.dataset.v===v));
  $("#rpeHint").textContent=v+" — "+RPE_HE[v];
}
setRpe(8);

/* ---------- logging ---------- */
$("#logBtn").addEventListener("click",()=>{
  unlockAudio();
  const ex=exInput.value.trim();
  if(!ex){
    $("#logBtn").classList.add("shake");
    setTimeout(()=>$("#logBtn").classList.remove("shake"),350);
    exInput.focus(); return;
  }
  const weight=Math.max(0,num(wInput.value,0));
  const reps=Math.max(0,Math.round(num(rInput.value,0)));
  const rpe=curRpe, type=curType, now=Date.now();
  const s=suggest(type,rpe,reps);
  const set={id:now, ts:now, exercise:ex, type, weight, reps, rpe, suggested:s};

  // למידה: כמה זמן באמת נח מהסט הקודם (אותו אימון)
  const prev=sets[sets.length-1];
  if(prev){
    const gap=Math.round((now-prev.ts)/1000);
    if(gap>=25 && gap<=15*60){
      prev.actualRest=gap;
      recordRest(prev,gap);
    }
  }
  sets.push(set); save(LS.sets,sets);
  exDB[ex]={type,weight,reps,rpe,count:(exDB[ex]?exDB[ex].count+1:1)};
  save(LS.ex,exDB);
  startTimer(s,ex);
  renderHistory(); renderLearn();
});

/* ---------- timer (wall-clock based: שורד נעילת מסך ורענון) ---------- */
function startTimer(dur,exercise){
  timer={endAt:Date.now()+dur*1000, duration:dur, exercise, done:false, alerted:false};
  save(LS.timer,timer); renderTimer();
}
function adjustTimer(delta){
  if(!timer) return;
  timer.endAt=Math.max(Date.now()+5000, timer.endAt+delta*1000);
  timer.duration+=delta;
  if(timer.done && timer.endAt>Date.now()){timer.done=false; timer.alerted=false;}
  save(LS.timer,timer); renderTimer();
}
$("#tMinus").addEventListener("click",()=>adjustTimer(-15));
$("#tPlus").addEventListener("click",()=>adjustTimer(15));
$("#tSkip").addEventListener("click",()=>{timer=null; save(LS.timer,timer); renderTimer();});

function renderTimer(){
  if(!timer){timerCard.className="idle"; return;}
  timerCard.className="";
  const remain=(timer.endAt-Date.now())/1000;
  tExercise.textContent=timer.exercise||"";
  if(remain>0 && !timer.done){
    tClock.textContent=fmt(remain);
    tClock.classList.remove("done");
    tDoneMsg.classList.remove("show");
    tSub.textContent="מנוחה מומלצת: "+fmt(timer.duration);
    tBarFill.style.width=Math.min(100,(remain/timer.duration)*100)+"%";
    tBarFill.classList.remove("done");
  }else{
    if(!timer.done){timer.done=true; save(LS.timer,timer);}
    if(!timer.alerted){timer.alerted=true; save(LS.timer,timer); beep(3); vibrate();}
    const over=Math.round(-remain);
    tClock.textContent="0:00";
    tClock.classList.add("done");
    tDoneMsg.classList.add("show");
    tSub.textContent=over>3 ? "עבר "+fmt(over)+" מסוף המנוחה" : "המנוחה הסתיימה";
    tBarFill.style.width="100%";
    tBarFill.classList.add("done");
  }
}
setInterval(renderTimer,250);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderTimer();});
window.addEventListener("pageshow",renderTimer);
window.addEventListener("focus",renderTimer);

/* ---------- history ---------- */
function renderHistory(){
  const v=$("#view-history"); v.innerHTML="";
  if(!sets.length){v.innerHTML='<div class="empty">עוד לא נרשמו אימונים.<br>רשום את הסט הראשון שלך! 💪</div>'; return;}
  const byDay={};
  sets.forEach(s=>{
    const d=new Date(s.ts).toDateString();
    (byDay[d]=byDay[d]||[]).push(s);
  });
  Object.keys(byDay).sort((a,b)=>new Date(b)-new Date(a)).forEach(d=>{
    const h=document.createElement("h3"); h.className="day";
    h.textContent=new Date(d).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
    v.appendChild(h);
    byDay[d].slice().sort((a,b)=>a.ts-b.ts).forEach(s=>{
      const row=document.createElement("div"); row.className="setRow";
      const info=document.createElement("div"); info.className="info";
      info.innerHTML='<div class="ex"></div><div class="meta"></div>';
      info.querySelector(".ex").textContent=s.exercise;
      info.querySelector(".meta").textContent=
        s.weight+" ק״ג × "+s.reps+" חזרות · עצימות "+s.rpe+" · "+TYPE_HE[s.type];
      row.appendChild(info);
      if(s.actualRest){
        const r=document.createElement("span"); r.className="rest";
        r.textContent="מנוחה "+fmt(s.actualRest);
        row.appendChild(r);
      }
      const del=document.createElement("button"); del.className="del"; del.textContent="✕";
      del.addEventListener("click",()=>{
        if(confirm("למחוק את הסט?")){sets=sets.filter(x=>x.id!==s.id); save(LS.sets,sets); renderHistory();}
      });
      row.appendChild(del);
      v.appendChild(row);
    });
  });
}

/* ---------- learn view ---------- */
function renderLearn(){
  const v=$("#view-learn"); v.innerHTML="";
  const totalSets=sets.length;
  const days=new Set(sets.map(s=>new Date(s.ts).toDateString())).size;
  const learned=Object.keys(learn).filter(k=>learn[k].count>0);
  const note=document.createElement("div"); note.className="note";
  note.textContent="אחרי כל סט אני רושם כמה זמן באמת נחת, לפי סוג התרגיל והעצימות. ההמלצה הבאה משלבת את מה שלמדתי עליך — ככל שתתאמן יותר, היא מדויקת יותר.";
  v.appendChild(note);
  const stats=document.createElement("div"); stats.className="learnRow";
  stats.innerHTML='<div class="t">📊 סטטיסטיקה</div><div class="v">סה״כ <b>'+totalSets+'</b> סטים · <b>'+days+'</b> אימונים</div>';
  v.appendChild(stats);
  if(!learned.length){
    const e=document.createElement("div"); e.className="empty";
    e.textContent="עוד אין מספיק נתונים. אחרי כמה סטים אתחיל ללמוד את קצב ההתאוששות שלך 🧠";
    v.appendChild(e); return;
  }
  learned.sort().forEach(k=>{
    const [type,b]=k.split("-");
    const L=learn[k];
    const raw=rawSuggest(type, b==="high"?9:b==="med"?8:5, 8);
    const row=document.createElement("div"); row.className="learnRow";
    row.innerHTML='<div class="t"></div><div class="v"></div>';
    row.querySelector(".t").textContent=TYPE_HE[type]+" · עצימות "+CAT_HE[b];
    row.querySelector(".v").innerHTML=
      "מנוחה בפועל בממוצע: <b>"+fmt(L.avg)+"</b> ("+L.count+" סטים)<br>"+
      "ברירת מחדל: "+fmt(raw)+" → ההמלצות שלך כבר מותאמות אישית ✅";
    v.appendChild(row);
  });
}

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
    ["train","history","learn"].forEach(v=>{
      document.getElementById("view-"+v).hidden = v!==b.dataset.v;
    });
    if(b.dataset.v==="history")renderHistory();
    if(b.dataset.v==="learn")renderLearn();
  });
});

/* ---------- init ---------- */
renderTimer();
renderHistory();
renderLearn();

/* ---------- test hooks (harmless in production) ---------- */
window.__rt={
  get timer(){return timer;},
  setEndIn(sec){ if(timer){timer.endAt=Date.now()+sec*1000; timer.done=false; timer.alerted=false; save(LS.timer,timer); renderTimer();} },
  setPrevSetAge(sec){ if(sets.length){sets[sets.length-1].ts=Date.now()-sec*1000; save(LS.sets,sets);} },
  state(){return {sets,exDB,learn,timer};}
};
</script>
